<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 390" width="420" height="390" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>The carousel torus as a square with opposite edges glued: turn loop γ1, bob loop γ2, and one turn of the ride path</title>
  <rect x="0" y="0" width="420" height="390" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d1d1d"/>
    </marker>
  </defs>
  <!-- the square 0 to 2 pi in theta (across) and psi (up), 47.7465 px per radian -->
  <rect x="60" y="30" width="300" height="300" fill="#f4f4f4" stroke="#1d1d1d" stroke-width="2"/>
  <!-- glue marks: single arrows on bottom and top, double on left and right -->
  <line x1="190" y1="330" x2="225" y2="330" stroke="#1d1d1d" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="190" y1="30" x2="225" y2="30" stroke="#1d1d1d" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="60" y1="200" x2="60" y2="170" stroke="#1d1d1d" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="60" y1="185" x2="60" y2="155" stroke="#1d1d1d" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="360" y1="200" x2="360" y2="170" stroke="#1d1d1d" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="360" y1="185" x2="360" y2="155" stroke="#1d1d1d" stroke-width="2" marker-end="url(#arr)"/>
  <!-- ride path theta = t, psi = 3t, one turn: three segments -->
  <line x1="60" y1="330" x2="160" y2="30" stroke="#264653" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="160" y1="330" x2="260" y2="30" stroke="#264653" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="260" y1="330" x2="360" y2="30" stroke="#264653" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- turn loop at psi = 1, bob loop at theta = 1 -->
  <line x1="60" y1="282.25" x2="360" y2="282.25" stroke="#e76f51" stroke-width="3"/>
  <line x1="107.75" y1="330" x2="107.75" y2="30" stroke="#2a9d8f" stroke-width="3"/>
  <text x="284" y="302" fill="#b5462b">turn loop γ1</text>
  <text x="107.75" y="22" text-anchor="middle" fill="#1f7a70">bob loop γ2</text>
  <text x="268" y="120" fill="#264653">ride path</text>
  <!-- axes -->
  <text x="60" y="350" text-anchor="middle">0</text>
  <text x="160" y="350" text-anchor="middle">2.09</text>
  <text x="260" y="350" text-anchor="middle">4.19</text>
  <text x="360" y="350" text-anchor="middle">6.28</text>
  <text x="210" y="375" text-anchor="middle">platform angle θ (rad)</text>
  <text x="50" y="334" text-anchor="end">0</text>
  <text x="50" y="286" text-anchor="end">1</text>
  <text x="50" y="34" text-anchor="end">6.28</text>
  <text x="22" y="180" text-anchor="middle" transform="rotate(-90 22 180)">crank phase ψ (rad)</text>
</svg>
