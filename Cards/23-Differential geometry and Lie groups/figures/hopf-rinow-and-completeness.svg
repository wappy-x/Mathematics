<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Eight great-circle routes from London all reach its antipode after 20,015 km</title>
  <rect x="0" y="0" width="420" height="420" fill="#ffffff"/>
  <circle cx="210" cy="200" r="160" fill="none" stroke="#1d1d1d" stroke-width="2"/>
  <!-- back halves (headings 180, 225, 270, 315), dashed -->
  <g fill="none" stroke="#7a7a7a" stroke-width="1.5" stroke-dasharray="6 5">
    <path d="M 210 40 A 150.4 160 0 0 0 210 360"/>
    <path d="M 210 40 A 67.6 160 0 0 0 210 360"/>
    <path d="M 210 40 A 54.7 160 0 0 1 210 360"/>
    <path d="M 210 40 A 145.0 160 0 0 1 210 360"/>
  </g>
  <!-- front halves (headings 0, 45, 90, 135), solid -->
  <g fill="none" stroke="#c0392b" stroke-width="2.5">
    <path d="M 210 40 A 150.4 160 0 0 1 210 360"/>
    <path d="M 210 40 A 67.6 160 0 0 1 210 360"/>
    <path d="M 210 40 A 54.7 160 0 0 0 210 360"/>
    <path d="M 210 40 A 145.0 160 0 0 0 210 360"/>
  </g>
  <circle cx="210" cy="40" r="5" fill="#1d1d1d"/>
  <circle cx="210" cy="360" r="5" fill="#1d1d1d"/>
  <text x="210" y="24" text-anchor="middle" fill="#1d1d1d">London</text>
  <text x="210" y="384" text-anchor="middle" fill="#1d1d1d">antipode (51.51° S, 179.87° E)</text>
  <text stroke="#ffffff" stroke-width="4" paint-order="stroke" x="352" y="196" fill="#1d1d1d">N</text>
  <text stroke="#ffffff" stroke-width="4" paint-order="stroke" x="281" y="196" fill="#1d1d1d">NE</text>
  <text stroke="#ffffff" stroke-width="4" paint-order="stroke" x="152" y="196" text-anchor="end" fill="#1d1d1d">E</text>
  <text stroke="#ffffff" stroke-width="4" paint-order="stroke" x="74" y="196" text-anchor="end" fill="#1d1d1d">SE</text>
  <text x="210" y="408" text-anchor="middle" fill="#1d1d1d">every route: 20,015.09 km</text>
</svg>
