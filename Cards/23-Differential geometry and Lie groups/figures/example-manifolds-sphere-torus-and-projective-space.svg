<svg viewBox="0 0 440 260" xmlns="http://www.w3.org/2000/svg" width="440" height="260" style="color:#24292f">
<title>A slice through the globe along London's meridian, to scale at 100 units per Earth radius of 6371 km: the ray from the North Pole through London meets the equator's plane 18248 km from the centre, and the ray from the South Pole through London meets it 2224 km from the centre</title>
<rect x="0" y="0" width="440" height="260" rx="8" fill="#ffffff"/>
<circle cx="120" cy="130" r="100" fill="none" stroke="currentColor" stroke-width="2"/>
<line x1="10" y1="130" x2="430" y2="130" stroke="currentColor" stroke-width="1" stroke-dasharray="5,4"/>
<line x1="120" y1="30" x2="406.41" y2="130" stroke="#c0392b" stroke-width="1.5"/>
<line x1="120" y1="230" x2="182.24" y2="51.73" stroke="#1f6fb2" stroke-width="1.5"/>
<circle cx="120" cy="30" r="3.5" fill="currentColor"/>
<circle cx="120" cy="230" r="3.5" fill="currentColor"/>
<circle cx="120" cy="130" r="2.5" fill="currentColor"/>
<circle cx="182.24" cy="51.73" r="4" fill="currentColor"/>
<circle cx="406.41" cy="130" r="4" fill="#c0392b"/>
<circle cx="154.91" cy="130" r="4" fill="#1f6fb2"/>
<text x="120" y="20" font-size="13" text-anchor="middle" fill="currentColor">North Pole</text>
<text x="120" y="250" font-size="13" text-anchor="middle" fill="currentColor">South Pole</text>
<text x="190" y="47" font-size="13" fill="currentColor">London</text>
<text x="104" y="146" font-size="12" text-anchor="end" fill="currentColor">centre</text>
<text x="406.41" y="150" font-size="12" text-anchor="middle" fill="#c0392b">18248 km</text>
<text x="162" y="150" font-size="12" fill="#1f6fb2">2224 km</text>
<text x="330" y="122" font-size="12" text-anchor="middle" fill="currentColor">plane of the equator</text>
</svg>
