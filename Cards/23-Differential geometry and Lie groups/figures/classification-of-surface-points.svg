<svg viewBox="0 0 420 270" xmlns="http://www.w3.org/2000/svg" width="420" height="270" style="color:#24292f">
<title>A pasta ring cut through its axis, drawn to scale at 30 pixels per millimetre: two tube circles of radius 1.5 mm centred 4 mm either side of the axis; the outer half of each tube is dome, the inner half is saddle, and the top and bottom points are trough points where a plate touches the ring</title><rect x="0" y="0" width="420" height="270" rx="8" fill="#ffffff"/>
<line x1="210" y1="30" x2="210" y2="100" stroke="currentColor" stroke-width="1" stroke-dasharray="3,4"/>
<line x1="20" y1="155" x2="400" y2="155" stroke="currentColor" stroke-width="1" stroke-dasharray="1,3"/>
<line x1="90" y1="110" x2="330" y2="110" stroke="currentColor" stroke-width="0.8" stroke-dasharray="2,3"/>
<path d="M 330 65 A 45 45 0 0 1 330 155" fill="none" stroke="currentColor" stroke-width="4"/>
<path d="M 330 155 A 45 45 0 0 1 330 65" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6,4"/>
<path d="M 90 155 A 45 45 0 0 1 90 65" fill="none" stroke="currentColor" stroke-width="4"/>
<path d="M 90 65 A 45 45 0 0 1 90 155" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6,4"/>
<circle cx="90" cy="110" r="2.5" fill="currentColor"/>
<circle cx="330" cy="110" r="2.5" fill="currentColor"/>
<circle cx="90" cy="65" r="5" fill="currentColor"/>
<circle cx="90" cy="155" r="5" fill="currentColor"/>
<circle cx="330" cy="65" r="5" fill="currentColor"/>
<circle cx="330" cy="155" r="5" fill="currentColor"/>
<text x="210" y="22" font-size="13" text-anchor="middle" fill="currentColor">axis of the ring</text>
<text x="384" y="100" font-size="13" fill="currentColor">dome</text>
<text x="36" y="100" font-size="13" text-anchor="end" fill="currentColor">dome</text>
<text x="272" y="104" font-size="13" text-anchor="end" fill="currentColor">saddle</text>
<text x="148" y="104" font-size="13" fill="currentColor">saddle</text>
<text x="330" y="52" font-size="13" text-anchor="middle" fill="currentColor">trough</text>
<text x="90" y="52" font-size="13" text-anchor="middle" fill="currentColor">trough</text>
<text x="210" y="172" font-size="12" text-anchor="middle" fill="currentColor">plate, touching the bottom trough circle</text>
<text x="210" y="128" font-size="12" text-anchor="middle" fill="currentColor">tube centres 8 mm apart</text>
<line x1="45" y1="215" x2="375" y2="215" stroke="currentColor" stroke-width="1"/>
<line x1="45" y1="209" x2="45" y2="221" stroke="currentColor" stroke-width="1"/>
<line x1="375" y1="209" x2="375" y2="221" stroke="currentColor" stroke-width="1"/>
<text x="210" y="208" font-size="12" text-anchor="middle" fill="currentColor">ring 11 mm across</text>
<line x1="135" y1="245" x2="285" y2="245" stroke="currentColor" stroke-width="1"/>
<line x1="135" y1="239" x2="135" y2="251" stroke="currentColor" stroke-width="1"/>
<line x1="285" y1="239" x2="285" y2="251" stroke="currentColor" stroke-width="1"/>
<text x="210" y="262" font-size="12" text-anchor="middle" fill="currentColor">hole 5 mm across</text>
</svg>
