<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="680" height="290">
<title>Weight diagrams of the SU(3) representations 3, 8 and 10, drawn to scale</title>
<rect x="0" y="0" width="680" height="290" fill="#ffffff"/>
<line x1="10" y1="130" x2="210" y2="130" stroke="#bbbbbb" stroke-width="1"/>
<line x1="110" y1="55" x2="110" y2="245" stroke="#bbbbbb" stroke-width="1"/>
<polygon points="140.0,112.7 80.0,112.7 110.0,164.6" fill="none" stroke="#1d1d1d" stroke-width="1.5"/>
<circle cx="80.0" cy="112.7" r="5" fill="#1d1d1d"/>
<circle cx="110.0" cy="164.6" r="5" fill="#1d1d1d"/>
<circle cx="140.0" cy="112.7" r="5" fill="#1d1d1d"/>
<text x="110" y="28" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#1d1d1d">3: quark, (1, 0)</text>
<line x1="230" y1="130" x2="430" y2="130" stroke="#bbbbbb" stroke-width="1"/>
<line x1="330" y1="55" x2="330" y2="245" stroke="#bbbbbb" stroke-width="1"/>
<polygon points="390.0,130.0 360.0,78.0 300.0,78.0 270.0,130.0 300.0,182.0 360.0,182.0" fill="none" stroke="#1d1d1d" stroke-width="1.5"/>
<circle cx="270.0" cy="130.0" r="5" fill="#1d1d1d"/>
<circle cx="300.0" cy="182.0" r="5" fill="#1d1d1d"/>
<circle cx="300.0" cy="78.0" r="5" fill="#1d1d1d"/>
<circle cx="330.0" cy="130.0" r="5" fill="#1d1d1d"/>
<circle cx="330.0" cy="130.0" r="10" fill="none" stroke="#1d1d1d" stroke-width="1.5"/>
<circle cx="360.0" cy="182.0" r="5" fill="#1d1d1d"/>
<circle cx="360.0" cy="78.0" r="5" fill="#1d1d1d"/>
<circle cx="390.0" cy="130.0" r="5" fill="#1d1d1d"/>
<text x="330" y="28" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#1d1d1d">8: gluon, (1, 1)</text>
<line x1="460" y1="130" x2="660" y2="130" stroke="#bbbbbb" stroke-width="1"/>
<line x1="560" y1="55" x2="560" y2="245" stroke="#bbbbbb" stroke-width="1"/>
<polygon points="650.0,78.0 470.0,78.0 560.0,233.9" fill="none" stroke="#1d1d1d" stroke-width="1.5"/>
<circle cx="470.0" cy="78.0" r="5" fill="#1d1d1d"/>
<circle cx="500.0" cy="130.0" r="5" fill="#1d1d1d"/>
<circle cx="530.0" cy="182.0" r="5" fill="#1d1d1d"/>
<circle cx="530.0" cy="78.0" r="5" fill="#1d1d1d"/>
<circle cx="560.0" cy="233.9" r="5" fill="#1d1d1d"/>
<circle cx="560.0" cy="130.0" r="5" fill="#1d1d1d"/>
<circle cx="590.0" cy="182.0" r="5" fill="#1d1d1d"/>
<circle cx="590.0" cy="78.0" r="5" fill="#1d1d1d"/>
<circle cx="620.0" cy="130.0" r="5" fill="#1d1d1d"/>
<circle cx="650.0" cy="78.0" r="5" fill="#1d1d1d"/>
<text x="560" y="28" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#1d1d1d">10: flavour decuplet, (3, 0)</text>
<text x="340" y="278" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1d1d">Each dot is a weight; the ringed centre of the 8 holds two states. Same scale in all three panels.</text>
</svg>
