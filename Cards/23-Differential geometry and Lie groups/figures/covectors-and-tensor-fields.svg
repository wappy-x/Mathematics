<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 480" width="440" height="480" font-family="Helvetica, Arial, sans-serif">
<title>The pressure differential at London as straight isobars 1 hPa apart, with the wind arrow and the shortest 1 hPa step</title>
<rect x="0" y="0" width="440" height="480" fill="#ffffff"/>
<defs><clipPath id="box"><rect x="25" y="25" width="390" height="390"/></clipPath>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1d"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5462b"/></marker></defs>
<rect x="25" y="25" width="390" height="390" fill="#ffffff" stroke="#1d1d1d" stroke-width="1"/>
<g clip-path="url(#box)">
<line x1="-186.1" y1="364.7" x2="367.1" y2="-185.2" stroke="#4a4a4a" stroke-width="1.1" stroke-dasharray="5 4"/>
<line x1="-121.3" y1="429.8" x2="431.9" y2="-120.1" stroke="#4a4a4a" stroke-width="1.1" stroke-dasharray="5 4"/>
<line x1="-56.6" y1="494.9" x2="496.6" y2="-54.9" stroke="#4a4a4a" stroke-width="1.8" stroke-dasharray=""/>
<line x1="8.1" y1="560.1" x2="561.3" y2="10.2" stroke="#4a4a4a" stroke-width="1.1" stroke-dasharray="5 4"/>
<line x1="72.9" y1="625.2" x2="626.1" y2="75.3" stroke="#4a4a4a" stroke-width="1.1" stroke-dasharray="5 4"/>
</g>
<text x="62.5" y="265.1" font-size="12" fill="#1d1d1d">−1 hPa</text>
<text x="127.2" y="330.2" font-size="12" fill="#1d1d1d">1000.78 hPa</text>
<text x="191.9" y="395.4" font-size="12" fill="#1d1d1d">+1 hPa</text>
<text x="40.0" y="157.9" font-size="12" fill="#1d1d1d">−2 hPa</text>
<text x="330.0" y="387.6" font-size="12" fill="#1d1d1d">+2 hPa</text>
<line x1="220.0" y1="220.0" x2="277.63" y2="61.69" stroke="#1d1d1d" stroke-width="2.4" marker-end="url(#ah)"/>
<line x1="220.0" y1="220.0" x2="284.74" y2="285.13" stroke="#b5462b" stroke-width="2.4" marker-end="url(#ag)"/>
<circle cx="220.0" cy="220.0" r="4" fill="#1d1d1d"/>
<text x="162.0" y="224.0" font-size="13" fill="#1d1d1d">London</text>
<text x="285.6" y="67.7" font-size="12" fill="#1d1d1d">wind, 3 hours</text>
<text x="285.6" y="82.7" font-size="12" fill="#1d1d1d">129.6 km</text>
<text x="294" y="302" font-size="12" fill="#b5462b">+1 hPa step</text>
<text x="294" y="317" font-size="12" fill="#b5462b">70.64 km, 135°</text>
<line x1="25" y1="432" x2="155" y2="432" stroke="#1d1d1d" stroke-width="1.5"/><line x1="25" y1="428" x2="25" y2="436" stroke="#1d1d1d"/><line x1="155" y1="428" x2="155" y2="436" stroke="#1d1d1d"/>
<text x="165" y="436" font-size="12" fill="#1d1d1d">100 km</text>
<text x="35" y="44" font-size="13" fill="#1d1d1d">N ↑</text>
<text x="25" y="462" font-size="12" fill="#1d1d1d">300 km square around London, north up, 1.3 px per km</text>
</svg>
