<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340">
  <title>Dome-tent panel of radius 1.5 m with its hem, a 30 degree vent circle and the normal pointing off the sphere, orthographic view from 25 degrees above the horizon, 120 px per metre</title>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d1d1d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="480" height="340" fill="#ffffff"/>
  <path d="M 60 230 A 180 180 0 0 1 420 230" fill="none" stroke="#1d1d1d" stroke-width="2"/>
  <path d="M 60 230 A 180 76.1 0 0 1 420 230" fill="none" stroke="#1d1d1d" stroke-width="1.2" stroke-dasharray="5 4"/>
  <path d="M 420 230 A 180 76.1 0 0 1 60 230" fill="none" stroke="#1d1d1d" stroke-width="2.5"/>
  <path d="M 186.9 58.0 A 90 38 0 0 1 293.1 58.0" fill="none" stroke="#1d1d1d" stroke-width="1.2" stroke-dasharray="5 4"/>
  <path d="M 293.1 58.0 A 90 38 0 1 1 186.9 58.0" fill="none" stroke="#1d1d1d" stroke-width="1.8"/>
  <line x1="215" y1="306.1" x2="265" y2="306.1" stroke="#1d1d1d" stroke-width="2" marker-end="url(#head)"/>
  <line x1="265" y1="126.7" x2="215" y2="126.7" stroke="#1d1d1d" stroke-width="1.8" marker-end="url(#head)"/>
  <line x1="367.3" y1="114.6" x2="409.7" y2="76.2" stroke="#1d1d1d" stroke-width="2" marker-end="url(#head)"/>
  <circle cx="367.3" cy="114.6" r="3" fill="#1d1d1d"/>
  <line x1="240" y1="230" x2="420" y2="230" stroke="#1d1d1d" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="330" y="245" font-family="sans-serif" font-size="13" fill="#1d1d1d">R = 1.5 m</text>
  <text x="240" y="328" font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="middle">hem: walked anticlockwise seen from above</text>
  <text x="240" y="152" font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="middle">vent edge at 30°: walked the other way</text>
  <text x="398" y="66" font-family="sans-serif" font-size="13" fill="#1d1d1d">normal</text>
  <text x="240" y="40" font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="middle">dome-tent panel M, the upper half of a sphere</text>
</svg>
