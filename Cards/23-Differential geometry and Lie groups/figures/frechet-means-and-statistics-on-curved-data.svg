<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" width="440" height="220" font-family="Helvetica, Arial, sans-serif">
<title>Six rock-core directions: their bearings on a compass circle, and their full directions mapped by the logarithm map at the Frechet mean</title>
<rect x="0" y="0" width="440" height="220" fill="#ffffff"/>
<text x="100" y="14" font-size="9" text-anchor="middle" fill="#1d1d1d">Bearings alone, on the circle</text>
<circle cx="100" cy="110" r="70" fill="none" stroke="#1d1d1d" stroke-width="0.8"/>
<line x1="100" y1="36" x2="100" y2="44" stroke="#1d1d1d" stroke-width="0.8"/>
<line x1="100" y1="176" x2="100" y2="184" stroke="#1d1d1d" stroke-width="0.8"/>
<line x1="26" y1="110" x2="34" y2="110" stroke="#1d1d1d" stroke-width="0.8"/>
<line x1="166" y1="110" x2="174" y2="110" stroke="#1d1d1d" stroke-width="0.8"/>
<text x="100" y="30" font-size="8" text-anchor="middle" fill="#1d1d1d">N</text>
<text x="100" y="195" font-size="8" text-anchor="middle" fill="#1d1d1d">S</text>
<text x="20" y="113" font-size="8" text-anchor="middle" fill="#1d1d1d">W</text>
<text x="180" y="113" font-size="8" text-anchor="middle" fill="#1d1d1d">E</text>
<circle cx="76.1" cy="44.2" r="2.6" fill="#1d1d1d"/>
<circle cx="87.8" cy="41.1" r="2.6" fill="#1d1d1d"/>
<circle cx="93.9" cy="40.3" r="2.6" fill="#1d1d1d"/>
<circle cx="106.1" cy="40.3" r="2.6" fill="#1d1d1d"/>
<circle cx="112.2" cy="41.1" r="2.6" fill="#1d1d1d"/>
<circle cx="135.0" cy="49.4" r="2.6" fill="#1d1d1d"/>
<line x1="100" y1="110" x2="102.0" y2="40.0" stroke="#1d1d1d" stroke-width="1.4"/>
<line x1="100" y1="110" x2="98.0" y2="180.0" stroke="#1d1d1d" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="105" y="76" font-size="8" fill="#1d1d1d">Frechet mean</text>
<text x="105" y="86" font-size="8" fill="#1d1d1d">1.67°</text>
<text x="96" y="124" font-size="8" text-anchor="end" fill="#1d1d1d">number average</text>
<text x="96" y="134" font-size="8" text-anchor="end" fill="#1d1d1d">181.67°, dashed</text>
<text x="100" y="212" font-size="8" text-anchor="middle" fill="#333">dots: bearings 340, 350, 355, 5, 10, 30°</text>
<line x1="215" y1="10" x2="215" y2="210" stroke="#c8c8c8" stroke-width="0.6"/>
<text x="330" y="14" font-size="9" text-anchor="middle" fill="#1d1d1d">Full directions, log map at the mean</text>
<circle cx="330" cy="110" r="40" fill="none" stroke="#c8c8c8" stroke-width="0.6"/>
<circle cx="330" cy="110" r="80" fill="none" stroke="#c8c8c8" stroke-width="0.6"/>
<line x1="245" y1="110" x2="415" y2="110" stroke="#c8c8c8" stroke-width="0.6"/>
<line x1="330" y1="25" x2="330" y2="195" stroke="#c8c8c8" stroke-width="0.6"/>
<text x="372" y="122" font-size="7" fill="#555">10°</text>
<text x="412" y="122" font-size="7" fill="#555">20°</text>
<text x="415" y="106" font-size="8" text-anchor="end" fill="#1d1d1d">clockwise →</text>
<text x="334" y="31" font-size="8" fill="#1d1d1d">↑ steeper</text>
<line x1="276.3" y1="167.1" x2="383.7" y2="52.9" stroke="#1d1d1d" stroke-width="1.2" stroke-dasharray="6 3"/>
<circle cx="283.0" cy="144.9" r="2.6" fill="#1d1d1d"/>
<circle cx="312.3" cy="118.2" r="2.6" fill="#1d1d1d"/>
<circle cx="322.0" cy="135.1" r="2.6" fill="#1d1d1d"/>
<circle cx="342.0" cy="98.7" r="2.6" fill="#1d1d1d"/>
<circle cx="353.1" cy="109.3" r="2.6" fill="#1d1d1d"/>
<circle cx="367.7" cy="53.7" r="2.6" fill="#1d1d1d"/>
<text x="274" y="141" font-size="8" text-anchor="end" fill="#1d1d1d">1</text>
<text x="305" y="124" font-size="8" text-anchor="end" fill="#1d1d1d">2</text>
<text x="318" y="147" font-size="8" text-anchor="end" fill="#1d1d1d">3</text>
<text x="339" y="92" font-size="8" text-anchor="end" fill="#1d1d1d">4</text>
<text x="358" y="106" font-size="8" fill="#1d1d1d">5</text>
<text x="373" y="56" font-size="8" fill="#1d1d1d">6</text>
<rect x="326.5" y="106.5" width="7" height="7" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.2"/>
<text x="330" y="212" font-size="8" text-anchor="middle" fill="#333">square: the mean; dashed: leading geodesic</text>
</svg>
