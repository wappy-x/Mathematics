<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" width="460" height="250" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>Hammersley's sofa to scale: two quarter discs of radius 1, a block 4/pi wide, and a half-disc hole of radius 2/pi, beside the semicircle sofa</title>
  <rect x="0" y="0" width="460" height="250" fill="#ffffff"/>
  <!-- scale: 120 px per hallway width; origin (inner corner of the hole) at (230, 170) -->
  <path d="M 33.61 170 A 120 120 0 0 1 153.61 50 L 306.39 50 A 120 120 0 0 1 426.39 170 L 306.39 170 A 76.39 76.39 0 0 0 153.61 170 Z" fill="#e9c46a" fill-opacity="0.45" stroke="#1d1d1d" stroke-width="2"/>
  <path d="M 110 170 A 120 120 0 0 1 350 170" fill="none" stroke="#264653" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="153.61" y1="50" x2="153.61" y2="170" stroke="#1d1d1d" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="306.39" y1="50" x2="306.39" y2="170" stroke="#1d1d1d" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="230" y1="170" x2="283.99" y2="116.01" stroke="#1d1d1d" stroke-width="1"/>
  <text x="262" y="150" fill="#1d1d1d">2/π ≈ 0.6366</text>
  <text x="48" y="140" fill="#1d1d1d">quarter disc</text>
  <text x="48" y="155" fill="#1d1d1d">radius 1</text>
  <text x="352" y="140" fill="#1d1d1d">quarter disc</text>
  <text x="352" y="155" fill="#1d1d1d">radius 1</text>
  <text x="186" y="70" fill="#1d1d1d">block 4/π × 1</text>
  <text x="196" y="188" fill="#264653">hole: half disc</text>
  <line x1="33.61" y1="215" x2="426.39" y2="215" stroke="#1d1d1d" stroke-width="1"/>
  <line x1="33.61" y1="209" x2="33.61" y2="221" stroke="#1d1d1d" stroke-width="1"/>
  <line x1="426.39" y1="209" x2="426.39" y2="221" stroke="#1d1d1d" stroke-width="1"/>
  <text x="150" y="238" fill="#1d1d1d">outer width 2 + 4/π ≈ 3.2732</text>
  <text x="222" y="36" fill="#264653">dashed: semicircle sofa, radius 1</text>
</svg>
