<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320" font-family="Helvetica, Arial, sans-serif">
  <title>Three bus routes forming a sunflower: core Central and Market, petals Airport, Harbour and Stadium (schematic)</title>
  <rect x="0" y="0" width="420" height="320" fill="#ffffff"/>
  <g fill="none" stroke="#1d1d1d" stroke-width="2">
    <ellipse cx="210.0" cy="95.0" rx="80" ry="40" transform="rotate(270 210.0 95.0)"/>
    <ellipse cx="275.0" cy="207.5" rx="80" ry="40" transform="rotate(30 275.0 207.5)"/>
    <ellipse cx="145.0" cy="207.5" rx="80" ry="40" transform="rotate(150 145.0 207.5)"/>
  </g>
  <circle cx="210" cy="170" r="34" fill="#f1f1f1" stroke="#1d1d1d" stroke-width="1.5" stroke-dasharray="5 3"/>
  <g fill="#1d1d1d" font-size="13" text-anchor="middle">
    <text x="210" y="166">Central</text>
    <text x="210" y="182">Market</text>
    <text x="210" y="62">Airport</text>
    <text x="307" y="230">Harbour</text>
    <text x="113" y="230">Stadium</text>
    <text x="258" y="40" font-size="12" text-anchor="start">Route A</text>
    <text x="352" y="282" font-size="12">Route B</text>
    <text x="68" y="282" font-size="12">Route C</text>
    <text x="210" y="312" font-size="12">dashed circle: the core, shared by every pair of routes</text>
  </g>
</svg>
