<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 370" width="620" height="370" font-family="Helvetica, Arial, sans-serif" font-size="12">
<title>Least cost u(x) from a breakdown at km x: rises at 30 dollars per km to the 120 dollar tow fee at km 4, flat to km 6, falls to 0 at km 10; lines of slope 0 to 30 touch it from above at the kink at km 4; a dotted phantom-garage sawtooth dips to 0 at km 5</title>
<rect x="0" y="0" width="620" height="370" fill="#ffffff"/>
<line x1="60" y1="300" x2="560" y2="300" stroke="#111" stroke-width="1"/>
<line x1="60" y1="300" x2="60" y2="60" stroke="#111" stroke-width="1"/>
<text x="60" y="316" text-anchor="middle" fill="#111">0</text>
<text x="160" y="316" text-anchor="middle" fill="#111">2</text>
<text x="260" y="316" text-anchor="middle" fill="#111">4</text>
<text x="310" y="316" text-anchor="middle" fill="#111">5</text>
<text x="360" y="316" text-anchor="middle" fill="#111">6</text>
<text x="460" y="316" text-anchor="middle" fill="#111">8</text>
<text x="560" y="316" text-anchor="middle" fill="#111">10</text>
<text x="310" y="358" text-anchor="middle" fill="#111">place of the breakdown x, km (garages at 0 and 10)</text>
<text x="52" y="304" text-anchor="end" fill="#111">0</text>
<text x="52" y="244" text-anchor="end" fill="#111">40</text>
<text x="52" y="184" text-anchor="end" fill="#111">80</text>
<text x="52" y="124" text-anchor="end" fill="#111">120</text>
<text x="52" y="64" text-anchor="end" fill="#111">160</text>
<text x="20" y="180" text-anchor="middle" transform="rotate(-90 20 180)" fill="#111">least cost u(x), dollars</text>
<line x1="60" y1="120" x2="560" y2="120" stroke="#555" stroke-width="1" stroke-dasharray="6 4"/>
<text x="556" y="112" text-anchor="end" fill="#111">tow fee 120</text>
<polyline points="60,300 185,187.5 310,300 435,187.5 560,300" fill="none" stroke="#444" stroke-width="1.5" stroke-dasharray="2 3"/>
<text x="310" y="204" text-anchor="middle" fill="#111">dotted: phantom garage, 0 at km 5</text>
<polyline points="60,300 260,120 360,120 560,300" fill="none" stroke="#111" stroke-width="3"/>
<line x1="210" y1="165" x2="310" y2="75" stroke="#333" stroke-width="1.2"/>
<line x1="210" y1="142.5" x2="310" y2="97.5" stroke="#333" stroke-width="1.2"/>
<line x1="210" y1="120" x2="310" y2="120" stroke="#333" stroke-width="1.2"/>
<circle cx="260" cy="120" r="3.5" fill="#111"/>
<text x="318" y="72" fill="#111">lines of slope 0, 15, 30 touch from above at km 4</text>
<line x1="260" y1="300" x2="360" y2="300" stroke="#111" stroke-width="6"/>
<text x="310" y="334" text-anchor="middle" fill="#111">stop and tow: km 4 to 6</text>
<text x="120" y="230" text-anchor="end" fill="#111">u, drive</text>
</svg>
