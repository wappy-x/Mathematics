<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" width="580" height="400" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Characteristics of cars bunching behind a red light: lines from free traffic and from the queue run into each other, meet at 10 s and 550 m before the light, and a shock moves back at 18 km/h</title>
  <rect x="0" y="0" width="580" height="400" fill="#ffffff"/>
  <!-- to scale: 400 px per km across (x = -1.1 km at 60 px, 0 km at 500 px), 10 px per s up (t = 0 at 340 px) -->
  <g stroke="#1d1d1d" stroke-width="1.2" fill="none">
    <line x1="60" y1="340" x2="540" y2="340"/>
    <line x1="60" y1="340" x2="60" y2="30"/>
    <line x1="100" y1="340" x2="100" y2="345"/><line x1="300" y1="340" x2="300" y2="345"/><line x1="500" y1="340" x2="500" y2="345"/>
    <line x1="55" y1="240" x2="60" y2="240"/><line x1="55" y1="140" x2="60" y2="140"/><line x1="55" y1="40" x2="60" y2="40"/>
  </g>
  <g fill="#1d1d1d" text-anchor="middle">
    <text x="100" y="360">−1.0</text><text x="300" y="360">−0.5</text><text x="500" y="360">0</text>
    <text x="300" y="385">place x (km), the light at 0</text>
  </g>
  <g fill="#1d1d1d" text-anchor="end">
    <text x="50" y="344">0</text><text x="50" y="244">10</text><text x="50" y="144">20</text><text x="50" y="44">30</text>
  </g>
  <text x="18" y="190" fill="#1d1d1d" transform="rotate(-90 18 190)" text-anchor="middle">time t (s)</text>
  <!-- free traffic at 30 cars/km: wave speed +54 km/h -->
  <g stroke="#2a9d8f" stroke-width="1.6">
    <line x1="100" y1="340" x2="250" y2="90"/>
    <line x1="140" y1="340" x2="260" y2="140"/>
    <line x1="180" y1="340" x2="270" y2="190"/>
    <line x1="220" y1="340" x2="280" y2="240"/>
  </g>
  <!-- braking zone: every line meets at (-0.55 km, 10 s) -->
  <g stroke="#264653" stroke-width="1.6" stroke-dasharray="5 3">
    <line x1="260" y1="340" x2="280" y2="240"/>
    <line x1="300" y1="340" x2="280" y2="240"/>
    <line x1="340" y1="340" x2="280" y2="240"/>
  </g>
  <!-- queue at 150 cars/km: wave speed -90 km/h -->
  <g stroke="#2a9d8f" stroke-width="1.6">
    <line x1="380" y1="340" x2="280" y2="240"/>
    <line x1="420" y1="340" x2="270" y2="190"/>
    <line x1="460" y1="340" x2="260" y2="140"/>
    <line x1="500" y1="340" x2="250" y2="90"/>
  </g>
  <!-- the shock: queue tail moving back at 18 km/h -->
  <line x1="280" y1="240" x2="240" y2="40" stroke="#e76f51" stroke-width="3.5"/>
  <circle cx="280" cy="240" r="4" fill="#e76f51"/>
  <line x1="500" y1="340" x2="500" y2="30" stroke="#1d1d1d" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="505" y="30" fill="#1d1d1d">red light</text>
  <text x="410" y="226" fill="#1d1d1d">dot: breaks at</text>
  <text x="410" y="242" fill="#1d1d1d">10 s, −0.55 km</text>
  <text x="160" y="32" fill="#1d1d1d">shock, −18 km/h</text>
  <text x="68" y="120" fill="#1d1d1d">free flow, 30 cars/km</text>
  <text x="345" y="110" fill="#1d1d1d">queue, 150 cars/km</text>
</svg>
