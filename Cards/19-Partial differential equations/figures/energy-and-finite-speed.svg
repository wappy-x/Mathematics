<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" width="480" height="300" style="color:#24292f">
<title>Position along a 65 cm guitar string against time: a 2 cm tap 4 to 6 cm from the bridge splits into a right-moving band and a left-moving band that reflects off the bridge; the pickup point at 32.5 cm and 0.60 ms looks back on a dashed triangle from 6.79 to 58.21 cm that just misses the tap; a dotted triangle against the bridge is the shrinking window from 10 cm</title>
<rect x="0" y="0" width="480" height="300" rx="8" fill="#ffffff"/>
<polygon points="74,250 86,250 266,70 254,70" fill="#9aa4ad" fill-opacity="0.35" stroke="none"/>
<polygon points="74,250 86,250 50,214 50,226" fill="#9aa4ad" fill-opacity="0.35" stroke="none"/>
<polygon points="50,214 50,226 206,70 194,70" fill="#9aa4ad" fill-opacity="0.35" stroke="none"/>
<line x1="86" y1="250" x2="266" y2="70" stroke="currentColor" stroke-width="1.2"/>
<line x1="74" y1="250" x2="50" y2="226" stroke="currentColor" stroke-width="1.2"/>
<line x1="50" y1="226" x2="206" y2="70" stroke="currentColor" stroke-width="1.2"/>
<polygon points="90.7,250 399.3,250 245,95.7" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/>
<polygon points="50,250 110,250 50,190" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 3"/>
<line x1="50" y1="250" x2="445" y2="250" stroke="currentColor" stroke-width="1"/>
<line x1="50" y1="250" x2="50" y2="62" stroke="currentColor" stroke-width="4"/>
<line x1="440" y1="250" x2="440" y2="62" stroke="currentColor" stroke-width="4"/>
<line x1="74" y1="250" x2="86" y2="250" stroke="currentColor" stroke-width="6"/>
<circle cx="245" cy="95.7" r="4" fill="currentColor"/>
<line x1="46" y1="198.6" x2="50" y2="198.6" stroke="currentColor" stroke-width="1"/>
<line x1="46" y1="147.2" x2="50" y2="147.2" stroke="currentColor" stroke-width="1"/>
<line x1="46" y1="95.7" x2="50" y2="95.7" stroke="currentColor" stroke-width="1"/>
<text x="42" y="254" font-size="11" fill="currentColor" text-anchor="end">0</text>
<text x="42" y="202.6" font-size="11" fill="currentColor" text-anchor="end">0.2</text>
<text x="42" y="151.2" font-size="11" fill="currentColor" text-anchor="end">0.4</text>
<text x="42" y="99.7" font-size="11" fill="currentColor" text-anchor="end">0.6</text>
<text x="56" y="44" font-size="11" fill="currentColor">time, ms</text>
<text x="50" y="58" font-size="11" fill="currentColor" text-anchor="middle">bridge</text>
<text x="440" y="58" font-size="11" fill="currentColor" text-anchor="middle">nut</text>
<text x="110" y="265" font-size="11" fill="currentColor" text-anchor="middle">10</text>
<text x="170" y="265" font-size="11" fill="currentColor" text-anchor="middle">20</text>
<text x="230" y="265" font-size="11" fill="currentColor" text-anchor="middle">30</text>
<text x="290" y="265" font-size="11" fill="currentColor" text-anchor="middle">40</text>
<text x="350" y="265" font-size="11" fill="currentColor" text-anchor="middle">50</text>
<text x="410" y="265" font-size="11" fill="currentColor" text-anchor="middle">60</text>
<text x="80" y="265" font-size="11" fill="currentColor" text-anchor="middle">tap</text>
<text x="245" y="290" font-size="11" fill="currentColor" text-anchor="middle">position along the string from the bridge, cm</text>
<text x="253" y="90" font-size="11" fill="currentColor">P: 32.5 cm, 0.60 ms</text>
<text x="300" y="200" font-size="11" fill="currentColor">P's cone</text>
<text x="56" y="183" font-size="11" fill="currentColor">window</text>
<text x="270" y="74" font-size="11" fill="currentColor">right-mover</text>
<text x="190" y="74" font-size="11" fill="currentColor" text-anchor="end">reflected left-mover</text>
