<svg viewBox="0 0 480 310" xmlns="http://www.w3.org/2000/svg" width="480" height="310" style="color:#24292f">
<title>Position along a string against time: a 2 cm tap at the origin spreads into a widening wedge at 100 m/s, and the point 10 cm away at 1.0 ms looks back on a triangle whose base, 0 to 20 cm, holds 1 cm of the tap</title>
<rect x="0" y="0" width="480" height="310" rx="8" fill="#ffffff"/>
<polygon points="180,260 200,260 350,35 40,35 40,50" fill="#9aa4ad" fill-opacity="0.25" stroke="none"/>
<line x1="180" y1="260" x2="40" y2="50" stroke="currentColor" stroke-width="1.5"/>
<line x1="200" y1="260" x2="350" y2="35" stroke="currentColor" stroke-width="1.5"/>
<polygon points="190,260 390,260 290,110" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="290" y1="260" x2="290" y2="110" stroke="currentColor" stroke-width="1" stroke-opacity="0.6"/>
<line x1="40" y1="260" x2="445" y2="260" stroke="currentColor" stroke-width="1"/>
<line x1="40" y1="260" x2="40" y2="30" stroke="currentColor" stroke-width="1"/>
<line x1="180" y1="260" x2="200" y2="260" stroke="currentColor" stroke-width="6"/>
<line x1="190" y1="268" x2="200" y2="268" stroke="currentColor" stroke-width="3"/>
<circle cx="290" cy="110" r="4" fill="currentColor"/>
<circle cx="290" cy="125" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
<line x1="36" y1="185" x2="40" y2="185" stroke="currentColor" stroke-width="1"/>
<line x1="36" y1="110" x2="40" y2="110" stroke="currentColor" stroke-width="1"/>
<line x1="36" y1="35" x2="40" y2="35" stroke="currentColor" stroke-width="1"/>
<text x="32" y="189" font-size="12" fill="currentColor" text-anchor="end">0.5</text>
<text x="32" y="114" font-size="12" fill="currentColor" text-anchor="end">1.0</text>
<text x="32" y="39" font-size="12" fill="currentColor" text-anchor="end">1.5</text>
<text x="32" y="264" font-size="12" fill="currentColor" text-anchor="end">0</text>
<text x="46" y="24" font-size="12" fill="currentColor">time t, ms</text>
<text x="90" y="276" font-size="12" fill="currentColor" text-anchor="middle">-10</text>
<text x="190" y="282" font-size="12" fill="currentColor" text-anchor="middle">0</text>
<text x="290" y="276" font-size="12" fill="currentColor" text-anchor="middle">10</text>
<text x="390" y="276" font-size="12" fill="currentColor" text-anchor="middle">20</text>
<text x="240" y="300" font-size="12" fill="currentColor" text-anchor="middle">position x along the string, cm</text>
<text x="190" y="246" font-size="12" fill="currentColor" text-anchor="end">tap</text>
<text x="282" y="102" font-size="12" fill="currentColor" text-anchor="end">P: 10 cm, 1.0 ms</text>
<line x1="294" y1="127" x2="318" y2="139" stroke="currentColor" stroke-width="1"/>
<text x="322" y="144" font-size="12" fill="currentColor">first motion, 0.9 ms</text>
<text x="362" y="196" font-size="12" fill="currentColor">dependence</text>
<text x="362" y="210" font-size="12" fill="currentColor">of P</text>
<text x="120" y="80" font-size="12" fill="currentColor">influence of the tap</text>
</svg>
