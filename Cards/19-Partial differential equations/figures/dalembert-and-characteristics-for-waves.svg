<line x1="55" y1="210" x2="60" y2="210" stroke="#1d1d1d"/><text x="52" y="214" text-anchor="end" fill="#1d1d1d">4</text>
<line x1="55" y1="150" x2="60" y2="150" stroke="#1d1d1d"/><text x="52" y="154" text-anchor="end" fill="#1d1d1d">6</text>
<line x1="55" y1="90" x2="60" y2="90" stroke="#1d1d1d"/><text x="52" y="94" text-anchor="end" fill="#1d1d1d">8</text>
