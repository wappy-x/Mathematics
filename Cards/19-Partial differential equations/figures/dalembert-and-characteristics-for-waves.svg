<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 410" font-family="Helvetica, Arial, sans-serif" font-size="12">
<title>The plucked A string in the place-time plane: the two corners ride characteristics at 143 m/s, bounce between bridge and nut, and meet again after one period of 9.09 ms; drawn to scale</title>
