<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="Helvetica, Arial, sans-serif" font-size="12">
<title>A 1 nC charge 5 cm above a grounded metal sheet and its -1 nC image 5 cm below, drawn to scale at 20 px per cm</title>
<rect x="0" y="0" width="480" height="300" fill="#ffffff"/>
<rect x="20" y="150" width="440" height="135" fill="#e6e6e6"/>
<line x1="20" y1="150" x2="460" y2="150" stroke="#1d1d1d" stroke-width="2.5"/>
<text x="25" y="142" fill="#1d1d1d">grounded sheet, V = 0</text>
<text x="455" y="278" text-anchor="end" fill="#1d1d1d">outside the region: the image is not real</text>
<line x1="240" y1="57" x2="240" y2="243" stroke="#1d1d1d" stroke-width="1" stroke-dasharray="2 3"/>
<text x="232" y="104" text-anchor="end" fill="#1d1d1d">5 cm</text>
<text x="232" y="204" text-anchor="end" fill="#1d1d1d">5 cm</text>
<circle cx="240" cy="50" r="7" fill="#1d1d1d"/>
<text x="252" y="46" fill="#1d1d1d">charge +1 nC</text>
<circle cx="240" cy="250" r="7" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="252" y="254" fill="#1d1d1d">image -1 nC</text>
<line x1="340" y1="150" x2="240" y2="50" stroke="#1d1d1d" stroke-width="1" stroke-dasharray="5 4"/>
<line x1="340" y1="150" x2="240" y2="250" stroke="#1d1d1d" stroke-width="1" stroke-dasharray="5 4"/>
<circle cx="340" cy="150" r="3.5" fill="#1d1d1d"/>
<text x="346" y="166" fill="#1d1d1d">y</text>
<text x="300" y="94" fill="#1d1d1d">7.07 cm</text>
<text x="300" y="216" fill="#1d1d1d">7.07 cm</text>
<line x1="66.8" y1="143" x2="66.8" y2="157" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="413.2" y1="143" x2="413.2" y2="157" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="66.8" y1="172" x2="413.2" y2="172" stroke="#1d1d1d" stroke-width="1"/>
<text x="125" y="188" text-anchor="middle" fill="#1d1d1d">half the induced charge</text>
<text x="125" y="202" text-anchor="middle" fill="#1d1d1d">within 8.66 cm of the foot</text>
<text x="20" y="20" fill="#1d1d1d">20 px = 1 cm</text>
</svg>
