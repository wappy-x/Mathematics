<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>Sawtooth of the waiting time over one hour, gaps 5, 15, 5, 5, 15, 15 minutes, long teeth shaded, mean wait 6.25 minutes dashed</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<polygon points="65,190 65,40 140,190" fill="currentColor" fill-opacity="0.12" stroke="none"/>
<polygon points="190,190 190,40 265,190" fill="currentColor" fill-opacity="0.12" stroke="none"/>
<polygon points="265,190 265,40 340,190" fill="currentColor" fill-opacity="0.12" stroke="none"/>
<line x1="40" y1="190" x2="340" y2="190" stroke="currentColor" stroke-width="1.5"/>
<line x1="40" y1="190" x2="40" y2="40" stroke="currentColor" stroke-width="1.5"/>
<polyline points="40,190 40,140 65,190 65,40 140,190 140,140 165,190 165,140 190,190 190,40 265,190 265,40 340,190" fill="none" stroke="currentColor" stroke-width="2"/>
<line x1="40" y1="127.5" x2="340" y2="127.5" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="147" y="121" font-size="13" fill="currentColor">6.25</text>
<text x="34" y="194" font-size="13" fill="currentColor" text-anchor="end">0</text>
<text x="34" y="144" font-size="13" fill="currentColor" text-anchor="end">5</text>
<text x="34" y="44" font-size="13" fill="currentColor" text-anchor="end">15</text>
<text x="40" y="207" font-size="13" fill="currentColor" text-anchor="middle">0</text>
<text x="190" y="207" font-size="13" fill="currentColor" text-anchor="middle">30</text>
<text x="340" y="207" font-size="13" fill="currentColor" text-anchor="middle">60</text>
<text x="190" y="228" font-size="13" fill="currentColor" text-anchor="middle">arrival time (minutes)</text>
<text x="46" y="28" font-size="13" fill="currentColor">wait (minutes)</text>
</svg>
