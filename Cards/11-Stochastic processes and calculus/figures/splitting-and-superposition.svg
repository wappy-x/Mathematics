<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>Nine calls in the first two simulated hours, drawn on a time line for the switchboard, then again on the sales line (two calls) and the support line (seven calls), to scale at 150 units an hour</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<text x="40" y="38" font-size="13" fill="currentColor">Switchboard: all calls, 4 an hour</text>
<line x1="40" y1="60" x2="340" y2="60" stroke="currentColor" stroke-width="1.5" fill="none"/>
<line x1="98.3" y1="48" x2="98.3" y2="72" stroke="currentColor" stroke-width="2"/>
<line x1="126.3" y1="48" x2="126.3" y2="72" stroke="currentColor" stroke-width="2"/>
<line x1="155.3" y1="48" x2="155.3" y2="72" stroke="currentColor" stroke-width="2"/>
<line x1="166.5" y1="48" x2="166.5" y2="72" stroke="currentColor" stroke-width="2"/>
<line x1="175.9" y1="48" x2="175.9" y2="72" stroke="currentColor" stroke-width="2"/>
<line x1="192.0" y1="48" x2="192.0" y2="72" stroke="currentColor" stroke-width="2"/>
<line x1="233.8" y1="48" x2="233.8" y2="72" stroke="currentColor" stroke-width="2"/>
<line x1="303.5" y1="48" x2="303.5" y2="72" stroke="currentColor" stroke-width="2"/>
<line x1="325.8" y1="48" x2="325.8" y2="72" stroke="currentColor" stroke-width="2"/>
<text x="40" y="108" font-size="13" fill="currentColor">Sales: the coin said sales, chance 0.25</text>
<line x1="40" y1="130" x2="340" y2="130" stroke="currentColor" stroke-width="1.5" fill="none"/>
<line x1="126.3" y1="118" x2="126.3" y2="142" stroke="currentColor" stroke-width="2"/>
<line x1="192.0" y1="118" x2="192.0" y2="142" stroke="currentColor" stroke-width="2"/>
<text x="40" y="178" font-size="13" fill="currentColor">Support: every other call</text>
<line x1="40" y1="200" x2="340" y2="200" stroke="currentColor" stroke-width="1.5" fill="none"/>
<line x1="98.3" y1="188" x2="98.3" y2="212" stroke="currentColor" stroke-width="2"/>
<line x1="155.3" y1="188" x2="155.3" y2="212" stroke="currentColor" stroke-width="2"/>
<line x1="166.5" y1="188" x2="166.5" y2="212" stroke="currentColor" stroke-width="2"/>
<line x1="175.9" y1="188" x2="175.9" y2="212" stroke="currentColor" stroke-width="2"/>
<line x1="233.8" y1="188" x2="233.8" y2="212" stroke="currentColor" stroke-width="2"/>
<line x1="303.5" y1="188" x2="303.5" y2="212" stroke="currentColor" stroke-width="2"/>
<line x1="325.8" y1="188" x2="325.8" y2="212" stroke="currentColor" stroke-width="2"/>
<text x="40" y="230" font-size="13" fill="currentColor" text-anchor="middle">0 h</text>
<text x="190" y="230" font-size="13" fill="currentColor" text-anchor="middle">1 h</text>
<text x="340" y="230" font-size="13" fill="currentColor" text-anchor="middle">2 h</text>
</svg>
