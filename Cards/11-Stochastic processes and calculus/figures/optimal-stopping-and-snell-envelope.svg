<circle cx="180" cy="185" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
<circle cx="180" cy="135" r="6" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="2"/>
<circle cx="180" cy="60" r="6" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="2"/>
<circle cx="280" cy="185" r="6" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="2"/>
