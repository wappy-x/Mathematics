<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>The square of net winnings against net winnings, drawn to scale: from zero the next value is minus one or plus one, their squares average to one, while the square of their average is zero</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<path d="M 50 40 Q 150 360 250 40" fill="none" stroke="currentColor" stroke-width="2"/>
<line x1="100" y1="160" x2="200" y2="160" stroke="currentColor" stroke-width="1.5"/>
<line x1="150" y1="160" x2="150" y2="200" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="200" y1="160" x2="256" y2="160" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 3"/>
<line x1="150" y1="200" x2="256" y2="200" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 3"/>
<circle cx="100" cy="160" r="3" fill="currentColor"/>
<circle cx="200" cy="160" r="3" fill="currentColor"/>
<circle cx="150" cy="160" r="3" fill="currentColor"/>
<circle cx="150" cy="200" r="3" fill="currentColor"/>
<text x="10" y="22" font-size="13" fill="currentColor">square of net winnings</text>
<text x="262" y="156" font-size="13" fill="currentColor">average of</text>
<text x="262" y="172" font-size="13" fill="currentColor">squares = 1</text>
<text x="262" y="196" font-size="13" fill="currentColor">square of</text>
<text x="262" y="212" font-size="13" fill="currentColor">average = 0</text>
<text x="50" y="220" font-size="13" fill="currentColor" text-anchor="middle">−2</text>
<text x="100" y="220" font-size="13" fill="currentColor" text-anchor="middle">−1</text>
<text x="150" y="220" font-size="13" fill="currentColor" text-anchor="middle">0</text>
<text x="200" y="220" font-size="13" fill="currentColor" text-anchor="middle">+1</text>
<text x="250" y="220" font-size="13" fill="currentColor" text-anchor="middle">+2</text>
<text x="150" y="235" font-size="13" fill="currentColor" text-anchor="middle">net winnings s, in dollars</text>
</svg>
