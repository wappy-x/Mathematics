<text x="172" y="160" font-size="13" text-anchor="middle" fill="currentColor">12.80</text>
<text x="242" y="160" font-size="13" text-anchor="middle" fill="currentColor">10.24</text>
<text x="312" y="160" font-size="13" text-anchor="middle" fill="currentColor">8.19</text>
