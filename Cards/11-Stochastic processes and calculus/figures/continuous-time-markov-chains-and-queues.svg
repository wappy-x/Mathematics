<text x="138.2" y="96" font-size="13" text-anchor="middle" fill="currentColor">4</text>
<line x1="154.5" y1="118" x2="121.9" y2="118" stroke="currentColor" stroke-width="1.5"/>
<polyline points="127.9,115 121.9,118 127.9,121" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="138.2" y="134" font-size="13" text-anchor="middle" fill="currentColor">5</text>
