<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>A grid of five days by three weathers. The solid path is the Viterbi week rainy, rainy, sunny, sunny, cloudy. The dashed path, the best weather taken day by day, ends with a jump from sunny to rainy that has chance zero.</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<polyline points="60,170 120,170 180,50 240,50 300,110" fill="none" stroke="currentColor" stroke-width="2"/>
<polyline points="240,50 300,170" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/>
<circle cx="60" cy="50" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
<circle cx="120" cy="50" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
<circle cx="180" cy="50" r="6" fill="currentColor" stroke="currentColor" stroke-width="1.5"/>
<circle cx="240" cy="50" r="6" fill="currentColor" stroke="currentColor" stroke-width="1.5"/>
<circle cx="300" cy="50" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
<circle cx="60" cy="110" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
<circle cx="120" cy="110" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
<circle cx="180" cy="110" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
<circle cx="240" cy="110" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
<circle cx="300" cy="110" r="6" fill="currentColor" stroke="currentColor" stroke-width="1.5"/>
<circle cx="60" cy="170" r="6" fill="currentColor" stroke="currentColor" stroke-width="1.5"/>
<circle cx="120" cy="170" r="6" fill="currentColor" stroke="currentColor" stroke-width="1.5"/>
<circle cx="180" cy="170" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
<circle cx="240" cy="170" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
<circle cx="300" cy="170" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="4" y="55" font-size="13" fill="currentColor">sunny</text>
<text x="4" y="115" font-size="13" fill="currentColor">cloudy</text>
<text x="4" y="175" font-size="13" fill="currentColor">rainy</text>
<text x="304" y="148" font-size="13" fill="currentColor">chance 0</text>
<text x="60" y="203" font-size="13" fill="currentColor" text-anchor="middle">Mon</text>
<text x="120" y="203" font-size="13" fill="currentColor" text-anchor="middle">Tue</text>
<text x="180" y="203" font-size="13" fill="currentColor" text-anchor="middle">Wed</text>
<text x="240" y="203" font-size="13" fill="currentColor" text-anchor="middle">Thu</text>
<text x="300" y="203" font-size="13" fill="currentColor" text-anchor="middle">Fri</text>
<text x="60" y="224" font-size="13" fill="currentColor" text-anchor="middle">yes</text>
<text x="120" y="224" font-size="13" fill="currentColor" text-anchor="middle">yes</text>
<text x="180" y="224" font-size="13" fill="currentColor" text-anchor="middle">no</text>
<text x="240" y="224" font-size="13" fill="currentColor" text-anchor="middle">no</text>
<text x="300" y="224" font-size="13" fill="currentColor" text-anchor="middle">yes</text>
</svg>
