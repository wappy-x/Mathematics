<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 215" font-family="Helvetica, Arial, sans-serif" font-size="12">
<title>Four vibration patterns of a 0.30 m square drum head, with their still lines</title>
<rect x="0" y="0" width="600" height="215" fill="#ffffff"/>
<text x="80" y="22" text-anchor="middle" fill="#1d1d1d">mode (1,1)</text>
<rect x="20" y="35" width="120" height="120" fill="none" stroke="#1d1d1d" stroke-width="2"/>
<text x="80" y="100" text-anchor="middle" font-size="22" fill="#1d1d1d">+</text>
<text x="80" y="178" text-anchor="middle" fill="#1d1d1d">235.7 Hz</text>
<text x="225" y="22" text-anchor="middle" fill="#1d1d1d">mode (2,1)</text>
<rect x="165" y="35" width="120" height="120" fill="none" stroke="#1d1d1d" stroke-width="2"/>
<line x1="225" y1="35" x2="225" y2="155" stroke="#1d1d1d" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="195" y="100" text-anchor="middle" font-size="22" fill="#1d1d1d">+</text>
<text x="255" y="100" text-anchor="middle" font-size="22" fill="#1d1d1d">&#8722;</text>
<text x="225" y="178" text-anchor="middle" fill="#1d1d1d">372.7 Hz</text>
<text x="370" y="22" text-anchor="middle" fill="#1d1d1d">mode (1,2)</text>
<rect x="310" y="35" width="120" height="120" fill="none" stroke="#1d1d1d" stroke-width="2"/>
<line x1="310" y1="95" x2="430" y2="95" stroke="#1d1d1d" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="370" y="72" text-anchor="middle" font-size="22" fill="#1d1d1d">&#8722;</text>
<text x="370" y="132" text-anchor="middle" font-size="22" fill="#1d1d1d">+</text>
<text x="370" y="178" text-anchor="middle" fill="#1d1d1d">372.7 Hz</text>
<text x="515" y="22" text-anchor="middle" fill="#1d1d1d">(1,2) + (2,1)</text>
<rect x="455" y="35" width="120" height="120" fill="none" stroke="#1d1d1d" stroke-width="2"/>
<line x1="455" y1="35" x2="575" y2="155" stroke="#1d1d1d" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="490" y="132" text-anchor="middle" font-size="22" fill="#1d1d1d">+</text>
<text x="540" y="72" text-anchor="middle" font-size="22" fill="#1d1d1d">&#8722;</text>
<text x="515" y="178" text-anchor="middle" fill="#1d1d1d">372.7 Hz</text>
<text x="300" y="203" text-anchor="middle" font-size="11" fill="#555555">Dashed: still lines (nodes). + and &#8722;: halves moving in opposite directions. Each square is 0.30 m wide.</text>
</svg>
