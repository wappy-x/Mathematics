<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" font-family="Helvetica, Arial, sans-serif" font-size="12">
<title>A photon's polarisation state at 30 degrees split along a polariser's pass axis at 45 degrees and blocked axis at 135 degrees, to scale</title>
<rect x="0" y="0" width="420" height="300" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1d"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<line x1="30" y1="210" x2="400" y2="210" stroke="#888888" stroke-width="1"/>
<line x1="150" y1="290" x2="150" y2="20" stroke="#888888" stroke-width="1"/>
<text x="392" y="226" fill="#1d1d1d">H</text>
<text x="156" y="30" fill="#1d1d1d">V</text>
<line x1="82.1" y1="277.9" x2="285.8" y2="74.2" stroke="#1d1d1d" stroke-width="1" stroke-dasharray="6 4"/>
<line x1="82.1" y1="142.1" x2="217.9" y2="277.9" stroke="#1d1d1d" stroke-width="1" stroke-dasharray="6 4"/>
<text x="232" y="68" fill="#1d1d1d">pass axis, 45°</text>
<text x="222" y="292" fill="#1d1d1d">blocked axis, 135°</text>
<line x1="288.6" y1="130.0" x2="259.3" y2="100.7" stroke="#555555" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="288.6" y1="130.0" x2="179.3" y2="239.3" stroke="#555555" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="150" y1="210" x2="259.3" y2="100.7" stroke="#555555" stroke-width="3" marker-end="url(#b)"/>
<line x1="150" y1="210" x2="179.3" y2="239.3" stroke="#555555" stroke-width="3" marker-end="url(#b)"/>
<line x1="150" y1="210" x2="288.6" y2="130.0" stroke="#1d1d1d" stroke-width="2.5" marker-end="url(#a)"/>
<text x="296" y="134" fill="#1d1d1d">ψ = (0.8660, 0.5000)</text>
<text x="156" y="92" fill="#1d1d1d">0.9659 along pass</text>
<text x="190" y="252" fill="#1d1d1d">0.2588 along blocked</text>
<text x="182" y="204" fill="#1d1d1d">30°</text>
<text x="272" y="186" fill="#1d1d1d">160 px = 1 amplitude unit</text>
</svg>
