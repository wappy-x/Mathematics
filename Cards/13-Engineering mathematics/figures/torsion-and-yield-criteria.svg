<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>Yield boundaries for S275 steel in the plane of bending stress and shear stress, with the shaft's working point</title>
  <rect x="0" y="0" width="520" height="250" fill="#ffffff"/>
  <line x1="30" y1="200" x2="495" y2="200" stroke="#1d1d1d" stroke-width="1.2"/>
  <line x1="260" y1="210" x2="260" y2="40" stroke="#1d1d1d" stroke-width="1.2"/>
  <path d="M 40 200 A 220 127.02 0 0 1 480 200" fill="none" stroke="#264653" stroke-width="2"/>
  <path d="M 40 200 A 220 110 0 0 1 480 200" fill="none" stroke="#e76f51" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="260" y1="200" x2="389.19" y2="97.19" stroke="#1d1d1d" stroke-width="1" stroke-dasharray="2 3"/>
  <circle cx="340" cy="136.34" r="4.5" fill="#1d1d1d"/>
  <circle cx="389.19" cy="97.19" r="3" fill="#264653"/>
  <circle cx="377.04" cy="106.86" r="3" fill="#e76f51"/>
  <text x="300" y="182" fill="#1d1d1d">shaft: 100 MPa, 79.58 MPa</text>
  <text x="396" y="92" fill="#264653">von Mises x1.61</text>
  <text x="352" y="118" fill="#e76f51" text-anchor="end">Tresca x1.46</text>
  <text x="264" y="70" fill="#264653">158.77</text>
  <text x="264" y="87" fill="#e76f51">137.50</text>
  <text x="40" y="216" text-anchor="middle" fill="#1d1d1d">-275</text>
  <text x="480" y="216" text-anchor="middle" fill="#1d1d1d">275</text>
  <text x="495" y="232" text-anchor="end" fill="#1d1d1d">bending stress (MPa)</text>
  <text x="264" y="34" fill="#1d1d1d">shear stress (MPa)</text>
</svg>
