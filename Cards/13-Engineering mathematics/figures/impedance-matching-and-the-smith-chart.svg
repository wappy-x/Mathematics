<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 440" width="420" height="440" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>Smith chart, to scale: the 25 + j25 ohm load turned round its reflection circle to the g = 1 circle, then moved to the centre by a stub</title>
  <rect x="0" y="0" width="420" height="440" fill="#ffffff"/>
  <!-- unit circle |Gamma| = 1, radius 180 px, centre (210, 210) -->
  <circle cx="210" cy="210" r="180" fill="none" stroke="#1d1d1d" stroke-width="1.6"/>
  <line x1="30" y1="210" x2="390" y2="210" stroke="#1d1d1d" stroke-width="1"/>
  <!-- constant-resistance circles r = 0.5 and r = 1 -->
  <circle cx="270" cy="210" r="120" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <circle cx="300" cy="210" r="90" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <!-- constant-reactance arcs x = +0.5, x = +1, x = -1 -->
  <path d="M390,210 A360,360 0 0 1 102,66" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <path d="M390,210 A180,180 0 0 1 210,30" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <path d="M390,210 A180,180 0 0 0 210,390" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <!-- admittance circle g = 1 -->
  <circle cx="120" cy="210" r="90" fill="none" stroke="#2a6f97" stroke-width="1.4" stroke-dasharray="6 4"/>
  <!-- constant |Gamma| = 0.4472 circle -->
  <circle cx="210" cy="210" r="80.5" fill="none" stroke="#1d1d1d" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- the walk: 233.13 degrees clockwise from L to B, then the stub along g = 1 to the centre -->
  <path d="M174,138 A80.5,80.5 0 1 1 174,282" fill="none" stroke="#c0392b" stroke-width="2.4"/>
  <path d="M174,282 A90,90 0 0 0 210,210" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="2 3"/>
  <!-- points -->
  <circle cx="174" cy="138" r="4.5" fill="#c0392b"/>
  <circle cx="174" cy="282" r="4.5" fill="#c0392b"/>
  <circle cx="210" cy="210" r="4.5" fill="#1d1d1d"/>
  <circle cx="246" cy="210" r="4" fill="#2a6f97"/>
  <circle cx="290.5" cy="210" r="4" fill="#1d1d1d"/>
  <!-- labels -->
  <text x="88" y="128" fill="#1d1d1d">L: 25 + j25 Ω</text>
  <text x="122" y="300" fill="#1d1d1d">B: y = 1 + j1</text>
  <text x="196" y="230" fill="#1d1d1d">50 Ω</text>
  <text x="236" y="200" fill="#2a6f97">75 Ω</text>
  <text x="282" y="230" fill="#1d1d1d">VSWR 2.618</text>
  <text x="318" y="160" fill="#8a8a8a">r = 1</text>
  <text x="216" y="44" fill="#8a8a8a">x = +1</text>
  <text x="216" y="384" fill="#8a8a8a">x = −1</text>
  <text x="40" y="62" fill="#8a8a8a">x = +0.5</text>
  <text x="44" y="250" fill="#2a6f97">g = 1</text>
  <text x="30" y="425" fill="#1d1d1d">Γ plane, to scale. Red: 0.3238 λ along the line, then the stub.</text>
</svg>
