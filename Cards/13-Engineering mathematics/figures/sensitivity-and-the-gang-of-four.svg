<line x1="148" y1="60" x2="188" y2="60"/><polyline points="182,55 188,60 182,65"/>
<circle cx="198" cy="60" r="10"/>
<line x1="198" y1="22" x2="198" y2="50"/><polyline points="193,44 198,50 203,44"/>
<line x1="208" y1="60" x2="236" y2="60"/><polyline points="230,55 236,60 230,65"/>
<rect x="236" y="42" width="52" height="36"/>
