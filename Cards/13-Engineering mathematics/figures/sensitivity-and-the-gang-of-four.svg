<line x1="318" y1="60" x2="318" y2="160"/><polyline points="313,154 318,160 323,154"/>
<circle cx="318" cy="170" r="10"/>
<line x1="354" y1="170" x2="328" y2="170"/><polyline points="334,165 328,170 334,175"/>
<line x1="308" y1="170" x2="58" y2="170"/>
<line x1="58" y1="170" x2="58" y2="70"/><polyline points="53,76 58,70 63,76"/>
</g>
<g fill="currentColor" font-size="13" font-family="sans-serif">
<text x="6" y="64">r</text>
<text x="36" y="52">+</text>
<text x="64" y="90">−</text>
<text x="122" y="65" text-anchor="middle">C</text>
<text x="122" y="96" text-anchor="middle">PI controller</text>
