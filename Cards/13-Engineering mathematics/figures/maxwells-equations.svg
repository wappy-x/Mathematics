<svg viewBox="0 0 420 340" xmlns="http://www.w3.org/2000/svg" width="420" height="340" font-family="Helvetica, Arial, sans-serif">
<title>Charging capacitor, side view, schematic: a wire carries 10 mA down onto a round top plate of radius 5 cm; a 1 mm air gap (drawn 40 px tall) separates it from the bottom plate; a loop of radius 8 cm circles the upper wire; surface 1 is the flat disc on the loop, cut by the wire; surface 2 is a dashed bag hanging from the same loop and passing through the gap, where no charge crosses but the electric field grows</title>
<defs>
<marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1d"/></marker>
</defs>
<rect x="0" y="0" width="420" height="340" fill="#ffffff"/>
<line x1="210" y1="8" x2="210" y2="334" stroke="#1d1d1d" stroke-width="0.8" stroke-dasharray="2 4"/>
<line x1="210" y1="14" x2="210" y2="144" stroke="#1d1d1d" stroke-width="3"/>
<line x1="210" y1="196" x2="210" y2="330" stroke="#1d1d1d" stroke-width="3"/>
<line x1="222" y1="22" x2="222" y2="56" stroke="#1d1d1d" stroke-width="1.5" marker-end="url(#tip)"/>
<text x="228" y="40" font-size="12" fill="#1d1d1d">I = 10 mA</text>
<line x1="222" y1="268" x2="222" y2="302" stroke="#1d1d1d" stroke-width="1.5" marker-end="url(#tip)"/>
<text x="228" y="290" font-size="12" fill="#1d1d1d">I = 10 mA</text>
<ellipse cx="210" cy="80" rx="160" ry="12" fill="#1d1d1d" fill-opacity="0.10" stroke="#1d1d1d" stroke-width="2"/>
<line x1="118" y1="91" x2="150" y2="91.5" stroke="#1d1d1d" stroke-width="2" marker-end="url(#tip)"/>
<text x="12" y="62" font-size="12" fill="#1d1d1d">loop, r = 8 cm: B = 25 nT</text>
<text x="252" y="112" font-size="12" fill="#1d1d1d">surface 1, flat:</text>
<text x="252" y="126" font-size="12" fill="#1d1d1d">the wire's 10 mA</text>
<path d="M50,80 L50,170 L370,170 L370,80" fill="none" stroke="#1d1d1d" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="110" y="144" width="200" height="6" fill="#1d1d1d"/>
<rect x="110" y="190" width="200" height="6" fill="#1d1d1d"/>
<text x="226" y="139" font-size="12" fill="#1d1d1d">+ plate, radius 5 cm</text>
<text x="114" y="212" font-size="12" fill="#1d1d1d">− plate</text>
<line x1="140" y1="153" x2="140" y2="187" stroke="#1d1d1d" stroke-width="1.2" marker-end="url(#tip)"/>
<line x1="175" y1="153" x2="175" y2="187" stroke="#1d1d1d" stroke-width="1.2" marker-end="url(#tip)"/>
<line x1="245" y1="153" x2="245" y2="187" stroke="#1d1d1d" stroke-width="1.2" marker-end="url(#tip)"/>
<line x1="280" y1="153" x2="280" y2="187" stroke="#1d1d1d" stroke-width="1.2" marker-end="url(#tip)"/>
<text x="20" y="236" font-size="12" fill="#1d1d1d">surface 2, the dashed bag</text>
<text x="20" y="250" font-size="12" fill="#1d1d1d">through the gap: no charge</text>
<text x="20" y="264" font-size="12" fill="#1d1d1d">crosses, but E grows, and</text>
<text x="20" y="278" font-size="12" fill="#1d1d1d">ε0 dΦE/dt = 10 mA</text>
<text x="376" y="174" font-size="12" fill="#1d1d1d">gap</text>
</svg>
