<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 310" width="460" height="310" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>Two-link arm drawn to scale: held straight out, and 0.3 s after a power cut</title>
  <rect x="0" y="0" width="460" height="310" fill="#ffffff"/>
  <!-- shoulder mount -->
  <rect x="14" y="40" width="14" height="40" fill="#cccccc" stroke="#1d1d1d" stroke-width="1"/>
  <line x1="28" y1="60" x2="40" y2="60" stroke="#1d1d1d" stroke-width="2"/>
  <!-- held pose, straight out: shoulder 40,60; elbow 240,60; tip 400,60 -->
  <line x1="40" y1="60" x2="240" y2="60" stroke="#1d1d1d" stroke-width="7" stroke-linecap="round"/>
  <line x1="240" y1="60" x2="400" y2="60" stroke="#555555" stroke-width="5" stroke-linecap="round"/>
  <circle cx="140" cy="60" r="4" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.5"/>
  <circle cx="320" cy="60" r="4" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.5"/>
  <text x="120" y="45">upper arm, 4 kg, 0.5 m</text>
  <text x="268" y="45">forearm, 2.5 kg, 0.4 m</text>
  <!-- pose at 0.3 s: elbow 153.6,224.6; tip 310.9,253.8 -->
  <line x1="40" y1="60" x2="153.6" y2="224.6" stroke="#1d1d1d" stroke-width="2" stroke-dasharray="7 4"/>
  <line x1="153.6" y1="224.6" x2="310.9" y2="253.8" stroke="#1d1d1d" stroke-width="2" stroke-dasharray="7 4"/>
  <line x1="153.6" y1="224.6" x2="187.7" y2="274.0" stroke="#888888" stroke-width="1" stroke-dasharray="2 3"/>
  <circle cx="96.8" cy="142.3" r="3" fill="#1d1d1d"/>
  <circle cx="232.3" cy="239.2" r="3" fill="#1d1d1d"/>
  <text x="250" y="282">0.3 s after the power cut</text>
  <!-- joints -->
  <circle cx="40" cy="60" r="6" fill="#ffffff" stroke="#1d1d1d" stroke-width="2"/>
  <circle cx="240" cy="60" r="5" fill="#ffffff" stroke="#1d1d1d" stroke-width="2"/>
  <circle cx="153.6" cy="224.6" r="5" fill="#ffffff" stroke="#1d1d1d" stroke-width="2"/>
  <!-- angle arcs -->
  <path d="M 90 60 A 50 50 0 0 1 68.4 101.1" fill="none" stroke="#e76f51" stroke-width="2"/>
  <text x="96" y="92" fill="#b5462c">&#952;1 = &#8722;55.4&#176;</text>
  <path d="M 173.5 253.4 A 35 35 0 0 0 188.0 231.0" fill="none" stroke="#2a9d8f" stroke-width="2"/>
  <text x="196" y="220" fill="#1f7a6f">&#952;2 = 44.8&#176;</text>
  <!-- gravity arrow -->
  <line x1="420" y1="110" x2="420" y2="160" stroke="#1d1d1d" stroke-width="2"/>
  <path d="M 414 150 L 420 162 L 426 150 Z" fill="#1d1d1d"/>
  <text x="405" y="180">g</text>
  <!-- scale bar: 0.1 m = 40 units -->
  <line x1="340" y1="296" x2="380" y2="296" stroke="#1d1d1d" stroke-width="2"/>
  <line x1="340" y1="291" x2="340" y2="301" stroke="#1d1d1d" stroke-width="1"/>
  <line x1="380" y1="291" x2="380" y2="301" stroke="#1d1d1d" stroke-width="1"/>
  <text x="388" y="300">0.1 m</text>
</svg>
