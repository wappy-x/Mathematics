<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" width="480" height="420" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>The footbridge's two sway modes, seen from above: spans to scale, sway drawn with span 1 moving 50 px</title>
  <rect x="0" y="0" width="480" height="420" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d1d1d"/>
    </marker>
  </defs>
  <!-- mode 1 -->
  <text x="20" y="28" fill="#1d1d1d" font-weight="bold">Mode 1, 0.9969 Hz: both spans sway the same way</text>
  <line x1="40" y1="110" x2="440" y2="110" stroke="#1d1d1d" stroke-width="1.5" stroke-dasharray="6 4"/>
  <polyline points="40,110 160,60 360,68.9 440,110" fill="none" stroke="#1d1d1d" stroke-width="2.5"/>
  <line x1="160" y1="110" x2="160" y2="62" stroke="#1d1d1d" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="360" y1="110" x2="360" y2="71" stroke="#1d1d1d" stroke-width="1.2" marker-end="url(#ah)"/>
  <circle cx="160" cy="60" r="6" fill="#1d1d1d"/>
  <circle cx="360" cy="68.9" r="6" fill="#1d1d1d"/>
  <text x="170" y="56" fill="#1d1d1d">1</text>
  <text x="370" y="66" fill="#1d1d1d">0.8229</text>
  <!-- mode 2 -->
  <text x="20" y="198" fill="#1d1d1d" font-weight="bold">Mode 2, 1.7966 Hz: the spans sway opposite ways</text>
  <line x1="40" y1="280" x2="440" y2="280" stroke="#1d1d1d" stroke-width="1.5" stroke-dasharray="6 4"/>
  <polyline points="40,280 160,230 360,371.1 440,280" fill="none" stroke="#1d1d1d" stroke-width="2.5"/>
  <line x1="160" y1="280" x2="160" y2="232" stroke="#1d1d1d" stroke-width="1.2" marker-end="url(#ah)"/>
  <line x1="360" y1="280" x2="360" y2="369" stroke="#1d1d1d" stroke-width="1.2" marker-end="url(#ah)"/>
  <circle cx="160" cy="230" r="6" fill="#1d1d1d"/>
  <circle cx="360" cy="371.1" r="6" fill="#1d1d1d"/>
  <text x="170" y="226" fill="#1d1d1d">1</text>
  <text x="370" y="380" fill="#1d1d1d">−1.8229</text>
  <!-- supports and labels, both panels -->
  <g fill="#1d1d1d" stroke="none">
    <path d="M40,114 L32,128 L48,128 z"/><path d="M440,114 L432,128 L448,128 z"/>
    <path d="M40,284 L32,298 L48,298 z"/><path d="M440,284 L432,298 L448,298 z"/>
    <rect x="276" y="114" width="8" height="12"/><rect x="276" y="284" width="8" height="12"/>
  </g>
  <text x="100" y="146" fill="#1d1d1d">span 1, 60 m</text>
  <text x="318" y="146" fill="#1d1d1d">span 2, 40 m</text>
  <text x="266" y="100" fill="#1d1d1d">pier</text>
  <text x="20" y="408" fill="#1d1d1d" font-size="11">Plan view. Dashed: deck at rest. Dots: lumped masses at mid-span.</text>
</svg>
