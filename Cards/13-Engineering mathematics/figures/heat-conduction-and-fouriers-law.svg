<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300">
<title>Steady temperature through a 300 mm filled cavity wall, 20 C inside, 0 C outside, drawn to scale</title>
<rect x="0" y="0" width="420" height="300" fill="#ffffff"/>
<rect x="60" y="40" width="16.5" height="220" fill="#f3e9d2" stroke="#1d1d1d" stroke-width="1"/>
<rect x="76.5" y="40" width="93.5" height="220" fill="#d9d9d9" stroke="#1d1d1d" stroke-width="1"/>
<rect x="170" y="40" width="110" height="220" fill="#fdf3b5" stroke="#1d1d1d" stroke-width="1"/>
<rect x="280" y="40" width="110" height="220" fill="#e8b9a6" stroke="#1d1d1d" stroke-width="1"/>
<line x1="60" y1="250" x2="390" y2="250" stroke="#1d1d1d" stroke-width="0.6" stroke-dasharray="3 3"/>
<line x1="60" y1="50" x2="390" y2="50" stroke="#1d1d1d" stroke-width="0.6" stroke-dasharray="3 3"/>
<line x1="20" y1="50" x2="60" y2="56.9" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3"/>
<polyline points="60,56.9 76.5,58.9 170,89.0 280,241.0 390,247.9" fill="none" stroke="#c0392b" stroke-width="2.5"/>
<line x1="390" y1="247.9" x2="410" y2="250" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3"/>
<text x="12" y="44" font-family="sans-serif" font-size="11" fill="#1d1d1d">room 20 C</text>
<text x="344" y="270" font-family="sans-serif" font-size="11" fill="#1d1d1d">outside 0 C</text>
<text x="88" y="110" font-family="sans-serif" font-size="11" fill="#1d1d1d">block</text>
<text x="88" y="124" font-family="sans-serif" font-size="11" fill="#1d1d1d">85 mm</text>
<text x="88" y="138" font-family="sans-serif" font-size="11" fill="#1d1d1d">drop 3.013 K</text>
<text x="180" y="70" font-family="sans-serif" font-size="11" fill="#1d1d1d">mineral wool</text>
<text x="180" y="84" font-family="sans-serif" font-size="11" fill="#1d1d1d">100 mm</text>
<text x="176" y="230" font-family="sans-serif" font-size="11" fill="#1d1d1d">drop 15.193 K</text>
<text x="300" y="110" font-family="sans-serif" font-size="11" fill="#1d1d1d">brick</text>
<text x="300" y="124" font-family="sans-serif" font-size="11" fill="#1d1d1d">100 mm</text>
<text x="300" y="138" font-family="sans-serif" font-size="11" fill="#1d1d1d">drop 0.691 K</text>
<text x="64" y="282" font-family="sans-serif" font-size="11" fill="#1d1d1d">plaster 15 mm at the left edge; heat flows left to right</text>
<text x="64" y="296" font-family="sans-serif" font-size="11" fill="#1d1d1d">1.1 px per mm across, 10 px per degree up</text>
</svg>
