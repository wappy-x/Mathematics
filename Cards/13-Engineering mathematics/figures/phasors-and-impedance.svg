<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" font-family="Helvetica, Arial, sans-serif" font-size="11">
  <title>Phasor diagram: 230 V mains, resistor voltage 184 V and coil voltage 138 V at right angles, current 4.6 A lagging by 36.87 degrees</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d1d1d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="360" height="220" fill="#ffffff"/>
  <!-- real axis through the origin (60, 60); 1 unit per volt, 20 units per amp -->
  <line x1="40" y1="60" x2="330" y2="60" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="332" y="64" fill="#555555">Re</text>
  <!-- V: 230 V along the real axis -->
  <line x1="60" y1="60" x2="290" y2="60" stroke="#1d1d1d" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="170" y="50" fill="#1d1d1d">V = 230 V</text>
  <!-- I: 4.6 A at 20 units per amp, a grey band under VR because it points the same way -->
  <line x1="60" y1="60" x2="133.6" y2="115.2" stroke="#9a9a9a" stroke-width="8" stroke-linecap="round"/>
  <text x="138" y="104" fill="#1d1d1d">I = 4.6 A (grey band)</text>
  <!-- VR: 184 V, in step with the current -->
  <line x1="60" y1="60" x2="207.2" y2="170.4" stroke="#1d1d1d" stroke-width="2" marker-end="url(#ah)"/>
  <text x="96" y="160" fill="#1d1d1d">V_R = 184 V</text>
  <!-- VL: 138 V, a quarter turn ahead of the current -->
  <line x1="207.2" y1="170.4" x2="290" y2="60" stroke="#1d1d1d" stroke-width="2" marker-end="url(#ah)"/>
  <text x="256" y="138" fill="#1d1d1d">V_L = 138 V</text>
  <!-- right-angle mark at the VR tip -->
  <path d="M199.2,164.4 L205.2,156.4 L213.2,162.4" fill="none" stroke="#1d1d1d" stroke-width="1"/>
  <!-- lag angle between V and I -->
  <path d="M100,60 A40,40 0 0,1 92,84" fill="none" stroke="#1d1d1d" stroke-width="1"/>
  <text x="104" y="80" fill="#1d1d1d">36.87°</text>
  <circle cx="60" cy="60" r="2.5" fill="#1d1d1d"/>
  <text x="30" y="56" fill="#1d1d1d">0</text>
</svg>
