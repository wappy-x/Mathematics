<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>A water parcel speeding up through a 22 mm to 15 mm reducer, to scale, one dot every 4 ms</title>
  <rect x="0" y="0" width="480" height="330" fill="#ffffff"/>
  <polygon points="20,50 140,50 340,85 460,85 460,235 340,235 140,270 20,270" fill="#e8f1f8" stroke="none"/>
  <polyline points="20,50 140,50 340,85 460,85" fill="none" stroke="#1d1d1d" stroke-width="3"/>
  <polyline points="20,270 140,270 340,235 460,235" fill="none" stroke="#1d1d1d" stroke-width="3"/>
  <line x1="20" y1="160" x2="460" y2="160" stroke="#888888" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="140" y1="40" x2="140" y2="280" stroke="#888888" stroke-width="1"/>
  <line x1="340" y1="40" x2="340" y2="280" stroke="#888888" stroke-width="1"/>
  <circle cx="40" cy="160" r="4.5" fill="#1d1d1d"/>
  <circle cx="59" cy="160" r="4.5" fill="#1d1d1d"/>
  <circle cx="77" cy="160" r="4.5" fill="#1d1d1d"/>
  <circle cx="96" cy="160" r="4.5" fill="#1d1d1d"/>
  <circle cx="114" cy="160" r="4.5" fill="#1d1d1d"/>
  <circle cx="133" cy="160" r="4.5" fill="#1d1d1d"/>
  <circle cx="152" cy="160" r="4.5" fill="#1d1d1d"/>
  <circle cx="172" cy="160" r="4.5" fill="#1d1d1d"/>
  <circle cx="193" cy="160" r="4.5" fill="#1d1d1d"/>
  <circle cx="216" cy="160" r="4.5" fill="#1d1d1d"/>
  <circle cx="241" cy="160" r="4.5" fill="#1d1d1d"/>
  <circle cx="269" cy="160" r="4.5" fill="#1d1d1d"/>
  <circle cx="301" cy="160" r="4.5" fill="#1d1d1d"/>
  <circle cx="337" cy="160" r="4.5" fill="#1d1d1d"/>
  <circle cx="377" cy="160" r="4.5" fill="#1d1d1d"/>
  <circle cx="417" cy="160" r="4.5" fill="#1d1d1d"/>
  <text x="40" y="145" text-anchor="middle">0 ms</text>
  <text x="417" y="145" text-anchor="middle">60 ms</text>
  <text x="80" y="30" text-anchor="middle">22 mm bore</text>
  <text x="80" y="300" text-anchor="middle">0.46 m/s</text>
  <text x="240" y="30" text-anchor="middle">reducer, 20 mm long</text>
  <text x="400" y="70" text-anchor="middle">15 mm bore</text>
  <text x="400" y="260" text-anchor="middle">1.00 m/s</text>
  <text x="240" y="320" text-anchor="middle">Flow left to right. Same time between dots: wider gaps mean faster.</text>
</svg>
