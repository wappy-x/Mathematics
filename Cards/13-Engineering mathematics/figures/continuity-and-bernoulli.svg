<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <title>A 22 mm bore narrowing to 15 mm over a 20 mm taper, to scale, with the water's mean speed on each side</title>
  <rect x="0" y="0" width="800" height="330" fill="#ffffff"/>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d1d1d"/>
    </marker>
  </defs>
  <!-- walls: 10 units per mm; pipe axis at y = 150 -->
  <polyline fill="none" stroke="#1d1d1d" stroke-width="3"
    points="50,40 300,40 325,41.35 350,45.15 375,50.8 400,57.5 425,64.2 450,69.85 475,73.65 500,75 750,75"/>
  <polyline fill="none" stroke="#1d1d1d" stroke-width="3"
    points="50,260 300,260 325,258.65 350,254.85 375,249.2 400,242.5 425,235.8 450,230.15 475,226.35 500,225 750,225"/>
  <line x1="50" y1="150" x2="750" y2="150" stroke="#1d1d1d" stroke-width="1" stroke-dasharray="6 5"/>
  <!-- taper ends -->
  <line x1="300" y1="30" x2="300" y2="270" stroke="#1d1d1d" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="500" y1="65" x2="500" y2="235" stroke="#1d1d1d" stroke-width="1" stroke-dasharray="3 4"/>
  <!-- speed arrows: 100 units per m/s -->
  <line x1="110" y1="150" x2="175.8" y2="150" stroke="#1d1d1d" stroke-width="3" marker-end="url(#head)"/>
  <line x1="580" y1="150" x2="721.5" y2="150" stroke="#1d1d1d" stroke-width="3" marker-end="url(#head)"/>
  <text x="110" y="135" fill="#1d1d1d">0.658 m/s</text>
  <text x="580" y="135" fill="#1d1d1d">1.415 m/s</text>
  <text x="70" y="185" fill="#1d1d1d">22 mm bore</text>
  <text x="560" y="185" fill="#1d1d1d">15 mm bore</text>
  <text x="70" y="290" fill="#1d1d1d">gauge 150,000 Pa</text>
  <text x="560" y="255" fill="#1d1d1d">gauge 149,233 Pa</text>
  <text x="330" y="295" fill="#1d1d1d">taper, 20 mm long</text>
  <text x="50" y="22" fill="#1d1d1d">flow 0.25 L/s, left to right</text>
</svg>
