<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" width="420" height="250">
<title>Schematic: a non-inverting amplifier. The input goes to the op-amp's plus input; the 90 kilohm resistor feeds the output back to the minus input, and the 10 kilohm resistor ties the minus input to ground, so the gain is 1 + 90/10 = 10</title>
<rect x="0" y="0" width="420" height="250" fill="#ffffff"/>
<g stroke="#1d1d1d" stroke-width="1.6" fill="none">
<polygon points="180,60 180,160 280,110"/>
<line x1="38" y1="85" x2="180" y2="85"/>
<circle cx="34" cy="85" r="4"/>
<line x1="140" y1="135" x2="180" y2="135"/>
<line x1="280" y1="110" x2="382" y2="110"/>
<circle cx="386" cy="110" r="4"/>
<line x1="140" y1="135" x2="140" y2="205"/>
<line x1="140" y1="205" x2="200" y2="205"/>
<rect x="200" y="197" width="60" height="16"/>
<line x1="260" y1="205" x2="330" y2="205"/>
<line x1="330" y1="205" x2="330" y2="110"/>
<line x1="140" y1="135" x2="120" y2="135"/>
<rect x="70" y="127" width="50" height="16"/>
<line x1="70" y1="135" x2="55" y2="135"/>
<line x1="55" y1="135" x2="55" y2="160"/>
<line x1="43" y1="160" x2="67" y2="160"/>
<line x1="47" y1="166" x2="63" y2="166"/>
<line x1="51" y1="172" x2="59" y2="172"/>
</g>
<g fill="#1d1d1d" stroke="none">
<circle cx="140" cy="135" r="3"/>
<circle cx="330" cy="110" r="3"/>
</g>
<g fill="#1d1d1d" font-family="sans-serif" font-size="13">
<text x="186" y="90">+</text>
<text x="187" y="140">−</text>
<text x="205" y="114">A</text>
<text x="20" y="72">v_in</text>
<text x="366" y="98">v_out</text>
<text x="190" y="190">R_f = 90 kΩ</text>
<text x="64" y="120">R_1 = 10 kΩ</text>
<text x="30" y="190">ground</text>
<text x="210" y="238" text-anchor="middle">gain = 1 + 90/10 = 10 (schematic, not to scale)</text>
</g>
</svg>
