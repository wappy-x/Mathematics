<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>A spinning bicycle wheel hung from a string by one end of its axle: side view and top view, to scale</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d1d1d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="320" fill="#ffffff"/>
  <!-- side view: 400 units per metre -->
  <text x="20" y="300" fill="#1d1d1d">Side view</text>
  <line x1="110" y1="10" x2="110" y2="150" stroke="#1d1d1d" stroke-width="1.5"/>
  <text x="62" y="40" fill="#1d1d1d">string</text>
  <circle cx="110" cy="150" r="3.5" fill="#1d1d1d"/>
  <line x1="110" y1="150" x2="150" y2="150" stroke="#1d1d1d" stroke-width="4"/>
  <line x1="150" y1="30" x2="150" y2="270" stroke="#1d1d1d" stroke-width="7"/>
  <text x="126" y="170" fill="#1d1d1d">d</text>
  <line x1="150" y1="150" x2="250" y2="150" stroke="#1d1d1d" stroke-width="2" marker-end="url(#ah)"/>
  <text x="200" y="142" fill="#1d1d1d">L</text>
  <line x1="150" y1="156" x2="150" y2="272" stroke="#ffffff" stroke-width="4"/>
  <line x1="150" y1="150" x2="150" y2="300" stroke="#1d1d1d" stroke-width="2" marker-end="url(#ah)"/>
  <circle cx="150" cy="150" r="4" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.5"/>
  <text x="160" y="298" fill="#1d1d1d">weight m g, at the hub</text>
  <text x="158" y="45" fill="#1d1d1d">wheel, edge on</text>
  <!-- divider -->
  <line x1="320" y1="15" x2="320" y2="305" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- top view: same scale -->
  <text x="340" y="300" fill="#1d1d1d">Top view</text>
  <circle cx="470" cy="150" r="40" fill="none" stroke="#1d1d1d" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="470" cy="150" r="3.5" fill="#1d1d1d"/>
  <text x="392" y="108" fill="#1d1d1d">string, from above</text>
  <line x1="470" y1="150" x2="510" y2="150" stroke="#1d1d1d" stroke-width="4"/>
  <line x1="510" y1="30" x2="510" y2="270" stroke="#1d1d1d" stroke-width="7"/>
  <line x1="510" y1="150" x2="600" y2="150" stroke="#1d1d1d" stroke-width="2" marker-end="url(#ah)"/>
  <text x="560" y="168" fill="#1d1d1d">L</text>
  <line x1="600" y1="150" x2="600" y2="100" stroke="#1d1d1d" stroke-width="2" marker-end="url(#ah)"/>
  <text x="560" y="95" fill="#1d1d1d">τ Δt</text>
  <path d="M 452 185 A 40 40 0 0 0 505 170" fill="none" stroke="#1d1d1d" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="400" y="225" fill="#1d1d1d">hub's path</text>
</svg>
