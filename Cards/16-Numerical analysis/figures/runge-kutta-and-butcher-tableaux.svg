<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240">
<title>The eight rooted trees with up to four nodes, one per order condition of a fourth-order Runge-Kutta method, each labelled with its density gamma; schematic</title>
<rect x="0" y="0" width="360" height="240" fill="#ffffff"/>
<g stroke="#1d1d1d" stroke-width="2" fill="none">
<line x1="135" y1="90" x2="135" y2="64"/>
<line x1="236" y1="90" x2="225" y2="64"/>
<line x1="236" y1="90" x2="247" y2="64"/>
<line x1="315" y1="90" x2="315" y2="64"/>
<line x1="315" y1="64" x2="315" y2="38"/>
<line x1="67" y1="210" x2="45" y2="184"/>
<line x1="67" y1="210" x2="67" y2="184"/>
<line x1="67" y1="210" x2="89" y2="184"/>
<line x1="146" y1="210" x2="135" y2="184"/>
<line x1="146" y1="210" x2="157" y2="184"/>
<line x1="157" y1="184" x2="157" y2="158"/>
<line x1="236" y1="210" x2="236" y2="184"/>
<line x1="236" y1="184" x2="225" y2="158"/>
<line x1="236" y1="184" x2="247" y2="158"/>
<line x1="315" y1="210" x2="315" y2="184"/>
<line x1="315" y1="184" x2="315" y2="158"/>
<line x1="315" y1="158" x2="315" y2="132"/>
</g>
<g fill="#1d1d1d" stroke="none">
<circle cx="45" cy="90" r="4.5"/>
<circle cx="135" cy="90" r="4.5"/>
<circle cx="135" cy="64" r="4.5"/>
<circle cx="236" cy="90" r="4.5"/>
<circle cx="225" cy="64" r="4.5"/>
<circle cx="247" cy="64" r="4.5"/>
<circle cx="315" cy="90" r="4.5"/>
<circle cx="315" cy="64" r="4.5"/>
<circle cx="315" cy="38" r="4.5"/>
<circle cx="67" cy="210" r="4.5"/>
<circle cx="45" cy="184" r="4.5"/>
<circle cx="67" cy="184" r="4.5"/>
<circle cx="89" cy="184" r="4.5"/>
<circle cx="146" cy="210" r="4.5"/>
<circle cx="135" cy="184" r="4.5"/>
<circle cx="157" cy="184" r="4.5"/>
<circle cx="157" cy="158" r="4.5"/>
<circle cx="236" cy="210" r="4.5"/>
<circle cx="236" cy="184" r="4.5"/>
<circle cx="225" cy="158" r="4.5"/>
<circle cx="247" cy="158" r="4.5"/>
<circle cx="315" cy="210" r="4.5"/>
<circle cx="315" cy="184" r="4.5"/>
<circle cx="315" cy="158" r="4.5"/>
<circle cx="315" cy="132" r="4.5"/>
</g>
<g fill="#1d1d1d" font-family="sans-serif" font-size="13">
<text x="45" y="112" text-anchor="middle">γ = 1</text>
<text x="135" y="112" text-anchor="middle">γ = 2</text>
<text x="236" y="112" text-anchor="middle">γ = 3</text>
<text x="315" y="112" text-anchor="middle">γ = 6</text>
<text x="67" y="232" text-anchor="middle">γ = 4</text>
<text x="146" y="232" text-anchor="middle">γ = 8</text>
<text x="236" y="232" text-anchor="middle">γ = 12</text>
<text x="315" y="232" text-anchor="middle">γ = 24</text>
</g>
</svg>
