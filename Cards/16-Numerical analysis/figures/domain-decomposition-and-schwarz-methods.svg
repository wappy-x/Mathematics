<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240">
<title>Schwarz's alternating method on -u'' = 0 with u(0) = 0 and u(1) = 1, pieces [0, 0.6] and [0.4, 1]: the straight-line solves of sweeps 1 and 2 climb toward the exact line u = x, and the value at x = 0.6 goes 0.333, then 0.481, toward 0.6</title>
<rect x="0" y="0" width="360" height="240" fill="#ffffff"/>
<line x1="40" y1="200" x2="330" y2="200" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="40" y1="200" x2="40" y2="30" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="152" y1="200" x2="152" y2="108" stroke="#1d1d1d" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="208" y1="200" x2="208" y2="108" stroke="#1d1d1d" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="40" y1="200" x2="320" y2="40" stroke="#1d1d1d" stroke-width="1"/>
<line x1="152" y1="200" x2="320" y2="40" stroke="#1d1d1d" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="40" y1="200" x2="208" y2="146.67" stroke="#1d1d1d" stroke-width="2.5"/>
<line x1="152" y1="164.44" x2="320" y2="40" stroke="#1d1d1d" stroke-width="2.5"/>
<circle cx="208" cy="146.67" r="3.5" fill="#1d1d1d"/>
<circle cx="208" cy="122.96" r="3.5" fill="#1d1d1d"/>
<circle cx="208" cy="104" r="3.5" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="40" y1="212" x2="208" y2="212" stroke="#1d1d1d" stroke-width="3"/>
<line x1="152" y1="226" x2="320" y2="226" stroke="#1d1d1d" stroke-width="3"/>
<text x="214" y="216" font-family="sans-serif" font-size="13" fill="#1d1d1d">piece 1 [0, 0.6]</text>
<text x="146" y="230" text-anchor="end" font-family="sans-serif" font-size="13" fill="#1d1d1d">piece 2 [0.4, 1]</text>
<text x="48" y="44" font-family="sans-serif" font-size="13" fill="#1d1d1d">u</text>
<text x="335" y="196" font-family="sans-serif" font-size="13" fill="#1d1d1d">x</text>
<text x="56" y="64" font-family="sans-serif" font-size="13" fill="#1d1d1d">thin: exact u = x</text>
<text x="56" y="82" font-family="sans-serif" font-size="13" fill="#1d1d1d">dashed: sweep 1</text>
<text x="56" y="100" font-family="sans-serif" font-size="13" fill="#1d1d1d">thick: sweep 2</text>
<text x="222" y="168" font-family="sans-serif" font-size="13" fill="#1d1d1d">u at x = 0.6:</text>
<text x="222" y="184" font-family="sans-serif" font-size="13" fill="#1d1d1d">0.333, 0.481 → 0.6</text>
</svg>
