<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240">
<title>Bisection on the mortgage rate: the bracket from 1% to 15% and the four halvings after it, drawn to scale, with the rate 5.2627% marked</title>
<rect x="0" y="0" width="360" height="240" fill="#ffffff"/>
<g stroke="#1d1d1d" stroke-width="2" fill="none">
<line x1="30" y1="40" x2="330" y2="40"/>
<line x1="30" y1="72" x2="180" y2="72"/>
<line x1="105" y1="104" x2="180" y2="104"/>
<line x1="105" y1="136" x2="142.5" y2="136"/>
<line x1="105" y1="168" x2="123.7" y2="168"/>
<line x1="30" y1="200" x2="330" y2="200" stroke-width="1.5"/>
<line x1="30" y1="196" x2="30" y2="204" stroke-width="1.5"/>
<line x1="105" y1="196" x2="105" y2="204" stroke-width="1.5"/>
<line x1="180" y1="196" x2="180" y2="204" stroke-width="1.5"/>
<line x1="330" y1="196" x2="330" y2="204" stroke-width="1.5"/>
</g>
<g stroke="#1d1d1d" stroke-width="2">
<line x1="30" y1="34" x2="30" y2="46"/><line x1="330" y1="34" x2="330" y2="46"/>
<line x1="30" y1="66" x2="30" y2="78"/><line x1="180" y1="66" x2="180" y2="78"/>
<line x1="105" y1="98" x2="105" y2="110"/><line x1="180" y1="98" x2="180" y2="110"/>
<line x1="105" y1="130" x2="105" y2="142"/><line x1="142.5" y1="130" x2="142.5" y2="142"/>
<line x1="105" y1="162" x2="105" y2="174"/><line x1="123.7" y1="162" x2="123.7" y2="174"/>
</g>
<line x1="121.3" y1="24" x2="121.3" y2="200" stroke="#1d1d1d" stroke-width="1.5" stroke-dasharray="4 3"/>
<g fill="#1d1d1d" font-family="sans-serif" font-size="13">
<text x="200" y="34">k = 0: [1%, 15%]</text>
<text x="200" y="68">k = 1: [1%, 8%]</text>
<text x="200" y="100">k = 2: [4.5%, 8%]</text>
<text x="200" y="132">k = 3: [4.5%, 6.25%]</text>
<text x="200" y="164">k = 4: [4.5%, 5.375%]</text>
<text x="22" y="220">1%</text>
<text x="92" y="220">4.5%</text>
<text x="172" y="220">8%</text>
<text x="314" y="220">15%</text>
<text x="128" y="234">rate 5.2627%</text>
</g>
</svg>
