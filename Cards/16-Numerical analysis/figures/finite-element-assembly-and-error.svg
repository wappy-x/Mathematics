<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" font-family="Helvetica, Arial, sans-serif">
<title>A 4 m cable bolted to a wall at the left and tied to a ring on a post at the right, cut into four 1 m elements; the exact sag curve and the four-element answer meet at the five nodes</title>
<rect x="0" y="0" width="360" height="240" fill="#ffffff"/>
<rect x="8" y="20" width="12" height="190" fill="#d9d9d9" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="340" y1="20" x2="340" y2="210" stroke="#1d1d1d" stroke-width="2"/>
<polyline fill="none" stroke="#1d1d1d" stroke-width="2" points="20,40.0 40,52.3 60,64.3 80,75.9 100,87.1 120,97.8 140,108.0 160,117.6 180,126.7 200,135.1 220,142.9 240,149.9 260,156.2 280,161.8 300,166.5 320,170.4 340,173.3"/>
<polyline fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,3" points="20,40.0 100,87.1 180,126.7 260,156.2 340,173.3"/>
<circle cx="20" cy="40.0" r="3.5" fill="#1d1d1d"/>
<circle cx="100" cy="87.1" r="3.5" fill="#1d1d1d"/>
<circle cx="180" cy="126.7" r="3.5" fill="#1d1d1d"/>
<circle cx="260" cy="156.2" r="3.5" fill="#1d1d1d"/>
<circle cx="340" cy="173.3" r="6" fill="none" stroke="#1d1d1d" stroke-width="2"/>
<line x1="340" y1="180" x2="340" y2="204" stroke="#1d1d1d" stroke-width="2"/>
<polygon points="335,200 345,200 340,210" fill="#1d1d1d"/>
<text x="26" y="34" font-size="13" fill="#1d1d1d">bolt: u = 0 (essential)</text>
<text x="96" y="78" font-size="13" fill="#1d1d1d">1</text>
<text x="176" y="117" font-size="13" fill="#1d1d1d">2</text>
<text x="256" y="146" font-size="13" fill="#1d1d1d">3</text>
<text x="178" y="196" font-size="13" fill="#1d1d1d">ring, pulled 40 N:</text>
<text x="178" y="212" font-size="13" fill="#1d1d1d">T u' = 40 N (natural)</text>
<text x="28" y="214" font-size="13" fill="#1d1d1d">solid: exact sag</text>
<text x="28" y="232" font-size="13" fill="#c0392b">dashed: four elements</text>
<text x="178" y="232" font-size="13" fill="#1d1d1d">tip sag 266.667 mm</text>
</svg>
