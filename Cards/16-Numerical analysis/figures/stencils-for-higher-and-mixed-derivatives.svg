<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240">
  <title>Three stencils drawn to scale: five equal points for a fourth-order curvature, three uneven points at -10, 0 and +25 basis points, and four corner points for the cross term</title>
  <rect x="0" y="0" width="360" height="240" fill="#ffffff"/>
  <text x="8" y="16" font-family="sans-serif" font-size="13" fill="#1d1d1d">Five points, curvature: weights divided by h²</text>
  <line x1="40" y1="52" x2="320" y2="52" stroke="#1d1d1d" stroke-width="1.5"/>
  <circle cx="60" cy="52" r="5" fill="#1d1d1d" stroke="#1d1d1d" stroke-width="1.5"/>
  <circle cx="120" cy="52" r="5" fill="#1d1d1d" stroke="#1d1d1d" stroke-width="1.5"/>
  <circle cx="180" cy="52" r="5" fill="#1d1d1d" stroke="#1d1d1d" stroke-width="1.5"/>
  <circle cx="240" cy="52" r="5" fill="#1d1d1d" stroke="#1d1d1d" stroke-width="1.5"/>
  <circle cx="300" cy="52" r="5" fill="#1d1d1d" stroke="#1d1d1d" stroke-width="1.5"/>
  <text x="60" y="38" font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="middle">−1/12</text>
  <text x="120" y="38" font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="middle">4/3</text>
  <text x="180" y="38" font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="middle">−5/2</text>
  <text x="240" y="38" font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="middle">4/3</text>
  <text x="300" y="38" font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="middle">−1/12</text>
  <text x="60" y="72" font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="middle">−2h</text>
  <text x="120" y="72" font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="middle">−h</text>
  <text x="180" y="72" font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="middle">0</text>
  <text x="240" y="72" font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="middle">h</text>
  <text x="300" y="72" font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="middle">2h</text>
  <text x="8" y="98" font-family="sans-serif" font-size="13" fill="#1d1d1d">Uneven, to scale: weights per bp²</text>
  <line x1="40" y1="128" x2="330" y2="128" stroke="#1d1d1d" stroke-width="1.5"/>
  <circle cx="100" cy="128" r="5" fill="#1d1d1d" stroke="#1d1d1d" stroke-width="1.5"/>
  <circle cx="160" cy="128" r="5" fill="#1d1d1d" stroke="#1d1d1d" stroke-width="1.5"/>
  <circle cx="310" cy="128" r="5" fill="#1d1d1d" stroke="#1d1d1d" stroke-width="1.5"/>
  <text x="100" y="116" font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="middle">1/175</text>
  <text x="160" y="116" font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="middle">−1/125</text>
  <text x="310" y="116" font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="middle">2/875</text>
  <text x="100" y="148" font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="middle">−10 bp</text>
  <text x="160" y="148" font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="middle">0</text>
  <text x="310" y="148" font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="middle">+25 bp</text>
  <text x="8" y="186" font-family="sans-serif" font-size="13" fill="#1d1d1d">Cross term:</text>
  <text x="8" y="202" font-family="sans-serif" font-size="13" fill="#1d1d1d">weights</text>
  <text x="8" y="218" font-family="sans-serif" font-size="13" fill="#1d1d1d">divided by h²</text>
  <rect x="150" y="168" width="60" height="60" fill="none" stroke="#1d1d1d" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="180" cy="198" r="4" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.5"/>
  <circle cx="150" cy="168" r="5" fill="#1d1d1d" stroke="#1d1d1d" stroke-width="1.5"/>
  <circle cx="210" cy="168" r="5" fill="#1d1d1d" stroke="#1d1d1d" stroke-width="1.5"/>
  <circle cx="150" cy="228" r="5" fill="#1d1d1d" stroke="#1d1d1d" stroke-width="1.5"/>
  <circle cx="210" cy="228" r="5" fill="#1d1d1d" stroke="#1d1d1d" stroke-width="1.5"/>
  <text x="140" y="172" font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="end">−1/4</text>
  <text x="220" y="172" font-family="sans-serif" font-size="13" fill="#1d1d1d">+1/4</text>
  <text x="140" y="232" font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="end">+1/4</text>
  <text x="220" y="232" font-family="sans-serif" font-size="13" fill="#1d1d1d">−1/4</text>
  <text x="252" y="202" font-family="sans-serif" font-size="13" fill="#1d1d1d">a: short end →</text>
  <text x="252" y="186" font-family="sans-serif" font-size="13" fill="#1d1d1d">b: long end ↑</text>
</svg>
