<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240">
  <title>One upwind step drawn to scale: the water that reaches the cell at 6.00 km at 3.0 h was at 5.80 km at 2.9 h, between the cells at 5.75 and 6.00 km</title>
  <rect x="0" y="0" width="360" height="240" fill="#ffffff"/>
  <line x1="44" y1="180" x2="340" y2="180" stroke="#1d1d1d" stroke-width="1.5"/>
  <line x1="44" y1="60" x2="340" y2="60" stroke="#1d1d1d" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="4" y="184" font-family="sans-serif" font-size="13" fill="#1d1d1d">2.9 h</text>
  <text x="4" y="64" font-family="sans-serif" font-size="13" fill="#1d1d1d">3.0 h</text>
  <line x1="220" y1="60" x2="156" y2="180" stroke="#1d1d1d" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="60" cy="180" r="5" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.5"/>
  <circle cx="140" cy="180" r="5" fill="#1d1d1d" stroke="#1d1d1d" stroke-width="1.5"/>
  <circle cx="220" cy="180" r="5" fill="#1d1d1d" stroke="#1d1d1d" stroke-width="1.5"/>
  <circle cx="300" cy="180" r="5" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.5"/>
  <circle cx="156" cy="180" r="3" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.5"/>
  <circle cx="220" cy="60" r="5" fill="#1d1d1d" stroke="#1d1d1d" stroke-width="1.5"/>
  <text x="232" y="50" font-family="sans-serif" font-size="13" fill="#1d1d1d">new value</text>
  <text x="176" y="112" font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="end">path of the water</text>
  <text x="152" y="168" font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="end">5.80</text>
  <text x="60" y="202" font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="middle">5.50</text>
  <text x="140" y="202" font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="middle">5.75</text>
  <text x="220" y="202" font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="middle">6.00</text>
  <text x="300" y="202" font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="middle">6.25 km</text>
  <text x="140" y="224" font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="middle">weight 0.8</text>
  <text x="220" y="224" font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="middle">weight 0.2</text>
  <text x="300" y="224" font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="middle">unused</text>
</svg>
