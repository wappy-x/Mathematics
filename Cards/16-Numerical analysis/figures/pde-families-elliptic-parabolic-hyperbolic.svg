<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240">
<title>Three grid stencils side by side, one grid spacing drawn as 30 units: the explicit heat step reads three points one time level back; the leapfrog sound step reads three points one level back and one two levels back; the plate's five-point rule ties each point to its four neighbours with no time axis</title>
<rect x="0" y="0" width="360" height="240" fill="#ffffff"/>
<g stroke="#1d1d1d" stroke-width="1.5" fill="none">
<line x1="30" y1="120" x2="60" y2="90"/>
<line x1="60" y1="120" x2="60" y2="90"/>
<line x1="90" y1="120" x2="60" y2="90"/>
<line x1="12" y1="158" x2="12" y2="84"/><polyline points="8,90 12,82 16,90"/>
<circle cx="60" cy="90" r="7" fill="#ffffff" stroke-width="2"/>
</g>
<g fill="#1d1d1d">
<circle cx="30" cy="90" r="2"/>
<circle cx="90" cy="90" r="2"/>
<circle cx="30" cy="120" r="5"/>
<circle cx="60" cy="120" r="5"/>
<circle cx="90" cy="120" r="5"/>
<circle cx="30" cy="150" r="2"/>
<circle cx="60" cy="150" r="2"/>
<circle cx="90" cy="150" r="2"/>
</g>
<g fill="#1d1d1d" font-family="sans-serif" font-size="13" text-anchor="middle"><text x="60" y="36" font-size="14">heat</text><text x="60" y="56">explicit</text><text x="60" y="190">1 level back</text><text x="12" y="76">t</text></g>
<g stroke="#1d1d1d" stroke-width="1.5" fill="none">
<line x1="150" y1="120" x2="180" y2="90"/>
<line x1="180" y1="120" x2="180" y2="90"/>
<line x1="210" y1="120" x2="180" y2="90"/>
<line x1="180" y1="150" x2="180" y2="90"/>
<line x1="132" y1="158" x2="132" y2="84"/><polyline points="128,90 132,82 136,90"/>
<circle cx="180" cy="90" r="7" fill="#ffffff" stroke-width="2"/>
</g>
<g fill="#1d1d1d">
<circle cx="150" cy="90" r="2"/>
<circle cx="210" cy="90" r="2"/>
<circle cx="150" cy="120" r="5"/>
<circle cx="180" cy="120" r="5"/>
<circle cx="210" cy="120" r="5"/>
<circle cx="150" cy="150" r="2"/>
<circle cx="180" cy="150" r="5"/>
<circle cx="210" cy="150" r="2"/>
</g>
<g fill="#1d1d1d" font-family="sans-serif" font-size="13" text-anchor="middle"><text x="180" y="36" font-size="14">sound</text><text x="180" y="56">leapfrog</text><text x="180" y="190">2 levels back</text><text x="132" y="76">t</text></g>
<g stroke="#1d1d1d" stroke-width="1.5" fill="none">
<line x1="270" y1="120" x2="300" y2="120"/>
<line x1="330" y1="120" x2="300" y2="120"/>
<line x1="300" y1="90" x2="300" y2="120"/>
<line x1="300" y1="150" x2="300" y2="120"/>
<line x1="252" y1="158" x2="252" y2="84"/><polyline points="248,90 252,82 256,90"/>
<circle cx="300" cy="120" r="7" fill="#ffffff" stroke-width="2"/>
</g>
<g fill="#1d1d1d">
<circle cx="270" cy="90" r="2"/>
<circle cx="300" cy="90" r="5"/>
<circle cx="330" cy="90" r="2"/>
<circle cx="270" cy="120" r="5"/>
<circle cx="330" cy="120" r="5"/>
<circle cx="270" cy="150" r="2"/>
<circle cx="300" cy="150" r="5"/>
<circle cx="330" cy="150" r="2"/>
</g>
<g fill="#1d1d1d" font-family="sans-serif" font-size="13" text-anchor="middle"><text x="300" y="36" font-size="14">plate</text><text x="300" y="56">5-point</text><text x="300" y="190">no time axis</text><text x="252" y="76">y</text></g>
<g fill="#1d1d1d" font-family="sans-serif" font-size="13" text-anchor="middle"><text x="180" y="222">filled: values read; ringed: the value being found</text></g>
</svg>
