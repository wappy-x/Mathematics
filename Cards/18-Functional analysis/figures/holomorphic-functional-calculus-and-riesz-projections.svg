<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" width="400" height="380" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>The spectrum {1, 2} of A = [[1, 1], [0, 2]] in the complex plane, the Riesz loop |z - 2| = 0.5, the loop |z - 1| = 0.5, and the large loop |z - 1.5| = 2 used for e^A, all to scale at 80 px per unit</title>
  <rect x="0" y="0" width="400" height="380" fill="#ffffff"/>
  <line x1="10" y1="190" x2="390" y2="190" stroke="#555555" stroke-width="1"/>
  <line x1="60" y1="20" x2="60" y2="365" stroke="#555555" stroke-width="1"/>
  <text x="378" y="208" fill="#1d1d1d">Re</text>
  <text x="66" y="30" fill="#1d1d1d">Im</text>
  <line x1="300" y1="185" x2="300" y2="195" stroke="#555555"/>
  <text x="48" y="208" fill="#1d1d1d">0</text>
  <text x="296" y="208" fill="#1d1d1d">3</text>
  <circle cx="180" cy="190" r="160" fill="none" stroke="#1d1d1d" stroke-width="1.2"/>
  <polygon points="172,30 184,24 184,36" fill="#1d1d1d"/>
  <text x="196" y="52" fill="#1d1d1d">loop for e^A: |z − 1.5| = 2</text>
  <circle cx="140" cy="190" r="40" fill="none" stroke="#1d1d1d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <polygon points="134,150 144,145 144,155" fill="#1d1d1d"/>
  <text x="104" y="250" fill="#1d1d1d">I − P</text>
  <circle cx="220" cy="190" r="40" fill="none" stroke="#1d1d1d" stroke-width="3"/>
  <polygon points="214,150 224,145 224,155" fill="#1d1d1d"/>
  <text x="212" y="250" fill="#1d1d1d" font-weight="bold">P</text>
  <circle cx="140" cy="190" r="5" fill="#1d1d1d"/>
  <circle cx="220" cy="190" r="5" fill="#1d1d1d"/>
  <text x="136" y="178" fill="#1d1d1d">1</text>
  <text x="216" y="178" fill="#1d1d1d">2</text>
</svg>
