<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" font-family="sans-serif">
<title>The evening peak u(t), a tent from 0 to 4 MW and back over 17:00 to 19:00, with its corner rounded over 15 minutes each side; below, its weak derivative, a step from +4 to -4 MW per hour, and the rounded curve's slope</title>
<rect x="0" y="0" width="420" height="300" fill="#ffffff"/>
<line x1="40" y1="130" x2="360" y2="130" stroke="#1d1d1d" stroke-width="1"/>
<polyline points="40,130 200,30 360,130" fill="none" stroke="#1d1d1d" stroke-width="2"/>
<polyline points="160,55 170,49.53 180,45.63 190,43.28 200,42.5 210,43.28 220,45.63 230,49.53 240,55" fill="none" stroke="#1d1d1d" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="200" cy="30" r="3" fill="#1d1d1d"/>
<text x="208" y="28" font-size="13" fill="#1d1d1d">4 MW at 18:00</text>
<text x="8" y="18" font-size="13" fill="#1d1d1d">load u(t), MW above base</text>
<line x1="40" y1="220" x2="360" y2="220" stroke="#1d1d1d" stroke-width="1"/>
<line x1="40" y1="180" x2="200" y2="180" stroke="#1d1d1d" stroke-width="2"/>
<line x1="200" y1="260" x2="360" y2="260" stroke="#1d1d1d" stroke-width="2"/>
<line x1="160" y1="180" x2="240" y2="260" stroke="#1d1d1d" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="8" y="160" font-size="13" fill="#1d1d1d">weak derivative g(t), MW per hour</text>
<text x="60" y="175" font-size="13" fill="#1d1d1d">+4</text>
<text x="320" y="255" font-size="13" fill="#1d1d1d">−4</text>
<text x="20" y="224" font-size="13" fill="#1d1d1d">0</text>
<text x="26" y="290" font-size="13" fill="#1d1d1d">17:00</text>
<text x="186" y="290" font-size="13" fill="#1d1d1d">18:00</text>
<text x="346" y="290" font-size="13" fill="#1d1d1d">19:00</text>
</svg>
