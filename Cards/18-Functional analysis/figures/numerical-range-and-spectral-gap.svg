<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>Two numerical ranges in the complex plane, to scale: the disc of radius 1/2 for N, inside the circle of radius 1 = ||N||, and the ellipse with foci 1 and -1 and semi-axes 1.414 and 1 for B, with the chord from 1 to i</title>
  <rect x="0" y="0" width="640" height="300" fill="#ffffff"/>
  <line x1="320" y1="10" x2="320" y2="290" stroke="#bbbbbb" stroke-width="1"/>
  <line x1="20" y1="150" x2="300" y2="150" stroke="#555555" stroke-width="1"/>
  <line x1="160" y1="20" x2="160" y2="285" stroke="#555555" stroke-width="1"/>
  <circle cx="160" cy="150" r="120" fill="none" stroke="#1d1d1d" stroke-width="1" stroke-dasharray="5,4"/>
  <circle cx="160" cy="150" r="60" fill="#d9d9d9" stroke="#1d1d1d" stroke-width="2"/>
  <circle cx="160" cy="150" r="4" fill="#1d1d1d"/>
  <circle cx="196" cy="126" r="3" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.5"/>
  <text x="200" y="122" fill="#1d1d1d">0.3 + 0.2i</text>
  <text x="146" y="166" fill="#1d1d1d">0</text>
  <text x="222" y="166" fill="#1d1d1d">1/2</text>
  <text x="283" y="166" fill="#1d1d1d">1</text>
  <text x="26" y="36" fill="#1d1d1d">N: W(N) is the shaded disc</text>
  <text x="26" y="276" fill="#1d1d1d">dashed: radius ||N|| = 1</text>
  <line x1="340" y1="150" x2="625" y2="150" stroke="#555555" stroke-width="1"/>
  <line x1="470" y1="20" x2="470" y2="285" stroke="#555555" stroke-width="1"/>
  <ellipse cx="470" cy="150" rx="141.4" ry="100" fill="#d9d9d9" stroke="#1d1d1d" stroke-width="2"/>
  <line x1="570" y1="150" x2="470" y2="50" stroke="#1d1d1d" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="370" cy="150" r="4" fill="#1d1d1d"/>
  <circle cx="570" cy="150" r="4" fill="#1d1d1d"/>
  <circle cx="470" cy="50" r="3" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.5"/>
  <circle cx="520" cy="100" r="3" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.5"/>
  <text x="360" y="168" fill="#1d1d1d">-1</text>
  <text x="566" y="168" fill="#1d1d1d">1</text>
  <text x="476" y="44" fill="#1d1d1d">i</text>
  <text x="526" y="96" fill="#1d1d1d">(1 + i)/2</text>
  <text x="336" y="36" fill="#1d1d1d">B: W(B) is the shaded ellipse</text>
  <text x="336" y="276" fill="#1d1d1d">dots on the axis: the eigenvalues</text>
</svg>
