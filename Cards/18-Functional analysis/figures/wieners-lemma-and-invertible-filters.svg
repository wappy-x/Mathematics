<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>The two zeros of the treble cut 0.2 z^2 + 0.6 z + 0.2 in the complex plane, drawn to scale: -0.382 inside the unit circle and -2.618 outside it</title>
  <rect x="0" y="0" width="420" height="260" fill="#ffffff"/>
  <line x1="20" y1="130" x2="405" y2="130" stroke="#1d1d1d" stroke-width="1"/>
  <line x1="300" y1="25" x2="300" y2="235" stroke="#1d1d1d" stroke-width="1"/>
  <line x1="140" y1="125" x2="140" y2="135" stroke="#1d1d1d"/>
  <line x1="220" y1="125" x2="220" y2="135" stroke="#1d1d1d"/>
  <line x1="380" y1="125" x2="380" y2="135" stroke="#1d1d1d"/>
  <line x1="295" y1="50" x2="305" y2="50" stroke="#1d1d1d"/>
  <text x="140" y="150" text-anchor="middle">-2</text>
  <text x="220" y="150" text-anchor="middle">-1</text>
  <text x="384" y="150" text-anchor="middle">1</text>
  <text x="308" y="54">i</text>
  <text x="405" y="122" text-anchor="end">real part</text>
  <circle cx="300" cy="130" r="80" fill="none" stroke="#264653" stroke-width="2"/>
  <text x="345" y="55">unit circle</text>
  <circle cx="269.44" cy="130" r="5" fill="#2a9d8f" stroke="#1d1d1d"/>
  <text x="269.44" y="112" text-anchor="middle">-0.382</text>
  <circle cx="90.56" cy="130" r="5" fill="#e76f51" stroke="#1d1d1d"/>
  <text x="90.56" y="112" text-anchor="middle">-2.618</text>
  <text x="90.56" y="185" text-anchor="middle">outside: taps for n &lt; 0</text>
  <text x="269.44" y="185" text-anchor="middle">inside: taps for n &#8805; 0</text>
  <text x="210" y="248" text-anchor="middle">Scale: 80 px per unit. Neither zero lies on the circle.</text>
</svg>
