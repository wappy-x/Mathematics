<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420" font-family="Helvetica, Arial, sans-serif" font-size="11">
  <title>The feasible set of the two-depot, three-shop transport plan: a pentagon with corners (0, 20), (15, 5), (15, 15), (5, 25) and (0, 25), the proportional plan (9, 15) inside, and the peel from corner (0, 20) through the plan to the edge point (15, 35/3)</title>
  <rect x="0" y="0" width="320" height="420" fill="#ffffff"/>
  <!-- scale: 12 units per pallet; origin (u, v) = (0, 0) at (50, 360) -->
  <g stroke="#bbbbbb" stroke-width="0.6">
    <line x1="110" y1="360" x2="110" y2="48"/><line x1="170" y1="360" x2="170" y2="48"/><line x1="230" y1="360" x2="230" y2="48"/>
    <line x1="50" y1="300" x2="242" y2="300"/><line x1="50" y1="240" x2="242" y2="240"/><line x1="50" y1="180" x2="242" y2="180"/>
    <line x1="50" y1="120" x2="242" y2="120"/><line x1="50" y1="60" x2="242" y2="60"/>
  </g>
  <g stroke="#1d1d1d" stroke-width="1.2">
    <line x1="50" y1="360" x2="250" y2="360"/><line x1="50" y1="360" x2="50" y2="40"/>
  </g>
  <g fill="#1d1d1d" text-anchor="middle">
    <text x="50" y="375">0</text><text x="110" y="375">5</text><text x="170" y="375">10</text><text x="230" y="375">15</text>
    <text x="150" y="395">u: pallets, depot 1 to shop 1</text>
  </g>
  <g fill="#1d1d1d" text-anchor="end">
    <text x="44" y="364">0</text><text x="44" y="304">5</text><text x="44" y="244">10</text><text x="44" y="184">15</text><text x="44" y="124">20</text><text x="44" y="64">25</text>
  </g>
  <text x="14" y="210" fill="#1d1d1d" text-anchor="middle" transform="rotate(-90 14 210)">v: pallets, depot 1 to shop 2</text>
  <polygon points="50,120 230,300 230,180 110,60 50,60" fill="#e9f3f1" stroke="#1d1d1d" stroke-width="1.6"/>
  <polygon points="50,120 230,300 230,180" fill="#cfe6e1" stroke="#2a9d8f" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="50" y1="120" x2="230" y2="220" stroke="#e76f51" stroke-width="1.6"/>
  <g fill="#1d1d1d">
    <circle cx="50" cy="120" r="4"/><circle cx="50" cy="60" r="4"/><circle cx="110" cy="60" r="4"/>
    <circle cx="230" cy="180" r="4"/><circle cx="230" cy="300" r="4"/>
  </g>
  <circle cx="158" cy="180" r="4.5" fill="#e76f51"/>
  <circle cx="230" cy="220" r="4" fill="#ffffff" stroke="#e76f51" stroke-width="1.6"/>
  <g fill="#1d1d1d">
    <text x="56" y="134">(0, 20)</text>
    <text x="56" y="52">(0, 25)</text>
    <text x="116" y="52">(5, 25)</text>
    <text x="236" y="176">(15, 15)</text>
    <text x="236" y="304">(15, 5)</text>
    <text x="236" y="224">(15, 35/3)</text>
    <text x="164" y="172">(9, 15)</text>
  </g>
</svg>
