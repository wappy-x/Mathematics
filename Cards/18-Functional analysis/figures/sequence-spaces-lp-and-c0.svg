<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 400" width="420" height="400">
  <title>Unit balls of the l1, l2 and sup norms for lists of two entries, with the point (0.6, 0.6)</title>
  <rect x="0" y="0" width="420" height="400" fill="#ffffff"/>
  <line x1="30" y1="200" x2="390" y2="200" stroke="#888888" stroke-width="1"/>
  <line x1="210" y1="20" x2="210" y2="365" stroke="#888888" stroke-width="1"/>
  <rect x="60" y="50" width="300" height="300" fill="none" stroke="#264653" stroke-width="2.5"/>
  <circle cx="210" cy="200" r="150" fill="none" stroke="#2a9d8f" stroke-width="2.5"/>
  <polygon points="360,200 210,50 60,200 210,350" fill="none" stroke="#e76f51" stroke-width="2.5"/>
  <circle cx="300" cy="110" r="5" fill="#1d1d1d"/>
  <text x="308" y="104" font-family="sans-serif" font-size="13" fill="#1d1d1d">(0.6, 0.6)</text>
  <text x="364" y="215" font-family="sans-serif" font-size="13" fill="#1d1d1d">1</text>
  <text x="196" y="44" font-family="sans-serif" font-size="13" fill="#1d1d1d">1</text>
  <text x="372" y="196" font-family="sans-serif" font-size="13" fill="#1d1d1d">x₁</text>
  <text x="216" y="30" font-family="sans-serif" font-size="13" fill="#1d1d1d">x₂</text>
  <text x="290" y="388" font-family="sans-serif" font-size="13" fill="#264653">sup: square</text>
  <text x="170" y="388" font-family="sans-serif" font-size="13" fill="#2a9d8f">l2: circle</text>
  <text x="40" y="388" font-family="sans-serif" font-size="13" fill="#e76f51">l1: diamond</text>
</svg>
