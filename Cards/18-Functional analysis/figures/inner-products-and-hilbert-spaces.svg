<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Unit balls of four meters on two samples, drawn to scale at 100 px per unit: the sum meter's diamond, the RMS circle, the peak meter's square and the pre-emphasis meter's tilted ellipse</title>
  <rect x="0" y="0" width="420" height="420" fill="#ffffff"/>
  <line x1="40" y1="190" x2="380" y2="190" stroke="#888888" stroke-width="1"/>
  <line x1="210" y1="40" x2="210" y2="340" stroke="#888888" stroke-width="1"/>
  <text x="384" y="194" fill="#1d1d1d">x₀</text>
  <text x="204" y="34" fill="#1d1d1d">x₁</text>
  <text x="313" y="206" fill="#1d1d1d">1</text>
  <text x="214" y="86" fill="#1d1d1d">1</text>
  <polygon points="310,190 210,90 110,190 210,290" fill="none" stroke="#264653" stroke-width="2" stroke-dasharray="7 4"/>
  <rect x="110" y="90" width="200" height="200" fill="none" stroke="#1d1d1d" stroke-width="2" stroke-dasharray="2 4"/>
  <circle cx="210" cy="190" r="100" fill="none" stroke="#1d1d1d" stroke-width="2"/>
  <ellipse cx="210" cy="190" rx="128.08" ry="78.08" transform="rotate(-52.0 210 190)" fill="none" stroke="#b5452c" stroke-width="2.5"/>
  <line x1="30" y1="362" x2="62" y2="362" stroke="#264653" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="70" y="366" fill="#1d1d1d">sum meter: a diamond with corners</text>
  <line x1="30" y1="382" x2="62" y2="382" stroke="#1d1d1d" stroke-width="2" stroke-dasharray="2 4"/>
  <text x="70" y="386" fill="#1d1d1d">peak meter: a square with corners</text>
  <line x1="230" y1="362" x2="262" y2="362" stroke="#1d1d1d" stroke-width="2"/>
  <text x="270" y="366" fill="#1d1d1d">RMS meter: a circle</text>
  <line x1="230" y1="382" x2="262" y2="382" stroke="#b5452c" stroke-width="2.5"/>
  <text x="270" y="386" fill="#1d1d1d">pre-emphasis: an ellipse</text>
  <text x="30" y="408" fill="#1d1d1d">Only the two smooth curves come from inner products.</text>
</svg>
