<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>The river depth 4x(1 - x) over one kilometre as a parabola peaking at 1 m, with a shaded rectangle of height 0.9 m on the stretch from 0.342 to 0.658 km where the depth reaches 0.9 m, and a dashed line at the average depth 2/3 m</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
