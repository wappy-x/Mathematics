<rect x="138.57" y="75" width="94.86" height="135" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<path d="M36,210 Q186,-90 336,210" fill="none" stroke="currentColor" stroke-width="2"/>
<line x1="36" y1="110" x2="336" y2="110" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5,3"/>
<line x1="32" y1="60" x2="36" y2="60" stroke="currentColor" stroke-width="1.5"/>
