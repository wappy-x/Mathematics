<text x="30" y="64" font-size="13" fill="currentColor" text-anchor="end">1 m</text>
<text x="30" y="84" font-size="13" fill="currentColor" text-anchor="end">0.9</text>
<text x="30" y="114" font-size="13" fill="currentColor" text-anchor="end">2/3</text>
<text x="36" y="228" font-size="13" fill="currentColor" text-anchor="middle">0</text>
<text x="138.57" y="228" font-size="13" fill="currentColor" text-anchor="middle">0.342</text>
<text x="233.43" y="228" font-size="13" fill="currentColor" text-anchor="middle">0.658</text>
<text x="336" y="228" font-size="13" fill="currentColor" text-anchor="middle">1 km</text>
<text x="46" y="24" font-size="13" fill="currentColor">curve: depth d(x); dashed: average 2/3 m</text>
<text x="46" y="42" font-size="13" fill="currentColor">shaded: 0.9 m on the set where d reaches 0.9</text>
</svg>
