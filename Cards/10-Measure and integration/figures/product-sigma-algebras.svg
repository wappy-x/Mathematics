<text x="160" y="232" font-size="13" text-anchor="middle" fill="currentColor">x, metres</text>
<text x="24" y="110" font-size="13" text-anchor="middle" fill="currentColor" transform="rotate(-90 24 110)">y, metres</text>
<text x="258" y="96" font-size="13" fill="currentColor">slice at</text>
<text x="258" y="114" font-size="13" fill="currentColor">x = 0.2:</text>
<text x="258" y="132" font-size="13" fill="currentColor">[0.1, 0.9]</text>
