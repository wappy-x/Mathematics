<rect x="115" y="42.5" width="22.5" height="135" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<rect x="137.5" y="42.5" width="22.5" height="135" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<rect x="160" y="42.5" width="22.5" height="135" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
