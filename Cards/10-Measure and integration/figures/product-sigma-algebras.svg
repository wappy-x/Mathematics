<line x1="106" y1="182" x2="106" y2="38" stroke="currentColor" stroke-width="2"/>
<circle cx="106" cy="182" r="3.5" fill="currentColor" stroke="currentColor" stroke-width="1.5"/>
<circle cx="106" cy="38" r="3.5" fill="currentColor" stroke="currentColor" stroke-width="1.5"/>
<line x1="70" y1="182" x2="106" y2="182" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3"/>
<line x1="70" y1="38" x2="106" y2="38" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="62" y="204" font-size="13" text-anchor="end" fill="currentColor">0</text>
<text x="62" y="186" font-size="13" text-anchor="end" fill="currentColor">0.1</text>
