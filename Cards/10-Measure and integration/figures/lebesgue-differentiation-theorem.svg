<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>Demand in kilowatts over one hour, to scale: rising from 2 to 4 by minute 20, jumping to 5, dropping to 3 at minute 45; the window from minute 16 to 24 is shaded at its average height, 4.31 kW, and short ticks mark the jump midpoints 4.5 and 4</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<line x1="40" y1="200" x2="345" y2="200" stroke="currentColor" stroke-width="1.5"/>
<line x1="40" y1="200" x2="40" y2="20" stroke="currentColor" stroke-width="1.5"/>
<rect x="120" y="70.6" width="40" height="129.4" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
<polyline points="40,140 60,137.6 80,130.4 100,118.4 120,101.6 140,80" fill="none" stroke="currentColor" stroke-width="2"/>
<line x1="140" y1="50" x2="265" y2="50" stroke="currentColor" stroke-width="2"/>
<line x1="265" y1="110" x2="340" y2="110" stroke="currentColor" stroke-width="2"/>
<circle cx="140" cy="80" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
<circle cx="140" cy="50" r="3" fill="currentColor" stroke="currentColor" stroke-width="1.5"/>
<circle cx="265" cy="50" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
<circle cx="265" cy="110" r="3" fill="currentColor" stroke="currentColor" stroke-width="1.5"/>
<line x1="133" y1="65" x2="147" y2="65" stroke="currentColor" stroke-width="1.5"/>
<line x1="258" y1="80" x2="272" y2="80" stroke="currentColor" stroke-width="1.5"/>
<line x1="190" y1="50" x2="190" y2="36" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="250" y="30" font-size="13" text-anchor="middle" fill="currentColor">glitch at t = 30: 100 kW</text>
<text x="168" y="150" font-size="13" fill="currentColor">shaded: t from 16 to 24,</text>
<text x="168" y="166" font-size="13" fill="currentColor">average 4.31 kW</text>
<text x="34" y="144" font-size="13" text-anchor="end" fill="currentColor">2</text>
<text x="34" y="84" font-size="13" text-anchor="end" fill="currentColor">4</text>
<text x="34" y="54" font-size="13" text-anchor="end" fill="currentColor">5 kW</text>
<text x="40" y="216" font-size="13" text-anchor="middle" fill="currentColor">0</text>
<text x="140" y="216" font-size="13" text-anchor="middle" fill="currentColor">20</text>
<text x="265" y="216" font-size="13" text-anchor="middle" fill="currentColor">45</text>
<text x="340" y="216" font-size="13" text-anchor="middle" fill="currentColor">60</text>
<text x="200" y="234" font-size="13" text-anchor="middle" fill="currentColor">t (minutes)</text>
</svg>
