<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>The slivers [20, 21), [20, 20.5) and [20, 20.25), drawn to scale on a line from 19 to 21 degrees, shrink to the single reading 20</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<rect x="160" y="36" width="120" height="22" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<rect x="160" y="76" width="60" height="22" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<rect x="160" y="116" width="30" height="22" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<circle cx="160" cy="166" r="4" fill="currentColor" stroke="currentColor" stroke-width="1.5"/>
<text x="150" y="52" font-size="13" text-anchor="end" fill="currentColor">n = 1: [20, 21)</text>
<text x="150" y="92" font-size="13" text-anchor="end" fill="currentColor">n = 2: [20, 20.5)</text>
<text x="150" y="132" font-size="13" text-anchor="end" fill="currentColor">n = 4: [20, 20.25)</text>
<text x="150" y="171" font-size="13" text-anchor="end" fill="currentColor">every n: {20}</text>
<line x1="20" y1="196" x2="340" y2="196" stroke="currentColor" stroke-width="1.5"/>
<line x1="40" y1="190" x2="40" y2="202" stroke="currentColor" stroke-width="1.5"/>
<line x1="160" y1="190" x2="160" y2="202" stroke="currentColor" stroke-width="1.5"/>
<line x1="280" y1="190" x2="280" y2="202" stroke="currentColor" stroke-width="1.5"/>
<text x="40" y="220" font-size="13" text-anchor="middle" fill="currentColor">19</text>
<text x="160" y="220" font-size="13" text-anchor="middle" fill="currentColor">20</text>
<text x="280" y="220" font-size="13" text-anchor="middle" fill="currentColor">21</text>
<text x="300" y="220" font-size="13" fill="currentColor">degrees</text>
</svg>
