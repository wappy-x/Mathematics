<path d="M40,44 V56 M320,44 V56 M40,89 V101 M180,89 V101 M320,89 V101 M40,134 V146 M110,134 V146 M180,134 V146 M250,134 V146 M320,134 V146 M40,179 V191 M75,179 V191 M110,179 V191 M145,179 V191 M180,179 V191 M215,179 V191 M250,179 V191 M285,179 V191 M320,179 V191" fill="none" stroke="currentColor" stroke-width="1.5"/>
