<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>The unit interval drawn three times; each copy shades where one binary digit of the position equals 1, in one, two and four pieces; a dashed line marks the dart at 0.7236 m</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<text x="30" y="30" font-size="13" fill="currentColor">digit 1 is 1</text>
