<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>The 1 m by 1 m board to scale, its centre at (0.5, 0.5), a dart at (0.8, 0.3) joined to the centre, a vertical strip from x = 0.2 to 0.25 and a horizontal strip from y = 0.7 to 0.75</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<rect x="80" y="20" width="10" height="200" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<rect x="40" y="70" width="200" height="10" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<rect x="40" y="20" width="200" height="200" fill="none" stroke="currentColor" stroke-width="2"/>
<line x1="140" y1="120" x2="200" y2="160" stroke="currentColor" stroke-width="1.5"/>
<circle cx="140" cy="120" r="3" fill="currentColor"/>
<circle cx="200" cy="160" r="3" fill="currentColor"/>
<text x="96" y="140" font-size="13" fill="currentColor">centre</text>
<text x="146" y="192" font-size="13" fill="currentColor">D = 0.36 m</text>
<text x="248" y="79" font-size="13" fill="currentColor">strip y = 0.7</text>
<text x="248" y="164" font-size="13" fill="currentColor">dart (0.8, 0.3)</text>
<text x="248" y="26" font-size="13" fill="currentColor">(1, 1)</text>
<text x="4" y="236" font-size="13" fill="currentColor">(0, 0)</text>
<text x="60" y="236" font-size="13" fill="currentColor">strip x = 0.2</text>
</svg>
