<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>The 1 m square board drawn to scale; the L-shaped region where the larger coordinate exceeds 0.5 m is shaded and has area 0.75; the unshaded lower-left square of side 0.5 m has area 0.25; a dart at (0.3, 0.8) lies in the shaded region</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<path d="M 40 20 H 200 V 180 H 120 V 100 H 40 Z" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<rect x="40" y="20" width="160" height="160" fill="none" stroke="currentColor" stroke-width="2"/>
<path d="M 40 100 H 120 V 180" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4"/>
<circle cx="88" cy="52" r="4" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<text x="96" y="48" font-size="13" fill="currentColor">dart (0.3, 0.8)</text>
<text x="40" y="198" font-size="13" text-anchor="middle" fill="currentColor">0</text>
<text x="120" y="198" font-size="13" text-anchor="middle" fill="currentColor">0.5</text>
<text x="200" y="198" font-size="13" text-anchor="middle" fill="currentColor">1 m</text>
<text x="34" y="104" font-size="13" text-anchor="end" fill="currentColor">0.5</text>
<text x="34" y="24" font-size="13" text-anchor="end" fill="currentColor">1 m</text>
<text x="120" y="220" font-size="13" text-anchor="middle" fill="currentColor">x across, y up</text>
<text x="212" y="60" font-size="13" fill="currentColor">max &gt; 0.5:</text>
<text x="212" y="78" font-size="13" fill="currentColor">area 0.75</text>
<text x="212" y="146" font-size="13" fill="currentColor">max ≤ 0.5:</text>
<text x="212" y="164" font-size="13" fill="currentColor">area 0.25</text>
</svg>
