<svg viewBox="0 0 360 330" xmlns="http://www.w3.org/2000/svg" width="360" height="330" style="color:#24292f">
<title>The 4 m by 4 m yard to scale with the round fence of radius 1 m at its centre; the fence and the centre point, where the distance to the fence has no gradient, are marked; gradient arrows of length 0.4 m at mower A (1.5, 2.0) pointing away from the fence and at mower B (0.3, 0.4) pointing towards the centre; the line y = 0.5 crosses the fence at x = -0.866 and 0.866</title>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#24292f"/></marker></defs>
<rect x="0" y="0" width="360" height="330" rx="8" fill="#ffffff"/>
<rect x="60" y="45" width="240" height="240" fill="none" stroke="currentColor" stroke-width="1.5"/>
<line x1="60" y1="135" x2="300" y2="135" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3"/>
<circle cx="180" cy="165" r="60" fill="none" stroke="currentColor" stroke-width="3"/>
<circle cx="180" cy="165" r="3.5" fill="currentColor"/>
<circle cx="128.04" cy="135" r="4" fill="#ffffff" stroke="currentColor" stroke-width="1.5"/>
<circle cx="231.96" cy="135" r="4" fill="#ffffff" stroke="currentColor" stroke-width="1.5"/>
<circle cx="270" cy="45" r="3" fill="currentColor"/>
<line x1="270" y1="45" x2="284.4" y2="25.8" stroke="#24292f" stroke-width="2" marker-end="url(#head)"/>
<circle cx="198" cy="141" r="3" fill="currentColor"/>
<line x1="198" y1="141" x2="183.6" y2="160.2" stroke="#24292f" stroke-width="2" marker-end="url(#head)"/>
<text x="252" y="60" font-size="13" fill="currentColor">A</text>
<text x="204" y="154" font-size="13" fill="currentColor">B</text>
<text x="164" y="184" font-size="13" fill="currentColor">O</text>
<text x="196" y="250" font-size="13" fill="currentColor">fence, r = 1 m</text>
<text x="64" y="129" font-size="12" fill="currentColor">y = 0.5</text>
<text x="60" y="305" font-size="12" fill="currentColor">(-2, -2)</text>
<text x="262" y="305" font-size="12" fill="currentColor">(2, -2)</text>
<text x="10" y="322" font-size="12" fill="currentColor">no gradient: the fence and its centre O</text>
</svg>
