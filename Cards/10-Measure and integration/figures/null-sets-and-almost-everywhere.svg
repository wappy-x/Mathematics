<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>A dartboard of radius 1 m drawn at 100 units per metre, with discs of radius 0.5, 0.2 and 0.1 m around the centre and a shaded rim band 0.1 m wide</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<path d="M20,120 a100,100 0 1,0 200,0 a100,100 0 1,0 -200,0 Z M30,120 a90,90 0 1,0 180,0 a90,90 0 1,0 -180,0 Z" fill="currentColor" fill-opacity="0.12" fill-rule="evenodd" stroke="none"/>
<circle cx="120" cy="120" r="100" fill="none" stroke="currentColor" stroke-width="2"/>
<circle cx="120" cy="120" r="50" fill="none" stroke="currentColor" stroke-width="1.5"/>
<circle cx="120" cy="120" r="20" fill="none" stroke="currentColor" stroke-width="1.5"/>
<circle cx="120" cy="120" r="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
<circle cx="120" cy="120" r="2" fill="currentColor" stroke="currentColor" stroke-width="1.5"/>
<text x="230" y="40" font-size="13" fill="currentColor">board: radius 1 m</text>
<text x="230" y="80" font-size="13" fill="currentColor">discs of radius</text>
<text x="230" y="97" font-size="13" fill="currentColor">0.5, 0.2, 0.1 m:</text>
<text x="230" y="114" font-size="13" fill="currentColor">chance 0.25,</text>
<text x="230" y="131" font-size="13" fill="currentColor">0.04, 0.01</text>
<text x="230" y="170" font-size="13" fill="currentColor">shaded rim band</text>
<text x="230" y="187" font-size="13" fill="currentColor">0.1 m wide:</text>
<text x="230" y="204" font-size="13" fill="currentColor">chance 0.19</text>
</svg>
