<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>The doubling map T(x) = 2x mod 1 on [0, 1): the band of values from 0.2 to 0.5 and its preimage, the starts from 0.1 to 0.25 and from 0.6 to 0.75, each half as long</title>
  <rect x="0" y="0" width="400" height="400" fill="#ffffff"/>
  <rect x="60" y="220" width="280" height="84" fill="#f4a261" fill-opacity="0.35"/>
  <rect x="88" y="80" width="42" height="280" fill="#2a9d8f" fill-opacity="0.30"/>
  <rect x="228" y="80" width="42" height="280" fill="#2a9d8f" fill-opacity="0.30"/>
  <rect x="60" y="80" width="280" height="280" fill="none" stroke="#1d1d1d" stroke-width="1.5"/>
  <line x1="60" y1="360" x2="200" y2="80" stroke="#1d1d1d" stroke-width="2.5"/>
  <line x1="200" y1="360" x2="340" y2="80" stroke="#1d1d1d" stroke-width="2.5"/>
  <line x1="88" y1="360" x2="130" y2="360" stroke="#1d6b62" stroke-width="6"/>
  <line x1="228" y1="360" x2="270" y2="360" stroke="#1d6b62" stroke-width="6"/>
  <line x1="60" y1="304" x2="60" y2="220" stroke="#b5542a" stroke-width="6"/>
  <g fill="#1d1d1d" text-anchor="middle">
    <text x="60" y="378">0</text>
    <text x="88" y="378">0.1</text>
    <text x="130" y="378">0.25</text>
    <text x="200" y="378">0.5</text>
    <text x="228" y="378">0.6</text>
    <text x="270" y="378">0.75</text>
    <text x="340" y="378">1</text>
    <text x="200" y="396">x, the start</text>
    <text x="200" y="40" font-size="14">T(x) = 2x mod 1</text>
    <text x="200" y="60">band 0.2 to 0.5 (length 0.3) and its preimage (0.15 + 0.15)</text>
  </g>
  <g fill="#1d1d1d" text-anchor="end">
    <text x="54" y="364">0</text>
    <text x="54" y="308">0.2</text>
    <text x="54" y="224">0.5</text>
    <text x="54" y="84">1</text>
  </g>
  <text x="22" y="220" fill="#1d1d1d" text-anchor="middle" transform="rotate(-90 22 220)">T(x), where it lands</text>
</svg>
