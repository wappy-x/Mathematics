<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>Rounding to the nearest kilogram drawn to scale for weights 0 to 4 kg; the readings below 2 come exactly from the weights below 1.5 kg, shaded on the weight axis, with the four parcels marked</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<line x1="40" y1="200" x2="330" y2="200" stroke="currentColor" stroke-width="1.5"/>
<line x1="40" y1="200" x2="40" y2="30" stroke="currentColor" stroke-width="1.5"/>
<rect x="40" y="192" width="105" height="8" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<line x1="75" y1="160" x2="145" y2="160" stroke="currentColor" stroke-width="2"/>
<line x1="145" y1="120" x2="215" y2="120" stroke="currentColor" stroke-width="2"/>
<line x1="215" y1="80" x2="285" y2="80" stroke="currentColor" stroke-width="2"/>
<line x1="285" y1="40" x2="320" y2="40" stroke="currentColor" stroke-width="2"/>
<line x1="40" y1="120" x2="320" y2="120" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4"/>
<circle cx="131" cy="200" r="3.5" fill="currentColor" stroke="currentColor" stroke-width="1.5"/>
<circle cx="166" cy="200" r="3.5" fill="currentColor" stroke="currentColor" stroke-width="1.5"/>
<circle cx="194" cy="200" r="3.5" fill="currentColor" stroke="currentColor" stroke-width="1.5"/>
<circle cx="292" cy="200" r="3.5" fill="currentColor" stroke="currentColor" stroke-width="1.5"/>
<text x="30" y="164" font-size="13" text-anchor="end" fill="currentColor">1</text>
<text x="30" y="124" font-size="13" text-anchor="end" fill="currentColor">2</text>
<text x="30" y="84" font-size="13" text-anchor="end" fill="currentColor">3</text>
<text x="30" y="44" font-size="13" text-anchor="end" fill="currentColor">4</text>
<text x="48" y="24" font-size="13" fill="currentColor">rounded reading</text>
<text x="226" y="114" font-size="13" fill="currentColor">reading 2</text>
<text x="150" y="186" font-size="13" fill="currentColor">shaded: weight below 1.5</text>
<text x="131" y="216" font-size="13" text-anchor="middle" fill="currentColor">p1</text>
<text x="166" y="216" font-size="13" text-anchor="middle" fill="currentColor">p2</text>
<text x="194" y="216" font-size="13" text-anchor="middle" fill="currentColor">p3</text>
<text x="292" y="216" font-size="13" text-anchor="middle" fill="currentColor">p4</text>
<text x="40" y="234" font-size="13" text-anchor="middle" fill="currentColor">0</text>
<text x="110" y="234" font-size="13" text-anchor="middle" fill="currentColor">1</text>
<text x="180" y="234" font-size="13" text-anchor="middle" fill="currentColor">2</text>
<text x="250" y="234" font-size="13" text-anchor="middle" fill="currentColor">3</text>
<text x="320" y="234" font-size="13" text-anchor="middle" fill="currentColor">4 kg</text>
</svg>
