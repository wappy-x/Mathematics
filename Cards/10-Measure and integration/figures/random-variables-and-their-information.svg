<line x1="70" y1="160" x2="270" y2="160" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.4"/>
<circle cx="95" cy="185" r="4" fill="currentColor" stroke="currentColor" stroke-width="1.5"/>
<line x1="95" y1="135" x2="145" y2="185" stroke="currentColor" stroke-width="2"/>
