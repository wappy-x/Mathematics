<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>Spotlight frames 1, 2 and 4 on a 1 m stage: strips of width 1, 0.5 and 0.25 m at brightness 1, 2 and 4 W/m, all ending at the right wing, each of area 1 W, drawn to scale</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<path d="M40,200 L40,160 L320,160 L320,200 Z" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<path d="M180,200 L180,120 L320,120 L320,200 Z" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<path d="M250,200 L250,40 L320,40 L320,200 Z" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<line x1="40" y1="200" x2="330" y2="200" stroke="currentColor" stroke-width="2"/>
<line x1="40" y1="30" x2="40" y2="200" stroke="currentColor" stroke-width="2"/>
<line x1="36" y1="160" x2="40" y2="160" stroke="currentColor" stroke-width="1.5"/>
<line x1="36" y1="120" x2="40" y2="120" stroke="currentColor" stroke-width="1.5"/>
<line x1="36" y1="40" x2="40" y2="40" stroke="currentColor" stroke-width="1.5"/>
<text x="33" y="164" font-size="13" text-anchor="end" fill="currentColor">1</text>
<text x="33" y="124" font-size="13" text-anchor="end" fill="currentColor">2</text>
<text x="33" y="44" font-size="13" text-anchor="end" fill="currentColor">4</text>
<text x="46" y="30" font-size="13" fill="currentColor">W/m</text>
<text x="110" y="185" font-size="13" text-anchor="middle" fill="currentColor">frame 1</text>
<text x="215" y="145" font-size="13" text-anchor="middle" fill="currentColor">frame 2</text>
<text x="285" y="85" font-size="13" text-anchor="middle" fill="currentColor">frame 4</text>
<text x="40" y="216" font-size="13" text-anchor="middle" fill="currentColor">0</text>
<text x="180" y="216" font-size="13" text-anchor="middle" fill="currentColor">0.5</text>
<text x="250" y="216" font-size="13" text-anchor="middle" fill="currentColor">0.75</text>
<text x="320" y="216" font-size="13" text-anchor="middle" fill="currentColor">1 m</text>
<text x="190" y="234" font-size="13" text-anchor="middle" fill="currentColor">position on the stage</text>
