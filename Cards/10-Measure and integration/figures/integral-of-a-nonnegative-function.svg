<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>River long section with bed d(x) = 4x(1 - x) and the depth rounded down to quarter metres shown as shaded blocks, drawn to scale</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<path d="M50.1,40 L50.1,80 L73.9,80 L73.9,120 L105,120 L105,160 L255,160 L255,120 L286.1,120 L286.1,80 L309.9,80 L309.9,40 Z" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<path d="M30,40 Q180,360 330,40" fill="none" stroke="currentColor" stroke-width="2"/>
<line x1="30" y1="40" x2="330" y2="40" stroke="currentColor" stroke-width="1.5"/>
<text x="16" y="30" font-size="13" fill="currentColor">0 km</text>
<text x="140" y="30" font-size="13" fill="currentColor">water surface</text>
