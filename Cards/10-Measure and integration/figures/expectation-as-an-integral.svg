<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>Cross-section of a 1 km river drawn to scale, depth 4x(1 - x) metres shown downward; the stretch from 0.25 to 0.75 km where the water is at least 0.75 m deep is shaded on the surface, and a boat at 0.3 km sits over 0.84 m of water</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<line x1="40" y1="40" x2="320" y2="40" stroke="currentColor" stroke-width="1.5"/>
<path d="M 40 40 Q 180 360 320 40" fill="none" stroke="currentColor" stroke-width="2"/>
<rect x="110" y="32" width="140" height="8" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<line x1="110" y1="160" x2="250" y2="160" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="110" y1="40" x2="110" y2="160" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 3"/>
<line x1="250" y1="40" x2="250" y2="160" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 3"/>
<line x1="124" y1="40" x2="124" y2="174" stroke="currentColor" stroke-width="1.5"/>
<circle cx="124" cy="36" r="4" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<line x1="40" y1="40" x2="40" y2="200" stroke="currentColor" stroke-width="1.5"/>
<line x1="36" y1="160" x2="40" y2="160" stroke="currentColor" stroke-width="1.5"/>
<line x1="36" y1="200" x2="40" y2="200" stroke="currentColor" stroke-width="1.5"/>
<text x="33" y="44" font-size="13" text-anchor="end" fill="currentColor">0 m</text>
<text x="33" y="164" font-size="13" text-anchor="end" fill="currentColor">0.75</text>
<text x="33" y="204" font-size="13" text-anchor="end" fill="currentColor">1 m</text>
<text x="40" y="22" font-size="13" text-anchor="middle" fill="currentColor">0</text>
<text x="110" y="22" font-size="13" text-anchor="middle" fill="currentColor">0.25</text>
<text x="250" y="22" font-size="13" text-anchor="middle" fill="currentColor">0.75</text>
<text x="320" y="22" font-size="13" text-anchor="middle" fill="currentColor">1 km</text>
<text x="130" y="100" font-size="13" fill="currentColor">boat: 0.84 m</text>
<text x="180" y="222" font-size="13" text-anchor="middle" fill="currentColor">deepest point, 1 m</text>
<text x="256" y="178" font-size="13" fill="currentColor">depth 0.75 m</text>
</svg>
