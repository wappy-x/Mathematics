<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="320" height="440" font-family="Helvetica, Arial, sans-serif" font-size="10">
  <title>The s-plane to scale: the critical strip, the mirror line Re s = 1/2, the pole at 1, the trivial zeros at -2, -4, -6, -8, the mirror pair 2+3i and -1-3i, and the first zero at 1/2 + 14.13i</title>
  <rect x="0" y="0" width="320" height="440" fill="#ffffff"/>
  <rect x="210" y="20" width="20" height="400" fill="#e6e6e6"/>
  <line x1="20" y1="330" x2="305" y2="330" stroke="#1d1d1d" stroke-width="1.2"/>
  <line x1="210" y1="20" x2="210" y2="420" stroke="#1d1d1d" stroke-width="1.2"/>
  <line x1="220" y1="20" x2="220" y2="420" stroke="#1d1d1d" stroke-width="1" stroke-dasharray="4 3"/>
  <g stroke="#1d1d1d" stroke-width="1">
    <line x1="50" y1="326" x2="50" y2="334"/><line x1="90" y1="326" x2="90" y2="334"/>
    <line x1="130" y1="326" x2="130" y2="334"/><line x1="170" y1="326" x2="170" y2="334"/>
    <line x1="250" y1="326" x2="250" y2="334"/><line x1="290" y1="326" x2="290" y2="334"/>
    <line x1="206" y1="130" x2="214" y2="130"/><line x1="206" y1="230" x2="214" y2="230"/>
  </g>
  <g fill="#1d1d1d">
    <circle cx="170" cy="330" r="3.5"/><circle cx="130" cy="330" r="3.5"/>
    <circle cx="90" cy="330" r="3.5"/><circle cx="50" cy="330" r="3.5"/>
    <circle cx="220" cy="47.3" r="3.5"/>
  </g>
  <g fill="#1d1d1d" text-anchor="middle">
    <text x="50" y="348">-8</text><text x="90" y="348">-6</text><text x="130" y="348">-4</text>
    <text x="170" y="348">-2</text><text x="290" y="348">4</text>
    <text x="110" y="364">trivial zeros</text>
  </g>
  <path d="M226 324 L234 336 M226 336 L234 324" stroke="#1d1d1d" stroke-width="1.6"/>
  <text x="236" y="322" fill="#1d1d1d">pole at 1</text>
  <circle cx="250" cy="270" r="3.5" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.4"/>
  <circle cx="190" cy="390" r="3.5" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.4"/>
  <line x1="250" y1="270" x2="190" y2="390" stroke="#1d1d1d" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="256" y="268" fill="#1d1d1d">2+3i</text>
  <text x="150" y="402" fill="#1d1d1d">-1-3i</text>
  <text x="200" y="134" fill="#1d1d1d" text-anchor="end">10i</text>
  <text x="200" y="234" fill="#1d1d1d" text-anchor="end">5i</text>
  <text x="228" y="44" fill="#1d1d1d">1/2 + 14.13i</text>
  <text x="228" y="58" fill="#1d1d1d">first zero</text>
  <text x="226" y="30" fill="#1d1d1d">Re s = 1/2</text>
  <text x="196" y="30" fill="#1d1d1d" text-anchor="end">strip 0 &#8804; Re s &#8804; 1</text>
</svg>
