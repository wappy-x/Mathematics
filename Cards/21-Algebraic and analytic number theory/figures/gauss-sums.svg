<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 482" width="340" height="482" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title>The quadratic Gauss sum mod 7 as a walk of six unit steps that ends at i times the square root of 7</title>
<rect x="0" y="0" width="340" height="482" fill="#ffffff"/>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1d"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
<line x1="23.0" y1="330.0" x2="279.5" y2="330.0" stroke="#888888" stroke-width="1"/>
<line x1="140.0" y1="447.0" x2="140.0" y2="60.0" stroke="#888888" stroke-width="1"/>
<circle cx="140.0" cy="330.0" r="90" fill="none" stroke="#888888" stroke-width="1"/>
<circle cx="230.0" cy="330.0" r="4.5" fill="#888888" stroke="#1d1d1d" stroke-width="1.5"/>
<text x="248.0" y="334.0" text-anchor="middle">0</text>
<circle cx="196.1" cy="259.6" r="4.5" fill="#1d1d1d" stroke="#1d1d1d" stroke-width="1.5"/>
<text x="207.3" y="249.6" text-anchor="middle">1</text>
<circle cx="120.0" cy="242.3" r="4.5" fill="#1d1d1d" stroke="#1d1d1d" stroke-width="1.5"/>
<text x="116.0" y="228.7" text-anchor="middle">2</text>
<circle cx="58.9" cy="291.0" r="4.5" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.5"/>
<text x="42.7" y="287.1" text-anchor="middle">3</text>
<circle cx="58.9" cy="369.0" r="4.5" fill="#1d1d1d" stroke="#1d1d1d" stroke-width="1.5"/>
<text x="42.7" y="380.9" text-anchor="middle">4</text>
<circle cx="120.0" cy="417.7" r="4.5" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.5"/>
<text x="116.0" y="439.3" text-anchor="middle">5</text>
<circle cx="196.1" cy="400.4" r="4.5" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.5"/>
<text x="207.3" y="418.4" text-anchor="middle">6</text>
<line x1="140.0" y1="330.0" x2="196.1" y2="259.6" stroke="#1d1d1d" stroke-width="2" marker-end="url(#h)"/>
<text x="178.9" y="306.0" text-anchor="middle">+ζ</text>
<line x1="196.1" y1="259.6" x2="176.1" y2="171.9" stroke="#1d1d1d" stroke-width="2" marker-end="url(#h)"/>
<text x="158.2" y="190.1" text-anchor="middle">+ζ²</text>
<line x1="176.1" y1="171.9" x2="257.2" y2="210.9" stroke="#1d1d1d" stroke-width="2" marker-end="url(#h)"/>
<text x="231.0" y="186.4" text-anchor="middle">−ζ³</text>
<line x1="257.2" y1="210.9" x2="176.1" y2="250.0" stroke="#1d1d1d" stroke-width="2" marker-end="url(#h)"/>
<text x="225.6" y="221.0" text-anchor="middle">+ζ⁴</text>
<line x1="176.1" y1="250.0" x2="196.1" y2="162.2" stroke="#1d1d1d" stroke-width="2" marker-end="url(#h)"/>
<text x="158.2" y="239.8" text-anchor="middle">−ζ⁵</text>
<line x1="196.1" y1="162.2" x2="140.0" y2="91.9" stroke="#1d1d1d" stroke-width="2" marker-end="url(#h)"/>
<text x="168.1" y="118.5" text-anchor="middle">−ζ⁶</text>
<line x1="140.0" y1="330.0" x2="140.0" y2="91.9" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
<text x="150.8" y="82.9" text-anchor="start" fill="#c0392b">g = i√7 = 2.645751311i</text>
<text x="12" y="472" fill="#1d1d1d">filled: residues 1, 2, 4; hollow: non-residues 3, 5, 6</text>
</svg>
