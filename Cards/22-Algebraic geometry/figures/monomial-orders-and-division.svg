<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 400" width="420" height="400" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>The monomial staircase for xy and y squared: terms of x squared y plus x y squared plus y squared inside, the remainder terms x, y and 1 outside</title>
  <rect x="0" y="0" width="420" height="400" fill="#ffffff"/>
  <polygon points="80,52 80,180 160,180 160,260 368,260 368,52" fill="#e3e3e3" stroke="#1d1d1d" stroke-width="2"/>
  <g stroke="#9a9a9a" stroke-width="1">
    <line x1="80" y1="260" x2="368" y2="260"/><line x1="80" y1="180" x2="368" y2="180"/><line x1="80" y1="100" x2="368" y2="100"/>
    <line x1="160" y1="340" x2="160" y2="52"/><line x1="240" y1="340" x2="240" y2="52"/><line x1="320" y1="340" x2="320" y2="52"/>
  </g>
  <line x1="80" y1="340" x2="380" y2="340" stroke="#1d1d1d" stroke-width="2"/>
  <line x1="80" y1="340" x2="80" y2="40" stroke="#1d1d1d" stroke-width="2"/>
  <g fill="#1d1d1d" text-anchor="middle">
    <text x="80" y="360">0</text><text x="160" y="360">1</text><text x="240" y="360">2</text><text x="320" y="360">3</text>
    <text x="230" y="390">power of x</text>
  </g>
  <g fill="#1d1d1d" text-anchor="end">
    <text x="68" y="345">0</text><text x="68" y="265">1</text><text x="68" y="185">2</text><text x="68" y="105">3</text>
  </g>
  <text x="22" y="200" fill="#1d1d1d" text-anchor="middle" transform="rotate(-90 22 200)">power of y</text>
  <g fill="#1d1d1d" stroke="#1d1d1d" stroke-width="2">
    <circle cx="240" cy="260" r="7"/><circle cx="160" cy="180" r="7"/><circle cx="80" cy="180" r="7"/>
  </g>
  <g fill="#ffffff" stroke="#1d1d1d" stroke-width="2">
    <circle cx="160" cy="340" r="7"/><circle cx="80" cy="260" r="7"/><circle cx="80" cy="340" r="7"/>
  </g>
  <g fill="#1d1d1d">
    <text x="250" y="252">x²y</text><text x="170" y="172">xy²</text><text x="90" y="172">y²</text>
    <text x="170" y="332">x</text><text x="90" y="252">y</text><text x="90" y="332">1</text>
    <text x="300" y="80">multiples of xy or y²</text>
  </g>
</svg>
