<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Three beacon range circles and the lane x + y = 1, drawn to scale (1 m = 20 px)</title>
  <rect x="0" y="0" width="480" height="480" fill="#ffffff"/>
  <line x1="30" y1="250" x2="450" y2="250" stroke="#bbbbbb" stroke-width="1"/>
  <line x1="230" y1="30" x2="230" y2="450" stroke="#bbbbbb" stroke-width="1"/>
  <text x="440" y="266" fill="#555555">x</text>
  <text x="238" y="42" fill="#555555">y</text>
  <circle cx="230" cy="250" r="100" fill="none" stroke="#1d1d1d" stroke-width="2"/>
  <circle cx="310" cy="170" r="140" fill="none" stroke="#264653" stroke-width="2"/>
  <circle cx="170" cy="310" r="140" fill="none" stroke="#2a9d8f" stroke-width="2" stroke-dasharray="7 5"/>
  <line x1="30" y1="30" x2="450" y2="450" stroke="#e76f51" stroke-width="2"/>
  <circle cx="230" cy="250" r="4" fill="#1d1d1d"/>
  <circle cx="310" cy="170" r="4" fill="#264653"/>
  <circle cx="170" cy="310" r="4" fill="#2a9d8f"/>
  <circle cx="310" cy="310" r="6" fill="#e76f51" stroke="#1d1d1d"/>
  <circle cx="170" cy="170" r="6" fill="#e76f51" stroke="#1d1d1d"/>
  <text x="206" y="268" fill="#1d1d1d">A (0, 0), 5 m</text>
  <text x="318" y="164" fill="#264653">B (4, 4), 7 m</text>
  <text x="60" y="330" fill="#2a9d8f">C (−3, −3), 7 m</text>
  <text x="320" y="330" fill="#1d1d1d">fix (4, −3)</text>
  <text x="96" y="160" fill="#1d1d1d">fix (−3, 4)</text>
  <text x="372" y="420" fill="#e76f51">x + y = 1</text>
</svg>
