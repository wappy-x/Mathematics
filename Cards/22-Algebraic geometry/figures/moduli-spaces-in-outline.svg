<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 430" width="440" height="430" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>The j-line as a region of the upper half-plane: one point per lattice shape, to scale</title>
  <rect x="0" y="0" width="440" height="430" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d1d1d"/>
    </marker>
  </defs>
  <path d="M 140 30 L 140 261.4 A 160 160 0 0 1 300 261.4 L 300 30 Z" fill="#e8f1f0" stroke="none"/>
  <path d="M 60 400 A 160 160 0 0 1 380 400" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="20" y1="400" x2="420" y2="400" stroke="#1d1d1d" stroke-width="1.2"/>
  <line x1="220" y1="400" x2="220" y2="30" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 4"/>
  <path d="M 140 30 L 140 261.4 A 160 160 0 0 1 300 261.4 L 300 30" fill="none" stroke="#1d1d1d" stroke-width="2"/>
  <g fill="#1d1d1d" text-anchor="middle">
    <text x="60" y="418">-1</text><text x="140" y="418">-1/2</text><text x="220" y="418">0</text>
    <text x="300" y="418">1/2</text><text x="380" y="418">1</text>
  </g>
  <g fill="#e76f51" stroke="#1d1d1d" stroke-width="1">
    <circle cx="140" cy="261.4" r="5"/><circle cx="300" cy="261.4" r="5"/>
    <circle cx="220" cy="240" r="5"/><circle cx="220" cy="173.7" r="5"/><circle cx="220" cy="80" r="5"/>
  </g>
  <circle cx="220" cy="320" r="5" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.5"/>
  <g fill="#1d1d1d">
    <text x="132" y="282" text-anchor="end">rho: j = 0</text>
    <text x="308" y="282">rho + 1: j = 0</text>
    <text x="228" y="236">i: j = 1728</text>
    <text x="228" y="170">i sqrt2: j = 8000</text>
    <text x="228" y="76">2i: j = 287496</text>
    <text x="228" y="335">i/2: also 287496</text>
  </g>
  <path d="M 212 316 C 120 280 110 120 212 84" fill="none" stroke="#1d1d1d" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="118" y="150" fill="#1d1d1d" text-anchor="end">tau to -1/tau</text>
  <text x="220" y="20" fill="#1d1d1d" text-anchor="middle">shaded region: one tau for every lattice shape</text>
</svg>
