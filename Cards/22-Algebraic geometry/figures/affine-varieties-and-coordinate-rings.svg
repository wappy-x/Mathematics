<text x="344" y="240" font-size="11" font-family="sans-serif" text-anchor="middle" fill="#555555">6</text>
<line x1="196.4" y1="294" x2="203.6" y2="294" stroke="#888888" stroke-width="1" />
<text x="191.6" y="297.6" font-size="11" font-family="sans-serif" text-anchor="end" fill="#555555">−3</text>
