<svg viewBox="0 0 400 356" xmlns="http://www.w3.org/2000/svg" width="400" height="356">
<title>Side view of the torch cone x^2 + y^2 = z^2, to scale, real points only, x dropped: the cone shows as the wedge between the edges z = y and z = -y. Four walls z = 3 + c y seen edge-on, with the conic each cuts from the cone: circle c = 0 from (-3, 3) to (3, 3); ellipse c = 1/2 from (-2, 2) to (6, 6); parabola c = 1 from (-3/2, 3/2) upward; hyperbola c = 2 up from (-1, 1) and, on the unlit lower funnel, down from (-3, -3)</title>
