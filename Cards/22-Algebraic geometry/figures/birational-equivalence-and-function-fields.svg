<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 380" width="340" height="380" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>Projection from (-1, 0): each point of the unit circle matched with a height t on the vertical line x = 0</title>
  <rect x="0" y="0" width="340" height="380" fill="#ffffff"/>
  <line x1="20" y1="240" x2="300" y2="240" stroke="#9a9a9a" stroke-width="1"/>
  <line x1="160" y1="15" x2="160" y2="370" stroke="#1f4e79" stroke-width="2"/>
  <text x="166" y="368" fill="#1f4e79">the line x = 0, height t</text>
  <circle cx="160" cy="240" r="100" fill="none" stroke="#1d1d1d" stroke-width="2"/>
  <text x="262" y="232" fill="#1d1d1d">C</text>
  <line x1="60" y1="240" x2="220" y2="160" stroke="#555555" stroke-width="1.2" stroke-dasharray="5 3"/>
  <line x1="60" y1="240" x2="160" y2="40" stroke="#555555" stroke-width="1.2" stroke-dasharray="5 3"/>
  <line x1="60" y1="240" x2="240" y2="300" stroke="#555555" stroke-width="1.2" stroke-dasharray="5 3"/>
  <circle cx="60" cy="240" r="4.5" fill="#1d1d1d"/>
  <text x="18" y="258" fill="#1d1d1d">(-1, 0)</text>
  <circle cx="220" cy="160" r="4.5" fill="#c0392b"/>
  <text x="228" y="156" fill="#c0392b">(3/5, 4/5)</text>
  <circle cx="160" cy="190" r="4" fill="#1f4e79"/>
  <text x="166" y="204" fill="#1f4e79">t = 1/2</text>
  <circle cx="100" cy="160" r="4.5" fill="#c0392b"/>
  <text x="34" y="152" fill="#c0392b">(-3/5, 4/5)</text>
  <circle cx="160" cy="40" r="4" fill="#1f4e79"/>
  <text x="168" y="44" fill="#1f4e79">t = 2</text>
  <circle cx="240" cy="300" r="4.5" fill="#c0392b"/>
  <text x="246" y="316" fill="#c0392b">(4/5, -3/5)</text>
  <circle cx="160" cy="273.33" r="4" fill="#1f4e79"/>
  <text x="112" y="290" fill="#1f4e79">t = -1/3</text>
</svg>
