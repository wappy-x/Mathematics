<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" font-family="Helvetica, Arial, sans-serif">
<title>The sheaf of Z/6 on Spec Z, schematic: stalk Z/2 at (2), Z/3 at (3), 0 at every other prime and at the generic point (0)</title>
<rect x="0" y="0" width="640" height="270" fill="#ffffff"/>
<text x="320" y="28" text-anchor="middle" font-size="16" fill="#1d1d1d">The sheaf of Z/6 on Spec Z (schematic, not to scale)</text>
<text x="20" y="62" font-size="13" fill="#1d1d1d">stalk:</text>
<line x1="30" y1="110" x2="560" y2="110" stroke="#888888" stroke-width="1" stroke-dasharray="4 4"/>
<text x="70" y="82" text-anchor="middle" font-size="15" fill="#c0392b">Z/2</text>
<circle cx="70" cy="110" r="5" fill="#1d1d1d"/>
<circle cx="70" cy="110" r="11" fill="none" stroke="#c0392b" stroke-width="2"/>
<text x="70" y="142" text-anchor="middle" font-size="14" fill="#1d1d1d">(2)</text>
<text x="160" y="82" text-anchor="middle" font-size="15" fill="#c0392b">Z/3</text>
<circle cx="160" cy="110" r="5" fill="#1d1d1d"/>
<circle cx="160" cy="110" r="11" fill="none" stroke="#c0392b" stroke-width="2"/>
<text x="160" y="142" text-anchor="middle" font-size="14" fill="#1d1d1d">(3)</text>
<text x="250" y="82" text-anchor="middle" font-size="15" fill="#1d1d1d">0</text>
<circle cx="250" cy="110" r="5" fill="#1d1d1d"/>
<text x="250" y="142" text-anchor="middle" font-size="14" fill="#1d1d1d">(5)</text>
<text x="340" y="82" text-anchor="middle" font-size="15" fill="#1d1d1d">0</text>
<circle cx="340" cy="110" r="5" fill="#1d1d1d"/>
<text x="340" y="142" text-anchor="middle" font-size="14" fill="#1d1d1d">(7)</text>
<text x="430" y="82" text-anchor="middle" font-size="15" fill="#1d1d1d">0</text>
<circle cx="430" cy="110" r="5" fill="#1d1d1d"/>
<text x="430" y="142" text-anchor="middle" font-size="14" fill="#1d1d1d">(11)</text>
<text x="520" y="82" text-anchor="middle" font-size="15" fill="#1d1d1d">0</text>
<circle cx="520" cy="110" r="5" fill="#1d1d1d"/>
<text x="520" y="142" text-anchor="middle" font-size="14" fill="#1d1d1d">(13)</text>
<text x="575" y="115" font-size="18" fill="#1d1d1d">...</text>
<rect x="30" y="165" width="580" height="20" rx="10" fill="#e8e8e8" stroke="#1d1d1d" stroke-width="1.5"/>
<text x="40" y="180" font-size="13" fill="#1d1d1d">(0), the generic point: stalk 0</text>
<text x="320" y="215" text-anchor="middle" font-size="13" fill="#c0392b">ringed: the support, the primes dividing 6, where the stalk is not 0</text>
<text x="320" y="245" text-anchor="middle" font-size="13" fill="#1d1d1d">sections: Z/3 over D(2), Z/2 over D(3), 0 over D(6), Z/6 over all of Spec Z</text>
</svg>
