<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" width="440" height="320" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title>The circle x^2 + y^2 = 1, a 1 m link swinging about the origin, and the region x &gt;= 2 to the right of the wall x = 2. They never meet: the nearest circle point, (1, 0), is 1 m short of the wall. Real points only, drawn to scale.</title>
<rect x="0" y="0" width="440" height="320" fill="#ffffff"/>
<rect x="300" y="20.0" width="120.0" height="240.0" fill="#dbe8f5"/>
<line x1="20.0" y1="260.0" x2="20.0" y2="20.0" stroke="#e4e4e4" stroke-width="1"/>
