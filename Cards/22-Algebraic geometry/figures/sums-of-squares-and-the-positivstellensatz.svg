<line x1="20.0" y1="20.0" x2="420.0" y2="20.0" stroke="#e4e4e4" stroke-width="1"/>
<line x1="20.0" y1="140" x2="420.0" y2="140" stroke="#888888" stroke-width="1"/>
<line x1="140" y1="260.0" x2="140" y2="20.0" stroke="#888888" stroke-width="1"/>
<circle cx="140" cy="140" r="80" fill="none" stroke="#c0392b" stroke-width="2.5"/>
<line x1="300" y1="260.0" x2="300" y2="20.0" stroke="#1f5f99" stroke-width="2.5"/>
<circle cx="220" cy="140" r="3.5" fill="#1d1d1d"/>
<text x="186" y="158" fill="#1d1d1d">(1, 0)</text>
<line x1="220" y1="120.0" x2="300" y2="120.0" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="220" y1="115.0" x2="220" y2="125.0" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="300" y1="115.0" x2="300" y2="125.0" stroke="#1d1d1d" stroke-width="1.5"/>
<text x="236.0" y="114.0" fill="#1d1d1d">gap 1 m</text>
<text x="308" y="38.0" fill="#1f5f99">x ≥ 2</text>
<text x="146" y="134" fill="#1d1d1d">0</text>
<text x="28.0" y="44.0" fill="#c0392b">x² + y² = 1</text>
<text x="20" y="285" fill="#c0392b">red: the circle, where a 1 m link can put its tip</text>
<text x="20" y="302" fill="#1f5f99">blue: the wall x = 2 m and the side it asks for</text>
</svg>
