<line x1="140.0" y1="260.0" x2="140.0" y2="20.0" stroke="#e4e4e4" stroke-width="1"/>
<line x1="180.0" y1="260.0" x2="180.0" y2="20.0" stroke="#e4e4e4" stroke-width="1"/>
<line x1="220.0" y1="260.0" x2="220.0" y2="20.0" stroke="#e4e4e4" stroke-width="1"/>
<line x1="260.0" y1="260.0" x2="260.0" y2="20.0" stroke="#e4e4e4" stroke-width="1"/>
<line x1="300.0" y1="260.0" x2="300.0" y2="20.0" stroke="#e4e4e4" stroke-width="1"/>
<line x1="340.0" y1="260.0" x2="340.0" y2="20.0" stroke="#e4e4e4" stroke-width="1"/>
<line x1="380.0" y1="260.0" x2="380.0" y2="20.0" stroke="#e4e4e4" stroke-width="1"/>
<line x1="420.0" y1="260.0" x2="420.0" y2="20.0" stroke="#e4e4e4" stroke-width="1"/>
<line x1="20.0" y1="260.0" x2="420.0" y2="260.0" stroke="#e4e4e4" stroke-width="1"/>
<line x1="20.0" y1="220.0" x2="420.0" y2="220.0" stroke="#e4e4e4" stroke-width="1"/>
<line x1="20.0" y1="180.0" x2="420.0" y2="180.0" stroke="#e4e4e4" stroke-width="1"/>
<line x1="20.0" y1="140.0" x2="420.0" y2="140.0" stroke="#e4e4e4" stroke-width="1"/>
