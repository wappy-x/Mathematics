<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" width="420" height="380" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title>The eight points of the conic xz = y^2 over F_7: seven in the chart x = 1, where v = u^2 mod 7, and one at infinity</title>
<rect x="0" y="0" width="420" height="380" fill="#ffffff"/>
<line x1="60" y1="60" x2="60" y2="300" stroke="#bbbbbb" stroke-width="1"/>
<line x1="60" y1="300" x2="300" y2="300" stroke="#bbbbbb" stroke-width="1"/>
<text x="60" y="320" text-anchor="middle" fill="#1d1d1d">0</text>
<text x="44" y="304" text-anchor="middle" fill="#1d1d1d">0</text>
<line x1="100" y1="60" x2="100" y2="300" stroke="#bbbbbb" stroke-width="1"/>
<line x1="60" y1="260" x2="300" y2="260" stroke="#bbbbbb" stroke-width="1"/>
<text x="100" y="320" text-anchor="middle" fill="#1d1d1d">1</text>
<text x="44" y="264" text-anchor="middle" fill="#1d1d1d">1</text>
<line x1="140" y1="60" x2="140" y2="300" stroke="#bbbbbb" stroke-width="1"/>
<line x1="60" y1="220" x2="300" y2="220" stroke="#bbbbbb" stroke-width="1"/>
<text x="140" y="320" text-anchor="middle" fill="#1d1d1d">2</text>
<text x="44" y="224" text-anchor="middle" fill="#1d1d1d">2</text>
<line x1="180" y1="60" x2="180" y2="300" stroke="#bbbbbb" stroke-width="1"/>
<line x1="60" y1="180" x2="300" y2="180" stroke="#bbbbbb" stroke-width="1"/>
<text x="180" y="320" text-anchor="middle" fill="#1d1d1d">3</text>
<text x="44" y="184" text-anchor="middle" fill="#1d1d1d">3</text>
<line x1="220" y1="60" x2="220" y2="300" stroke="#bbbbbb" stroke-width="1"/>
<line x1="60" y1="140" x2="300" y2="140" stroke="#bbbbbb" stroke-width="1"/>
<text x="220" y="320" text-anchor="middle" fill="#1d1d1d">4</text>
<text x="44" y="144" text-anchor="middle" fill="#1d1d1d">4</text>
<line x1="260" y1="60" x2="260" y2="300" stroke="#bbbbbb" stroke-width="1"/>
<line x1="60" y1="100" x2="300" y2="100" stroke="#bbbbbb" stroke-width="1"/>
<text x="260" y="320" text-anchor="middle" fill="#1d1d1d">5</text>
<text x="44" y="104" text-anchor="middle" fill="#1d1d1d">5</text>
<line x1="300" y1="60" x2="300" y2="300" stroke="#bbbbbb" stroke-width="1"/>
<line x1="60" y1="60" x2="300" y2="60" stroke="#bbbbbb" stroke-width="1"/>
<text x="300" y="320" text-anchor="middle" fill="#1d1d1d">6</text>
<text x="44" y="64" text-anchor="middle" fill="#1d1d1d">6</text>
<text x="180" y="345" text-anchor="middle" fill="#1d1d1d">u = y/x</text>
<text x="22" y="180" text-anchor="middle" fill="#1d1d1d" transform="rotate(-90 22 180)">v = z/x</text>
<text x="180" y="30" text-anchor="middle" fill="#1d1d1d" font-size="14">Chart x = 1 of xz = y^2 over F_7: v = u^2 mod 7</text>
<circle cx="60" cy="300" r="6" fill="#c0392b" stroke="#1d1d1d" stroke-width="1"/>
<text x="69" y="292" fill="#1d1d1d" font-size="11">(1 : 0)</text>
<circle cx="100" cy="260" r="6" fill="#c0392b" stroke="#1d1d1d" stroke-width="1"/>
<text x="109" y="252" fill="#1d1d1d" font-size="11">(1 : 1)</text>
<circle cx="140" cy="140" r="6" fill="#c0392b" stroke="#1d1d1d" stroke-width="1"/>
<text x="149" y="132" fill="#1d1d1d" font-size="11">(1 : 2)</text>
<circle cx="180" cy="220" r="6" fill="#c0392b" stroke="#1d1d1d" stroke-width="1"/>
<text x="189" y="212" fill="#1d1d1d" font-size="11">(1 : 3)</text>
<circle cx="220" cy="220" r="6" fill="#c0392b" stroke="#1d1d1d" stroke-width="1"/>
<text x="229" y="212" fill="#1d1d1d" font-size="11">(1 : 4)</text>
<circle cx="260" cy="140" r="6" fill="#c0392b" stroke="#1d1d1d" stroke-width="1"/>
<text x="269" y="132" fill="#1d1d1d" font-size="11">(1 : 5)</text>
<circle cx="300" cy="260" r="6" fill="#c0392b" stroke="#1d1d1d" stroke-width="1"/>
<text x="309" y="252" fill="#1d1d1d" font-size="11">(1 : 6)</text>
<rect x="318" y="150" width="94" height="80" fill="#ffffff" stroke="#1d1d1d" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="365" cy="172" r="6" fill="#1f5fa8" stroke="#1d1d1d" stroke-width="1"/>
<text x="365" y="198" text-anchor="middle" fill="#1d1d1d" font-size="11">(0 : 0 : 1)</text>
<text x="365" y="214" text-anchor="middle" fill="#1d1d1d" font-size="11">from (0 : 1)</text>
</svg>
