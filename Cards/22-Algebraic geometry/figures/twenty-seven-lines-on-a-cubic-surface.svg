<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" width="420" height="340" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Six points in the plane, no three on a line and not all six on a conic, with the line through p1 and p2 and the conic through p1 to p5</title>
  <rect x="0" y="0" width="420" height="340" fill="#ffffff"/>
  <line x1="40" y1="170" x2="390" y2="170" stroke="#bbbbbb" stroke-width="1"/>
  <line x1="210" y1="20" x2="210" y2="325" stroke="#bbbbbb" stroke-width="1"/>
  <circle cx="210" cy="170" r="120" fill="none" stroke="#2a6f97" stroke-width="2"/>
  <line x1="270" y1="50" x2="354" y2="218" stroke="#c0392b" stroke-width="2"/>
  <g fill="#1d1d1d">
    <circle cx="330" cy="170" r="5"/>
    <circle cx="282" cy="74" r="5"/>
    <circle cx="114" cy="98" r="5"/>
    <circle cx="114" cy="242" r="5"/>
    <circle cx="210" cy="290" r="5"/>
    <circle cx="234" cy="146" r="5"/>
    <text x="338" y="164">p1 (5, 0)</text>
    <text x="292" y="70">p2 (3, 4)</text>
    <text x="40" y="92">p3 (−4, 3)</text>
    <text x="36" y="262">p4 (−4, −3)</text>
    <text x="220" y="310">p5 (0, −5)</text>
    <text x="242" y="142">p6 (1, 1)</text>
  </g>
  <text x="40" y="22" fill="#c0392b">line through p1, p2: becomes L12</text>
  <text x="16" y="330" fill="#2a6f97">circle x² + y² = 25 through p1 to p5: becomes C6</text>
</svg>
