<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" font-family="Helvetica, Arial, sans-serif" font-size="12">
<title>Side view of the cone x^2 + y^2 = z^2 in the plane y = 0: two lines through the apex, cut by the screen z = 1; every point of a line lands on the screen where that line crosses it</title>
<rect x="0" y="0" width="420" height="300" fill="#ffffff"/>
<g stroke="#bbbbbb" stroke-width="0.8">
<line x1="20" y1="190" x2="400" y2="190"/><line x1="210" y1="20" x2="210" y2="290"/>
</g>
<line x1="30" y1="130" x2="390" y2="130" stroke="#2a6f97" stroke-width="2"/>
<g stroke="#1d1d1d" stroke-width="2.2">
<line x1="120" y1="280" x2="360" y2="40"/>
<line x1="300" y1="280" x2="60" y2="40"/>
</g>
<g fill="#c0392b"><circle cx="330" cy="70" r="4"/><circle cx="120" cy="100" r="4"/><circle cx="150" cy="250" r="4"/></g>
<g fill="#2a6f97"><circle cx="270" cy="130" r="4.5"/><circle cx="150" cy="130" r="4.5"/></g>
<circle cx="210" cy="190" r="6" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
<g fill="#1d1d1d">
<text x="344" y="74">(2, 0, 2)</text>
<text x="20" y="96">(−1.5, 0, 1.5)</text>
<text x="160" y="262">(−1, 0, −1)</text>
<text x="278" y="148">(1, 0)</text>
<text x="104" y="148">(−1, 0)</text>
<text x="242" y="210">apex: no image</text>
<text x="300" y="124">screen z = 1</text>
<text x="390" y="184">x</text><text x="216" y="30">z</text>
<text x="352" y="36">z = x</text><text x="30" y="36">z = −x</text>
</g>
</svg>
