<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320">
  <title>Schematic: a sphere covered by a north cap U (orange) and a south cap V (teal) that overlap in a band; the band's upper rim is the loop that the connecting map produces</title>
  <rect x="0" y="0" width="420" height="320" fill="#ffffff"/>
  <path d="M 93.81 190 A 120 120 0 1 1 326.19 190 A 116.19 18 0 0 1 93.81 190 Z" fill="#e76f51" fill-opacity="0.35" stroke="none"/>
  <path d="M 93.81 130 A 120 120 0 1 0 326.19 130 A 116.19 18 0 0 0 93.81 130 Z" fill="#2a9d8f" fill-opacity="0.35" stroke="none"/>
  <circle cx="210" cy="160" r="120" fill="none" stroke="#1d1d1d" stroke-width="2"/>
  <g fill="none" stroke-width="2">
    <path d="M 93.81 130 A 116.19 18 0 0 1 326.19 130" stroke="#b5442a" stroke-dasharray="5 4"/>
    <path d="M 93.81 130 A 116.19 18 0 0 0 326.19 130" stroke="#b5442a" stroke-width="3.5"/>
    <path d="M 93.81 190 A 116.19 18 0 0 1 326.19 190" stroke="#1d1d1d" stroke-dasharray="5 4"/>
    <path d="M 93.81 190 A 116.19 18 0 0 0 326.19 190" stroke="#1d1d1d"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1d1d1d">
    <text x="210" y="24" text-anchor="middle">U: north cap (down to the lower rim)</text>
    <text x="210" y="308" text-anchor="middle">V: south cap (up to the upper rim)</text>
    <text x="210" y="168" text-anchor="middle">U ∩ V: the band</text>
    <text x="330" y="112" fill="#b5442a">upper rim</text>
    <text x="330" y="128" fill="#b5442a">01 + 12 − 02</text>
    <text x="330" y="212">lower rim</text>
  </g>
</svg>
