<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 215" width="440" height="215" font-family="Helvetica, Arial, sans-serif">
  <title>Barcode of the six price windows: five piece bars end at r = 1.2247, one piece bar never ends, one loop bar runs from 1.2247 to 2.1213</title>
  <rect x="0" y="0" width="440" height="215" fill="#ffffff"/>
  <g stroke="#555555" stroke-width="1" stroke-dasharray="4 3">
    <line x1="186.97" y1="18" x2="186.97" y2="160"/>
    <line x1="294.56" y1="18" x2="294.56" y2="160"/>
  </g>
  <g font-size="11" fill="#1d1d1d" text-anchor="middle">
    <text x="186.97" y="13">1.2247</text>
    <text x="294.56" y="13">2.1213</text>
  </g>
  <g stroke="#264653" stroke-width="6" stroke-linecap="butt">
    <line x1="40" y1="26" x2="186.97" y2="26"/>
    <line x1="40" y1="38" x2="186.97" y2="38"/>
    <line x1="40" y1="50" x2="186.97" y2="50"/>
    <line x1="40" y1="62" x2="186.97" y2="62"/>
    <line x1="40" y1="74" x2="186.97" y2="74"/>
    <line x1="40" y1="86" x2="392" y2="86"/>
  </g>
  <polygon points="392,80 404,86 392,92" fill="#264653"/>
  <line x1="186.97" y1="126" x2="294.56" y2="126" stroke="#e76f51" stroke-width="6"/>
  <g font-size="13" fill="#1d1d1d">
    <text x="6" y="60">H0</text>
    <text x="6" y="130">H1</text>
  </g>
  <line x1="40" y1="160" x2="400" y2="160" stroke="#1d1d1d" stroke-width="1.2"/>
  <g stroke="#1d1d1d" stroke-width="1.2">
    <line x1="40" y1="160" x2="40" y2="165"/>
    <line x1="160" y1="160" x2="160" y2="165"/>
    <line x1="280" y1="160" x2="280" y2="165"/>
    <line x1="400" y1="160" x2="400" y2="165"/>
  </g>
  <g font-size="12" fill="#1d1d1d" text-anchor="middle">
    <text x="40" y="179">0</text>
    <text x="160" y="179">1</text>
    <text x="280" y="179">2</text>
    <text x="400" y="179">3</text>
    <text x="220" y="203">scale r (percent of return)</text>
  </g>
</svg>
