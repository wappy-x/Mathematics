<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>Schematic: the torus recipe as one square with edges a and b, and two arm plans lifted to the square grid</title>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d1d1d"/>
    </marker>
    <marker id="hr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="hb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5f8b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="520" height="360" fill="#ffffff"/>
  <!-- left panel: the recipe, one vertex, two edges, one square -->
  <rect x="40" y="40" width="200" height="200" fill="#f1ede4" stroke="#1d1d1d" stroke-width="2"/>
  <line x1="40" y1="240" x2="150" y2="240" stroke="#1d1d1d" stroke-width="2" marker-end="url(#h)"/>
  <line x1="40" y1="40" x2="150" y2="40" stroke="#1d1d1d" stroke-width="2" marker-end="url(#h)"/>
  <line x1="40" y1="240" x2="40" y2="130" stroke="#1d1d1d" stroke-width="2" marker-end="url(#h)"/>
  <line x1="240" y1="240" x2="240" y2="130" stroke="#1d1d1d" stroke-width="2" marker-end="url(#h)"/>
  <text x="140" y="262" text-anchor="middle">a</text>
  <text x="140" y="30" text-anchor="middle">a</text>
  <text x="24" y="145" text-anchor="middle">b</text>
  <text x="256" y="145" text-anchor="middle">b</text>
  <g fill="#1d1d1d">
    <circle cx="40" cy="40" r="4"/><circle cx="240" cy="40" r="4"/>
    <circle cx="40" cy="240" r="4"/><circle cx="240" cy="240" r="4"/>
  </g>
  <text x="140" y="135" text-anchor="middle">one square</text>
  <text x="140" y="153" text-anchor="middle">rim: a b a⁻¹ b⁻¹</text>
  <text x="140" y="300" text-anchor="middle">all four corners are one vertex v</text>
  <text x="140" y="320" text-anchor="middle">(schematic)</text>
  <!-- right panel: the grid cover, unit 40, origin (330, 200) -->
  <g stroke="#b9b2a4" stroke-width="1">
    <line x1="290" y1="120" x2="290" y2="320"/><line x1="330" y1="120" x2="330" y2="320"/>
    <line x1="370" y1="120" x2="370" y2="320"/><line x1="410" y1="120" x2="410" y2="320"/>
    <line x1="450" y1="120" x2="450" y2="320"/><line x1="490" y1="120" x2="490" y2="320"/>
    <line x1="290" y1="120" x2="490" y2="120"/><line x1="290" y1="160" x2="490" y2="160"/>
    <line x1="290" y1="200" x2="490" y2="200"/><line x1="290" y1="240" x2="490" y2="240"/>
    <line x1="290" y1="280" x2="490" y2="280"/><line x1="290" y1="320" x2="490" y2="320"/>
  </g>
  <polyline points="330,200 370,200 370,160 330,160 330,198" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#hr)"/>
  <polyline points="330,204 450,204 450,278" fill="none" stroke="#1f5f8b" stroke-width="3" marker-end="url(#hb)"/>
  <circle cx="330" cy="200" r="5" fill="#1d1d1d"/>
  <circle cx="450" cy="280" r="5" fill="#1f5f8b"/>
  <text x="318" y="194" text-anchor="end">(0, 0)</text>
  <text x="460" y="298">(3, −2)</text>
  <text x="390" y="100" text-anchor="middle" fill="#c0392b">a b a⁻¹ b⁻¹ closes: shrinks</text>
  <text x="390" y="345" text-anchor="middle" fill="#1f5f8b">a a a b⁻¹ b⁻¹ ends at (3, −2)</text>
</svg>
