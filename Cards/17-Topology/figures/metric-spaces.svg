<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420">
<title>Home to cafe on a city grid: a 7-block walk along the streets against the 5-block straight line</title>
<rect x="0" y="0" width="420" height="420" fill="#ffffff"/>
<line x1="60" y1="60" x2="60" y2="360" stroke="#c8c8c8" stroke-width="2"/>
<line x1="60" y1="60" x2="360" y2="60" stroke="#c8c8c8" stroke-width="2"/>
<line x1="120" y1="60" x2="120" y2="360" stroke="#c8c8c8" stroke-width="2"/>
<line x1="60" y1="120" x2="360" y2="120" stroke="#c8c8c8" stroke-width="2"/>
<line x1="180" y1="60" x2="180" y2="360" stroke="#c8c8c8" stroke-width="2"/>
<line x1="60" y1="180" x2="360" y2="180" stroke="#c8c8c8" stroke-width="2"/>
<line x1="240" y1="60" x2="240" y2="360" stroke="#c8c8c8" stroke-width="2"/>
<line x1="60" y1="240" x2="360" y2="240" stroke="#c8c8c8" stroke-width="2"/>
<line x1="300" y1="60" x2="300" y2="360" stroke="#c8c8c8" stroke-width="2"/>
<line x1="60" y1="300" x2="360" y2="300" stroke="#c8c8c8" stroke-width="2"/>
<line x1="360" y1="60" x2="360" y2="360" stroke="#c8c8c8" stroke-width="2"/>
<line x1="60" y1="360" x2="360" y2="360" stroke="#c8c8c8" stroke-width="2"/>
<polyline points="60,360 240,360 240,120" fill="none" stroke="#1d1d1d" stroke-width="5"/>
<line x1="60" y1="360" x2="240" y2="120" stroke="#1d1d1d" stroke-width="3" stroke-dasharray="10 7"/>
<circle cx="60" cy="360" r="8" fill="#1d1d1d"/>
<circle cx="240" cy="120" r="8" fill="#1d1d1d"/>
<text x="60" y="392" font-size="16" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1d1d1d">home</text>
<text x="240" y="104" font-size="16" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1d1d1d">cafe</text>
<text x="150" y="388" font-size="15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1d1d1d">3 east</text>
<text x="252" y="245" font-size="15" font-family="Helvetica, Arial, sans-serif" fill="#1d1d1d">4 north</text>
<text x="96" y="222" font-size="15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1d1d1d" transform="rotate(-53.13 140 240)">straight line = 5 blocks</text>
<text x="210" y="30" font-size="14" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#1d1d1d">walk 3 + 4 = 7 blocks; straight line 5; 1 block = 100 m</text>
</svg>
