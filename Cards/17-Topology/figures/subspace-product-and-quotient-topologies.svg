<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" width="680" height="370" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>A 100 cm tape and the hoop it makes when its ends are glued, drawn to scale at 6 px per cm, with one open set marked on both</title>
  <rect x="0" y="0" width="680" height="370" fill="#ffffff"/>
  <!-- the flat tape: 0 to 100 cm, x = 40 + 6t -->
  <line x1="40" y1="60" x2="640" y2="60" stroke="#1d1d1d" stroke-width="2"/>
  <g stroke="#1d1d1d" stroke-width="1.5">
    <line x1="40" y1="52" x2="40" y2="68"/>
    <line x1="190" y1="54" x2="190" y2="66"/>
    <line x1="340" y1="54" x2="340" y2="66"/>
    <line x1="490" y1="54" x2="490" y2="66"/>
    <line x1="640" y1="52" x2="640" y2="68"/>
  </g>
  <g fill="#1d1d1d" text-anchor="middle">
    <text x="40" y="88">0</text>
    <text x="190" y="88">25</text>
    <text x="340" y="88">50</text>
    <text x="490" y="88">75</text>
    <text x="640" y="88">100</text>
    <text x="340" y="30">the flat tape, [0, 100], marks in cm</text>
  </g>
  <!-- the open set's pre-image: [0, 2.0013) and (97.9987, 100] -->
  <line x1="40" y1="60" x2="52.008" y2="60" stroke="#c0392b" stroke-width="7"/>
  <line x1="627.992" y1="60" x2="640" y2="60" stroke="#c0392b" stroke-width="7"/>
  <!-- the hoop: radius 15.9155 cm = 95.493 px, centre (340, 245) -->
  <circle cx="340" cy="245" r="95.493" fill="none" stroke="#1d1d1d" stroke-width="2"/>
  <!-- the disc of radius 2 cm = 12 px round the join point (15.9155, 0) -->
  <circle cx="435.493" cy="245" r="12" fill="none" stroke="#1d1d1d" stroke-width="1.2" stroke-dasharray="3 2"/>
  <!-- the open arc it cuts out: ends (15.7898, 1.9960) and (15.7898, -1.9960) cm -->
  <path d="M 434.739 256.976 A 95.493 95.493 0 0 0 434.739 233.024" fill="none" stroke="#c0392b" stroke-width="7"/>
  <circle cx="435.493" cy="245" r="3" fill="#1d1d1d"/>
  <g fill="#1d1d1d">
    <text x="455" y="249">join: 0 = 100</text>
    <text x="340" y="138" text-anchor="middle">25</text>
    <text x="230" y="249" text-anchor="end">50</text>
    <text x="340" y="362" text-anchor="middle">75</text>
    <text x="340" y="245" text-anchor="middle">the hoop</text>
    <text x="340" y="262" text-anchor="middle">radius 15.9155 cm</text>
  </g>
  <!-- the glue: both ends of the tape go to the join -->
  <path d="M 40 70 C 40 380, 420 380, 432 254" fill="none" stroke="#1d1d1d" stroke-width="1" stroke-dasharray="5 4"/>
  <path d="M 640 70 C 640 160, 480 170, 440 236" fill="none" stroke="#1d1d1d" stroke-width="1" stroke-dasharray="5 4"/>
</svg>
