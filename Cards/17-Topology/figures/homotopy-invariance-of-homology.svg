<rect x="330" y="250" width="40" height="40" fill="#d9d9d9" stroke="#1d1d1d" stroke-width="1.5"/>
<rect x="370" y="250" width="40" height="40" fill="#d9d9d9" stroke="#1d1d1d" stroke-width="1.5"/>
