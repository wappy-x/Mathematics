<text x="140" y="40" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1d1d1d" text-anchor="middle">Mug, seen from the front</text>
<text x="390" y="40" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1d1d1d" text-anchor="middle">Doughnut, seen from above</text>
<text x="12" y="120" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1d" text-anchor="start">well, open at the top (dashed)</text>
<text x="250" y="92" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1d" text-anchor="middle">gap under the handle</text>
<line x1="240" y1="98" x2="180.0" y2="230.0" stroke="#1d1d1d" stroke-width="1"/>
<line x1="100" y1="126" x2="100.0" y2="170" stroke="#1d1d1d" stroke-width="1"/>
<text x="140" y="320" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1d" text-anchor="middle">30 cubes: 25 in the cup, 5 in the handle</text>
<text x="390" y="320" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1d" text-anchor="middle">8 cubes around a gap</text>
<text x="260" y="350" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1d1d1d" text-anchor="middle">Red: a loop each solid can be squeezed onto. Hole counts 1, 1, 0, 0 for both.</text>
<text x="260" y="370" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1d1d1d" text-anchor="middle">Squares are unit cubes, to scale.</text>
</svg>
