<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" font-family="Helvetica, Arial, sans-serif">
  <title>Schematic of the Klein bottle as a square: bottom and top edges both a, pointing right; left edge b pointing up, right edge b pointing down; diagonal c from bottom left to top right; triangles U and L; all four corners are one point v</title>
  <rect x="0" y="0" width="420" height="420" fill="#ffffff"/>
  <polygon points="60,360 60,60 360,60" fill="#e8f1f8" stroke="none"/>
  <polygon points="60,360 360,360 360,60" fill="#fbeee6" stroke="none"/>
  <g stroke="#1d1d1d" stroke-width="3" fill="none">
    <line x1="60" y1="360" x2="360" y2="360"/>
    <line x1="60" y1="60" x2="360" y2="60"/>
    <line x1="60" y1="360" x2="60" y2="60"/>
    <line x1="360" y1="60" x2="360" y2="360"/>
  </g>
  <line x1="60" y1="360" x2="360" y2="60" stroke="#1d1d1d" stroke-width="2" stroke-dasharray="8 5"/>
  <g fill="#1d1d1d">
    <polygon points="222,360 204,352 204,368"/>
    <polygon points="222,60 204,52 204,68"/>
    <polygon points="60,198 52,216 68,216"/>
    <polygon points="360,222 352,204 368,204"/>
    <polygon points="221,199 214,217 203,206"/>
    <circle cx="60" cy="360" r="5"/>
    <circle cx="360" cy="360" r="5"/>
    <circle cx="360" cy="60" r="5"/>
    <circle cx="60" cy="60" r="5"/>
  </g>
  <g fill="#1d1d1d" font-size="22" text-anchor="middle">
    <text x="210" y="392">a</text>
    <text x="210" y="44">a</text>
    <text x="36" y="217">b</text>
    <text x="386" y="217">b</text>
    <text x="236" y="236">c</text>
    <text x="160" y="168" font-size="26" font-weight="bold">U</text>
    <text x="262" y="270" font-size="26" font-weight="bold">L</text>
  </g>
  <g fill="#1d1d1d" font-size="16" text-anchor="middle">
    <text x="44" y="382">v</text>
    <text x="376" y="382">v</text>
    <text x="376" y="48">v</text>
    <text x="44" y="48">v</text>
  </g>
</svg>
