<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" width="440" height="280" font-family="Helvetica, Arial, sans-serif">
  <title>The Cantor set's first four levels drawn to scale, with the points 0, 2/9 and 8/27 and the gap point 1/6 that splits the set between 0 and 2/9</title>
  <rect x="0" y="0" width="440" height="280" fill="#ffffff"/>
  <g fill="#1d1d1d">
    <rect x="30" y="30" width="360" height="10"/>
    <rect x="30" y="70" width="120" height="10"/><rect x="270" y="70" width="120" height="10"/>
    <rect x="30" y="110" width="40" height="10"/><rect x="110" y="110" width="40" height="10"/>
    <rect x="270" y="110" width="40" height="10"/><rect x="350" y="110" width="40" height="10"/>
    <rect x="30" y="150" width="13.33" height="10"/><rect x="56.67" y="150" width="13.33" height="10"/>
    <rect x="110" y="150" width="13.33" height="10"/><rect x="136.67" y="150" width="13.33" height="10"/>
    <rect x="270" y="150" width="13.33" height="10"/><rect x="296.67" y="150" width="13.33" height="10"/>
    <rect x="350" y="150" width="13.33" height="10"/><rect x="376.67" y="150" width="13.33" height="10"/>
  </g>
  <g font-size="11" fill="#1d1d1d">
    <text x="398" y="39">level 0</text><text x="398" y="79">level 1</text>
    <text x="398" y="119">level 2</text><text x="398" y="159">level 3</text>
  </g>
  <line x1="90" y1="22" x2="90" y2="200" stroke="#a63d1f" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="30" y1="190" x2="390" y2="190" stroke="#9a9a9a" stroke-width="1"/>
  <g fill="#1f5f8b">
    <circle cx="30" cy="190" r="4"/><circle cx="110" cy="190" r="4"/><circle cx="136.67" cy="190" r="4"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#1d1d1d">
    <text x="30" y="210">0</text><text x="110" y="210">2/9</text><text x="140" y="210">8/27</text>
    <text x="390" y="210">1</text>
    <text x="30" y="224">x</text><text x="110" y="224">y</text><text x="140" y="224">z</text>
  </g>
  <text x="90" y="16" font-size="11" text-anchor="middle" fill="#a63d1f">g = 1/6, in a deleted gap</text>
  <g font-size="11" fill="#1d1d1d">
    <text x="30" y="248">x = 0.000…, y = 0.020…, z = 0.022… in base 3</text>
    <text x="30" y="266">d(x, y) = 1/9, d(y, z) = 1/27, d(x, z) = 1/9</text>
  </g>
</svg>
