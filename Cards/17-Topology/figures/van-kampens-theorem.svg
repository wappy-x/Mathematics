<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" width="420" height="240">
<title>The figure eight cut into two overlapping pieces (schematic)</title>
<rect x="0" y="0" width="420" height="240" fill="#ffffff"/>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1d"/></marker>
</defs>
<circle cx="120" cy="110" r="90" fill="none" stroke="#1d1d1d" stroke-width="2.5"/>
<circle cx="300" cy="110" r="90" fill="none" stroke="#1d1d1d" stroke-width="2.5"/>
<path d="M 120 20 A 90 90 0 0 0 56.4 46.4" fill="none" stroke="#1d1d1d" stroke-width="2.5" marker-end="url(#arr)"/>
<path d="M 300 20 A 90 90 0 0 0 236.4 46.4" fill="none" stroke="#1d1d1d" stroke-width="2.5" marker-end="url(#arr)"/>
<circle cx="120" cy="110" r="6" fill="#1d1d1d"/>
<circle cx="300" cy="110" r="6" fill="#1d1d1d"/>
<text x="120" y="135" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1d1d">post A</text>
<text x="300" y="135" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1d1d">post B</text>
<text x="88" y="14" font-family="sans-serif" font-size="15" font-style="italic" fill="#1d1d1d">a</text>
<text x="268" y="14" font-family="sans-serif" font-size="15" font-style="italic" fill="#1d1d1d">b</text>
<circle cx="210" cy="110" r="4" fill="#1d1d1d"/>
<text x="210" y="98" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1d1d">x0</text>
<circle cx="30" cy="110" r="6" fill="#ffffff" stroke="#e76f51" stroke-width="2.5"/>
<circle cx="390" cy="110" r="6" fill="#ffffff" stroke="#e76f51" stroke-width="2.5"/>
<text x="12" y="88" font-family="sans-serif" font-size="13" fill="#1d1d1d">p</text>
<text x="400" y="88" font-family="sans-serif" font-size="13" fill="#1d1d1d">q</text>
<text x="210" y="222" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1d1d1d">U = all but q, V = all but p, overlap = all but p and q (a cross at x0)</text>
</svg>
