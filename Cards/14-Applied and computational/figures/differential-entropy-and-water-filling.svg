<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title>Water-filling over three radio slots with noise power 1, 2 and 4, drawn to scale: signal power poured to the level 4 gives slot 1 power 3, slot 2 power 2 and slot 3 none</title>
<rect x="0" y="0" width="360" height="240" fill="#ffffff"/>
<g stroke="#1d1d1d" stroke-width="1">
<rect x="70" y="160" width="80" height="40" fill="#bdbdbd"/>
<rect x="150" y="120" width="80" height="80" fill="#bdbdbd"/>
<rect x="230" y="40" width="80" height="160" fill="#bdbdbd"/>
<rect x="70" y="40" width="80" height="120" fill="#a8dadc"/>
<rect x="150" y="40" width="80" height="80" fill="#a8dadc"/>
</g>
<g stroke="#1d1d1d" stroke-width="1.5" fill="none">
<line x1="60" y1="200" x2="320" y2="200"/>
<line x1="60" y1="40" x2="60" y2="200"/>
</g>
<line x1="60" y1="40" x2="330" y2="40" stroke="#e76f51" stroke-width="2" stroke-dasharray="6 4"/>
<g fill="#1d1d1d">
<text x="18" y="120" text-anchor="middle" transform="rotate(-90 18 120)">power (units)</text>
<text x="44" y="204">0</text>
<text x="44" y="164">1</text>
<text x="44" y="124">2</text>
<text x="44" y="84">3</text>
<text x="44" y="44">4</text>
<text x="62" y="28">water level 4</text>
<text x="80" y="105">power 3</text>
<text x="160" y="85">power 2</text>
<text x="240" y="125">noise 4</text>
<text x="240" y="140">power 0</text>
<text x="88" y="185">noise 1</text>
<text x="166" y="165">noise 2</text>
<text x="88" y="222">slot 1</text>
<text x="168" y="222">slot 2</text>
<text x="248" y="222">slot 3</text>
</g>
</svg>
