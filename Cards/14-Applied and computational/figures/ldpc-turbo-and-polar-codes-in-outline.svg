<line x1="322" y1="64" x2="275" y2="176" stroke="#1d1d1d" stroke-width="1.5"/>
<circle cx="40" cy="50" r="14" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.5"/>
<text x="40" y="55" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1d1d">1</text>
<text x="40" y="24" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1d1d">+4</text>
<circle cx="87" cy="50" r="14" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.5"/>
