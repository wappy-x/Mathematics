<text x="87" y="24" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1d1d">-5</text>
<circle cx="134" cy="50" r="14" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.5"/>
<text x="134" y="55" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1d1d">3</text>
<text x="134" y="24" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1d1d">+1</text>
<circle cx="181" cy="50" r="14" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.5"/>
<text x="181" y="55" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1d1d">4</text>
<text x="181" y="24" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1d1d">+3</text>
<circle cx="228" cy="50" r="14" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.5"/>
