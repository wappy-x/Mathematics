<line x1="40" y1="64" x2="87" y2="176" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="134" y1="64" x2="87" y2="176" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="228" y1="64" x2="87" y2="176" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="322" y1="64" x2="87" y2="176" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="87" y1="64" x2="181" y2="176" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="134" y1="64" x2="181" y2="176" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="275" y1="64" x2="181" y2="176" stroke="#1d1d1d" stroke-width="1.5"/>
