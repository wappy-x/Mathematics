<text x="228" y="24" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1d1d">-1</text>
<circle cx="275" cy="50" r="14" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.5"/>
<text x="275" y="55" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1d1d">6</text>
<text x="275" y="24" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1d1d">-4</text>
<circle cx="322" cy="50" r="14" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.5"/>
<text x="322" y="55" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1d1d">7</text>
