<circle cx="393.6" cy="70.0" r="3.5" fill="#1d1d1d"/>
<text x="452.0" y="154.4" text-anchor="end" fill="#1d1d1d">(0.5, 0.292)</text>
<text x="401.6" y="60.0" fill="#1d1d1d">(0.292, 0.5)</text>
<text x="393.6" y="246.0" text-anchor="middle" fill="#1d1d1d">0.292</text>
<text x="460.0" y="246.0" text-anchor="middle" fill="#1d1d1d">0.5</text>
<text x="296.0" y="140.4" text-anchor="end" fill="#1d1d1d">0.292</text>
