<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240">
<title>Six bike stations joined by seven two-way links, each link a 1-ohm resistor; the bike starts at Market and the target is Docks (schematic)</title>
<rect x="0" y="0" width="360" height="240" fill="#ffffff"/>
<g stroke="#1d1d1d" stroke-width="2" fill="none">
<line x1="40" y1="120" x2="150" y2="70"/>
<line x1="150" y1="70" x2="320" y2="120"/>
<line x1="40" y1="120" x2="120" y2="190"/>
<line x1="120" y1="190" x2="240" y2="190"/>
<line x1="240" y1="190" x2="320" y2="120"/>
<line x1="150" y1="70" x2="250" y2="40"/>
<line x1="250" y1="40" x2="320" y2="120"/>
</g>
<g stroke="#1d1d1d" stroke-width="2" fill="#ffffff">
<circle cx="40" cy="120" r="8"/>
<circle cx="150" cy="70" r="8"/>
<circle cx="250" cy="40" r="8"/>
<circle cx="320" cy="120" r="8"/>
<circle cx="120" cy="190" r="8"/>
<circle cx="240" cy="190" r="8"/>
</g>
<g font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="middle">
<text x="30" y="145">Market</text>
<text x="30" y="161">(start)</text>
<text x="134" y="56">Park</text>
<text x="250" y="22">University</text>
<text x="320" y="145">Docks</text>
<text x="320" y="161">(target)</text>
<text x="120" y="214">Library</text>
<text x="240" y="214">Hospital</text>
<text x="180" y="234">every link: one 1-ohm resistor (schematic)</text>
</g>
</svg>
