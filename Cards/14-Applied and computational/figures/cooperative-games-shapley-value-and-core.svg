<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" style="max-width:420px;width:100%;height:auto">
<title>The core of the oven game drawn to scale: Ash's payment across, Birch's payment up, Cedar paying the rest of 3,000 pounds; a shaded four-cornered region with the Shapley point inside and the split 500, 2,000, 500 outside it</title>
<rect x="0" y="0" width="360" height="250" fill="#ffffff"/>
<line x1="60" y1="210" x2="270" y2="210" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="60" y1="210" x2="60" y2="20" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="140" y1="210" x2="140" y2="216" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="220" y1="210" x2="220" y2="216" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="54" y1="130" x2="60" y2="130" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="54" y1="50" x2="60" y2="50" stroke="#1d1d1d" stroke-width="1.5"/>
<text x="56" y="228" font-size="13" fill="#1d1d1d" font-family="sans-serif">0</text>
<text x="122" y="228" font-size="13" fill="#1d1d1d" font-family="sans-serif">1,000</text>
<text x="202" y="228" font-size="13" fill="#1d1d1d" font-family="sans-serif">2,000</text>
<text x="12" y="134" font-size="13" fill="#1d1d1d" font-family="sans-serif">1,000</text>
<text x="12" y="54" font-size="13" fill="#1d1d1d" font-family="sans-serif">2,000</text>
<text x="150" y="245" font-size="13" fill="#1d1d1d" font-family="sans-serif">Ash pays (£)</text>
<text x="66" y="16" font-size="13" fill="#1d1d1d" font-family="sans-serif">Birch pays (£)</text>
<polygon points="60,210 140,210 140,130 60,50" fill="#2a9d8f" fill-opacity="0.25" stroke="#1d1d1d" stroke-width="2"/>
<line x1="140" y1="130" x2="140" y2="62" stroke="#1d1d1d" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="140" y1="130" x2="220" y2="210" stroke="#1d1d1d" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="146" y="100" font-size="13" fill="#1d1d1d" font-family="sans-serif">Ash ≤ 1,000</text>
<text x="186" y="160" font-size="13" fill="#1d1d1d" font-family="sans-serif">Ash + Birch ≤ 2,000</text>
<circle cx="86.7" cy="143.3" r="4" fill="#1d1d1d"/>
<text x="70" y="168" font-size="13" fill="#1d1d1d" font-family="sans-serif">Shapley</text>
<circle cx="100" cy="50" r="4" fill="none" stroke="#e76f51" stroke-width="2"/>
<text x="110" y="40" font-size="13" fill="#1d1d1d" font-family="sans-serif">500, 2,000, 500</text>
<text x="66" y="200" font-size="13" fill="#1d1d1d" font-family="sans-serif">core</text>
</svg>
