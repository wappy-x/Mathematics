<polygon points="110,215 209,215 159.5,116 110,83" fill="currentColor" fill-opacity="0.12" stroke="none"/>
<line x1="110" y1="215" x2="318" y2="215" stroke="currentColor" stroke-width="1.5"/>
<line x1="110" y1="215" x2="110" y2="8" stroke="currentColor" stroke-width="1.5"/>
<line x1="110" y1="17" x2="209" y2="215" stroke="currentColor" stroke-width="2"/>
<line x1="110" y1="83" x2="308" y2="215" stroke="currentColor" stroke-width="2"/>
<line x1="110" y1="61" x2="308" y2="193" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="110" y1="50" x2="275" y2="215" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 3"/>
<circle cx="159.5" cy="116" r="4" fill="currentColor"/>
