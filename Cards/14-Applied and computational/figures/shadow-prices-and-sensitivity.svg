<text x="104" y="51" font-size="13" fill="currentColor" text-anchor="end">vans 30</text>
<text x="104" y="66" font-size="13" fill="currentColor" text-anchor="end">flour 700</text>
<text x="104" y="87" font-size="13" fill="currentColor" text-anchor="end">flour 600</text>
<text x="150" y="132" font-size="13" fill="currentColor" text-anchor="end">best</text>
<text x="118" y="200" font-size="13" fill="currentColor">allowed</text>
