<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 290" width="420" height="290">
<title>Huffman tree for the four forecasts, schematic: Sun 0, Cloud 10, Rain 110, Snow 111, with merged weights 1/4, 1/2 and 1 at the joins</title>
<rect x="0" y="0" width="420" height="290" fill="#ffffff"/>
<line x1="210" y1="40" x2="110" y2="100" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="210" y1="40" x2="310" y2="100" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="310" y1="100" x2="260" y2="160" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="310" y1="100" x2="360" y2="160" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="360" y1="160" x2="335" y2="220" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="360" y1="160" x2="385" y2="220" stroke="#1d1d1d" stroke-width="1.5"/>
<circle cx="210" cy="40" r="5" fill="#1d1d1d"/>
<circle cx="310" cy="100" r="5" fill="#1d1d1d"/>
<circle cx="360" cy="160" r="5" fill="#1d1d1d"/>
<rect x="104" y="94" width="12" height="12" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.5"/>
<rect x="254" y="154" width="12" height="12" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.5"/>
<rect x="329" y="214" width="12" height="12" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.5"/>
<rect x="379" y="214" width="12" height="12" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.5"/>
<text x="210" y="24" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1d1d">weight 1</text>
<text x="322" y="92" font-family="sans-serif" font-size="13" fill="#1d1d1d">1/2</text>
<text x="372" y="152" font-family="sans-serif" font-size="13" fill="#1d1d1d">1/4</text>
<text x="152" y="64" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1d1d">0</text>
<text x="268" y="64" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1d1d">1</text>
<text x="276" y="126" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1d1d">0</text>
<text x="344" y="126" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1d1d">1</text>
<text x="336" y="192" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1d1d">0</text>
<text x="384" y="192" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1d1d">1</text>
<text x="110" y="124" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1d1d">Sun</text>
<text x="110" y="140" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1d1d">0</text>
<text x="110" y="156" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1d1d">1/2</text>
<text x="260" y="184" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1d1d">Cloud</text>
<text x="260" y="200" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1d1d">10</text>
<text x="260" y="216" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1d1d">1/4</text>
<text x="335" y="244" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1d1d">Rain</text>
<text x="335" y="260" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1d1d">110</text>
<text x="335" y="276" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1d1d">1/8</text>
<text x="385" y="244" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1d1d">Snow</text>
<text x="385" y="260" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1d1d1d">111</text>
