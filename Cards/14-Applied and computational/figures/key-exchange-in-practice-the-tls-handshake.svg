<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" width="360" height="250" font-family="Helvetica, Arial, sans-serif">
<title>Schematic of the TLS 1.3 handshake between a laptop and a bank: two key shares in the clear, then certificate, signature and Finished messages and the order, all encrypted</title>
<rect x="0" y="0" width="360" height="250" fill="#ffffff"/>
<text x="60" y="22" font-size="14" text-anchor="middle" font-weight="bold" fill="#1d1d1d">Laptop</text>
<text x="300" y="22" font-size="14" text-anchor="middle" font-weight="bold" fill="#1d1d1d">Bank</text>
<line x1="60" y1="30" x2="60" y2="240" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="300" y1="30" x2="300" y2="240" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="20" y1="120" x2="340" y2="120" stroke="#1d1d1d" stroke-width="1" stroke-dasharray="2 3" stroke-opacity="0.6"/>
<text x="180" y="116" font-size="13" text-anchor="middle" fill="#1d1d1d" fill-opacity="0.8">both now hold Z = g^ab</text>
<line x1="60" y1="62" x2="292" y2="62" stroke="#1d1d1d" stroke-width="1.75"/>
<polygon points="300,62 291,58 291,66" fill="#1d1d1d"/>
<text x="180" y="55" font-size="13" text-anchor="middle" fill="#1d1d1d">ClientHello: random, A = g^a</text>
<line x1="300" y1="102" x2="68" y2="102" stroke="#1d1d1d" stroke-width="1.75"/>
<polygon points="60,102 69,98 69,106" fill="#1d1d1d"/>
<text x="180" y="95" font-size="13" text-anchor="middle" fill="#1d1d1d">ServerHello: random, B = g^b</text>
<line x1="300" y1="142" x2="68" y2="142" stroke="#1d1d1d" stroke-width="1.75" stroke-dasharray="6 4"/>
<polygon points="60,142 69,138 69,146" fill="#1d1d1d"/>
<text x="180" y="135" font-size="13" text-anchor="middle" fill="#1d1d1d">certificate, signature σ, Finished</text>
<line x1="60" y1="182" x2="292" y2="182" stroke="#1d1d1d" stroke-width="1.75" stroke-dasharray="6 4"/>
<polygon points="300,182 291,178 291,186" fill="#1d1d1d"/>
<text x="180" y="175" font-size="13" text-anchor="middle" fill="#1d1d1d">Finished</text>
<line x1="60" y1="222" x2="292" y2="222" stroke="#1d1d1d" stroke-width="1.75" stroke-dasharray="6 4"/>
<polygon points="300,222 291,218 291,226" fill="#1d1d1d"/>
<text x="180" y="215" font-size="13" text-anchor="middle" fill="#1d1d1d">the order, sealed under K</text>
</svg>
