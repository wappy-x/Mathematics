<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" style="max-width:420px;width:100%;height:auto">
<title>The entry game as a tree, schematic: the rival chooses In or Out, then after In the chain chooses Fight or Accommodate; backward induction keeps In and Accommodate, and Fight is an empty threat</title>
<rect x="0" y="0" width="360" height="280" fill="#ffffff"/>
<line x1="207.5" y1="40" x2="125" y2="120" stroke="#1d1d1d" stroke-width="3"/>
<line x1="207.5" y1="40" x2="290" y2="120" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="125" y1="120" x2="70" y2="200" stroke="#1d1d1d" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="125" y1="120" x2="180" y2="200" stroke="#1d1d1d" stroke-width="3"/>
<circle cx="207.5" cy="40" r="6" fill="#1d1d1d"/>
<circle cx="125" cy="120" r="6" fill="#1d1d1d"/>
<rect x="66" y="196" width="8" height="8" fill="#1d1d1d"/>
<rect x="176" y="196" width="8" height="8" fill="#1d1d1d"/>
<rect x="286" y="116" width="8" height="8" fill="#1d1d1d"/>
<text x="195" y="26" font-size="13" text-anchor="end" fill="#1d1d1d">rival</text>
<text x="220" y="26" font-size="13" fill="#1d1d1d">(1000, 1000)</text>
<text x="113" y="113" font-size="13" text-anchor="end" fill="#1d1d1d">chain</text>
<text x="104" y="140" font-size="13" text-anchor="end" fill="#1d1d1d">(1000, 1000)</text>
<text x="152" y="76" font-size="13" text-anchor="end" fill="#1d1d1d">In</text>
<text x="256" y="76" font-size="13" fill="#1d1d1d">Out</text>
<text x="87" y="164" font-size="13" text-anchor="end" fill="#1d1d1d">Fight</text>
<text x="160" y="164" font-size="13" fill="#1d1d1d">Accommodate</text>
<text x="70" y="224" font-size="13" text-anchor="middle" fill="#1d1d1d">(−1000, −1000)</text>
<text x="180" y="224" font-size="13" text-anchor="middle" fill="#1d1d1d">(1000, 1000)</text>
<text x="290" y="144" font-size="13" text-anchor="middle" fill="#1d1d1d">(0, 2000)</text>
<text x="14" y="252" font-size="13" fill="#1d1d1d">thick: kept by backward induction</text>
<text x="14" y="270" font-size="13" fill="#1d1d1d">dashed: the empty threat; payoffs (rival, chain)</text>
</svg>
