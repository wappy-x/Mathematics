<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" font-family="Helvetica, Arial, sans-serif" font-size="12">
<title>Arithmetic coding of five days C C S C C: each day keeps its slice of the current interval, drawn to scale on 0 to 1</title>
<rect x="0" y="0" width="360" height="240" fill="#ffffff"/>
<g stroke="#1d1d1d" stroke-width="1" fill="none">
<rect x="30" y="20" width="300" height="10"/>
<rect x="30" y="56" width="300" height="10"/>
<rect x="30" y="92" width="300" height="10"/>
<rect x="30" y="128" width="300" height="10"/>
<rect x="30" y="164" width="300" height="10"/>
<rect x="30" y="200" width="300" height="10"/>
</g>
<g fill="#264653" stroke="#1d1d1d" stroke-width="1">
<rect x="30" y="20" width="300" height="10"/>
<rect x="30" y="56" width="240" height="10"/>
<rect x="30" y="92" width="192" height="10"/>
<rect x="183.6" y="128" width="19.2" height="10"/>
<rect x="183.6" y="164" width="15.4" height="10"/>
<rect x="183.6" y="200" width="12.3" height="10"/>
</g>
<line x1="189.4" y1="194" x2="189.4" y2="216" stroke="#e76f51" stroke-width="2"/>
<g fill="#1d1d1d">
<text x="30" y="15">start: 0 to 1</text>
<text x="30" y="51">day 1, C: 0 to 0.8</text>
<text x="30" y="87">day 2, C: 0 to 0.64</text>
<text x="30" y="123">day 3, S: 0.512 to 0.576</text>
<text x="30" y="159">day 4, C: 0.512 to 0.5632</text>
<text x="30" y="195">day 5, C: 0.512 to 0.55296</text>
<text x="75" y="231">code point 0.53125 = binary 0.10001</text>
<text x="30" y="231">0</text>
<text x="323" y="231">1</text>
</g>
</svg>
