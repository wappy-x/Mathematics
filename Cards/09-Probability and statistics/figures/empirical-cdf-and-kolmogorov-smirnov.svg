<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" width="480" height="300" style="color:#24292f">
<title>The empirical CDFs of waits at two coffee shops, 8 customers each: shop A (solid) climbs earlier than shop B (dashed); the largest vertical gap, 4/8 = 0.5, is marked at 3.1 minutes, where A stands at 0.625 and B at 0.125</title><rect x="0" y="0" width="480" height="300" rx="8" fill="#ffffff"/>
<line x1="40" y1="210" x2="440" y2="210" stroke="currentColor" stroke-opacity="0.15" stroke-width="1"/>
<line x1="40" y1="160" x2="440" y2="160" stroke="currentColor" stroke-opacity="0.15" stroke-width="1"/>
<line x1="40" y1="110" x2="440" y2="110" stroke="currentColor" stroke-opacity="0.15" stroke-width="1"/>
<line x1="40" y1="60" x2="440" y2="60" stroke="currentColor" stroke-opacity="0.15" stroke-width="1"/>
<line x1="40" y1="260" x2="440" y2="260" stroke="currentColor" stroke-width="1.5"/>
<line x1="40" y1="260" x2="40" y2="50" stroke="currentColor" stroke-width="1.5"/>
<text x="40" y="278" font-size="13" fill="currentColor" text-anchor="middle">0</text>
<text x="90" y="278" font-size="13" fill="currentColor" text-anchor="middle">1</text>
<text x="140" y="278" font-size="13" fill="currentColor" text-anchor="middle">2</text>
<text x="190" y="278" font-size="13" fill="currentColor" text-anchor="middle">3</text>
<text x="240" y="278" font-size="13" fill="currentColor" text-anchor="middle">4</text>
<text x="290" y="278" font-size="13" fill="currentColor" text-anchor="middle">5</text>
<text x="340" y="278" font-size="13" fill="currentColor" text-anchor="middle">6</text>
<text x="390" y="278" font-size="13" fill="currentColor" text-anchor="middle">7</text>
<text x="440" y="278" font-size="13" fill="currentColor" text-anchor="middle">8</text>
<text x="32" y="264" font-size="13" fill="currentColor" text-anchor="end">0</text>
<text x="32" y="164" font-size="13" fill="currentColor" text-anchor="end">0.5</text>
<text x="32" y="64" font-size="13" fill="currentColor" text-anchor="end">1</text>
<text x="240" y="296" font-size="13" fill="currentColor" text-anchor="middle">wait, minutes</text>
<polyline points="40,260 100,260 100,235 135,235 135,210 160,210 160,185 180,185 180,160 195,160 195,135 215,135 215,110 250,110 250,85 290,85 290,60 440,60" fill="none" stroke="currentColor" stroke-width="2.5"/>
<polyline points="40,260 170,260 170,235 205,235 205,210 235,210 235,185 260,185 260,160 280,160 280,135 315,135 315,110 345,110 345,85 390,85 390,60 440,60" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="195" y1="235" x2="195" y2="135" stroke="#c0392b" stroke-width="3"/>
<text x="50" y="104" font-size="13" fill="#c0392b">largest gap: 4/8 = 0.5</text>
<text x="50" y="120" font-size="13" fill="#c0392b">at 3.1 minutes</text>
<text x="290" y="48" font-size="13" fill="currentColor">shop A (solid)</text>
<text x="360" y="150" font-size="13" fill="currentColor">shop B (dashed)</text>
</svg>
