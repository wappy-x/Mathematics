<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>Three overlapping circles for a six on roll 1, roll 2 and roll 3, with the count of the 216 three-roll sequences in each region</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<circle cx="135" cy="95" r="62" fill="none" stroke="currentColor" stroke-width="1.5"/>
<circle cx="225" cy="95" r="62" fill="none" stroke="currentColor" stroke-width="1.5"/>
<circle cx="180" cy="160" r="62" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="60" y="24" font-size="13" fill="currentColor">six on roll 1</text>
<text x="300" y="24" font-size="13" fill="currentColor" text-anchor="end">six on roll 2</text>
<text x="250" y="226" font-size="13" fill="currentColor">six on roll 3</text>
<text x="20" y="226" font-size="13" fill="currentColor">none: 125</text>
<text x="100" y="95" font-size="14" fill="currentColor" text-anchor="middle">25</text>
<text x="260" y="95" font-size="14" fill="currentColor" text-anchor="middle">25</text>
<text x="180" y="205" font-size="14" fill="currentColor" text-anchor="middle">25</text>
<text x="180" y="77" font-size="14" fill="currentColor" text-anchor="middle">5</text>
<text x="143" y="147" font-size="14" fill="currentColor" text-anchor="middle">5</text>
<text x="217" y="147" font-size="14" fill="currentColor" text-anchor="middle">5</text>
<text x="180" y="125" font-size="14" fill="currentColor" text-anchor="middle">1</text>
</svg>
