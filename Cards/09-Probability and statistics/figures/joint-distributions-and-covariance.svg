<text x="196" y="52" font-size="13" fill="currentColor">1</text>
<text x="246" y="52" font-size="13" fill="currentColor">2</text>
<text x="296" y="52" font-size="13" fill="currentColor">3</text>
<text x="12" y="94" font-size="13" fill="currentColor">dry, 60 days</text>
<text x="12" y="169" font-size="13" fill="currentColor">wet, 40 days</text>
<circle cx="150" cy="90" r="16.4" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<circle cx="200" cy="90" r="13.4" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<circle cx="250" cy="90" r="8.5" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<circle cx="300" cy="90" r="4.2" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<circle cx="150" cy="165" r="6.0" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<circle cx="200" cy="165" r="8.5" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<circle cx="250" cy="165" r="10.4" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<circle cx="300" cy="165" r="12.0" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<text x="143" y="124" font-size="13" fill="currentColor">30</text>
<text x="193" y="124" font-size="13" fill="currentColor">20</text>
<text x="246" y="124" font-size="13" fill="currentColor">8</text>
<text x="296" y="124" font-size="13" fill="currentColor">2</text>
<text x="146" y="199" font-size="13" fill="currentColor">4</text>
