<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>Joint table of rain and umbrella sales over 100 days, one disc per cell, area proportional to days</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<text x="150" y="22" font-size="13" fill="currentColor">umbrellas sold that day</text>
