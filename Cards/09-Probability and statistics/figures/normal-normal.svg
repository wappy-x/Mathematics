<line x1="40" y1="150" x2="320" y2="150" stroke="currentColor" stroke-width="2"/>
<rect x="81" y="86" width="30" height="64" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<rect x="204.2" y="70" width="30" height="80" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<polygon points="164.4,150 152.4,172 176.4,172" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="96" y="60" font-size="13" text-anchor="middle" fill="currentColor">log 20.0</text>
<text x="96" y="76" font-size="13" text-anchor="middle" fill="currentColor">weight 4</text>
