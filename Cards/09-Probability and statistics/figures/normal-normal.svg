<line x1="40" y1="206" x2="320" y2="206" stroke="currentColor" stroke-width="1.5"/>
<line x1="96" y1="202" x2="96" y2="210" stroke="currentColor" stroke-width="1.5"/>
<line x1="208" y1="202" x2="208" y2="210" stroke="currentColor" stroke-width="1.5"/>
<line x1="320" y1="202" x2="320" y2="210" stroke="currentColor" stroke-width="1.5"/>
