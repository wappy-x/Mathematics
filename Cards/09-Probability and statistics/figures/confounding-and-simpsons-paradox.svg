<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>Admission rate against the share of a group's applications sent to selective departments, Berkeley 1973: the women's line lies above the men's, but the women's pooled point sits far to the right, where both lines are low</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<line x1="50" y1="190" x2="330" y2="190" stroke="currentColor" stroke-width="1.5"/>
<line x1="50" y1="20" x2="50" y2="190" stroke="currentColor" stroke-width="1.5"/>
<line x1="46" y1="105" x2="50" y2="105" stroke="currentColor" stroke-width="1.5"/>
<line x1="46" y1="20" x2="50" y2="20" stroke="currentColor" stroke-width="1.5"/>
<line x1="190" y1="190" x2="190" y2="194" stroke="currentColor" stroke-width="1.5"/>
<line x1="330" y1="190" x2="330" y2="194" stroke="currentColor" stroke-width="1.5"/>
<line x1="50" y1="54.5" x2="330" y2="145.0" stroke="currentColor" stroke-width="2"/>
<line x1="50" y1="83.8" x2="330" y2="146.7" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/>
<circle cx="185.9" cy="114.3" r="4.5" fill="currentColor"/>
<circle cx="309.7" cy="138.4" r="4.5" fill="currentColor"/>
<text x="56" y="44" font-size="13" fill="currentColor">women</text>
<text x="56" y="118" font-size="13" fill="currentColor">men, dashed</text>
<text x="150" y="140" font-size="13" fill="currentColor">men pooled</text>
<text x="232" y="168" font-size="13" fill="currentColor">women pooled</text>
<text x="42" y="194" font-size="13" fill="currentColor" text-anchor="end">0</text>
<text x="42" y="109" font-size="13" fill="currentColor" text-anchor="end">0.5</text>
<text x="42" y="24" font-size="13" fill="currentColor" text-anchor="end">1</text>
<text x="56" y="14" font-size="13" fill="currentColor">admission rate</text>
<text x="50" y="208" font-size="13" fill="currentColor" text-anchor="middle">0</text>
<text x="190" y="208" font-size="13" fill="currentColor" text-anchor="middle">0.5</text>
<text x="330" y="208" font-size="13" fill="currentColor" text-anchor="middle">1</text>
<text x="190" y="228" font-size="13" fill="currentColor" text-anchor="middle">share applying to selective departments</text>
</svg>
