<svg viewBox="0 0 360 150" xmlns="http://www.w3.org/2000/svg" width="360" height="150" style="color:#24292f">
<title>The raffle ticket's two payouts, $0 and $100, its mean of $1, and the band one standard deviation either side of the mean, drawn to scale at 3 units per dollar</title><rect x="0" y="0" width="360" height="150" rx="8" fill="#ffffff"/>
<rect x="3.15" y="70" width="59.7" height="20" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<line x1="3" y1="80" x2="345" y2="80" stroke="currentColor" stroke-width="1.5"/>
<circle cx="30" cy="80" r="5" fill="currentColor" stroke="currentColor" stroke-width="1.5"/>
<circle cx="330" cy="80" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
<line x1="33" y1="80" x2="33" y2="45" stroke="currentColor" stroke-width="1.5"/>
<text x="38" y="44" font-size="13" fill="currentColor">mean $1</text>
<line x1="33" y1="60" x2="330" y2="60" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="130" y="54" font-size="13" fill="currentColor">99 dollars from the mean</text>
<text x="4" y="110" font-size="13" fill="currentColor">$0, chance 0.99</text>
<text x="356" y="110" font-size="13" fill="currentColor" text-anchor="end">$100, chance 0.01</text>
<text x="4" y="128" font-size="13" fill="currentColor">shaded band: the mean ± one standard deviation,</text>
<text x="4" y="144" font-size="13" fill="currentColor">from −$8.95 to $10.95</text>
</svg>
