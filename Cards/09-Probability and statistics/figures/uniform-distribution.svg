<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>The exponential cumulative chance with mean 5 minutes for waits from 0 to 20 minutes; a uniform draw of 0.70 on the vertical axis is read across to the curve and down to a wait of 6.0199 minutes</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<line x1="40" y1="200" x2="340" y2="200" stroke="currentColor" stroke-width="1.5"/>
<line x1="40" y1="200" x2="40" y2="30" stroke="currentColor" stroke-width="1.5"/>
<polyline points="40.0,200.0 70.0,144.0 100.0,106.4 130.0,81.2 160.0,64.3 190.0,53.0 220.0,45.4 250.0,40.3 280.0,36.9 310.0,34.6 340.0,33.1" fill="none" stroke="currentColor" stroke-width="2"/>
<line x1="40" y1="81.0" x2="130.3" y2="81.0" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5,4"/>
<line x1="130.3" y1="81.0" x2="130.3" y2="200" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="34" y="85" font-size="13" text-anchor="end" fill="currentColor">0.70</text>
<text x="34" y="35" font-size="13" text-anchor="end" fill="currentColor">1</text>
<text x="34" y="204" font-size="13" text-anchor="end" fill="currentColor">0</text>
<text x="40" y="216" font-size="13" text-anchor="middle" fill="currentColor">0</text>
<text x="130.3" y="216" font-size="13" text-anchor="middle" fill="currentColor">6.0199</text>
<text x="190" y="216" font-size="13" text-anchor="middle" fill="currentColor">10</text>
<text x="340" y="216" font-size="13" text-anchor="middle" fill="currentColor">20</text>
<text x="190" y="234" font-size="13" text-anchor="middle" fill="currentColor">exponential wait (minutes)</text>
<text x="160" y="130" font-size="13" fill="currentColor">G(x) = 1 − e^(−x/5)</text>
</svg>
