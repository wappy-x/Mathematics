<line x1="40" y1="222" x2="224.81" y2="21.24" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="224.81" y1="21.24" x2="224.81" y2="222" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3"/>
<line x1="200.87" y1="87.01" x2="222.32" y2="69.02" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3"/>
<polyline points="216.81,222 216.81,214 224.81,214" fill="none" stroke="currentColor" stroke-width="1.5"/>
<path d="M 68 222 A 28 28 0 0 0 61.45 204" fill="none" stroke="currentColor" stroke-width="1.5"/>
<path d="M 93.62 177 A 70 70 0 0 0 87.41 170.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<path d="M 216.96 73.52 A 21 21 0 0 0 208.05 67.28" fill="none" stroke="currentColor" stroke-width="1.5"/>
<circle cx="40" cy="222" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
<circle cx="200.87" cy="87.01" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="40" y="236" font-size="13" text-anchor="middle" fill="currentColor">pivot</text>
<text x="74" y="214" font-size="13" fill="currentColor">40°</text>
<text x="80" y="160" font-size="13" text-anchor="end" fill="currentColor">φ = 7.37°</text>
<text x="120" y="176" font-size="13" fill="currentColor">main boom 30 m</text>
