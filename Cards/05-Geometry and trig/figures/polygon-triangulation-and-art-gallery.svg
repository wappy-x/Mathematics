  <line x1="290" y1="196" x2="212" y2="118" stroke="#1d1d1d" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="82" y1="66" x2="212" y2="118" stroke="#1d1d1d" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="82" cy="196" r="6" fill="#1d1d1d"/>
  <circle cx="212" cy="118" r="6" fill="#1d1d1d"/>
