<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>The survey field cut into four triangles with corners coloured 1, 2, 3 and guards at A and D; the 12-corner comb with the floor strip each prong tip can see</title>
  <rect x="0" y="0" width="640" height="250" fill="#ffffff"/>
  <polygon points="82,196 290,196 316,66 212,118 160,14 82,66" fill="#f3efe6" stroke="#1d1d1d" stroke-width="2"/>
