<circle cx="310" cy="40" r="3" fill="#8a8a8a"/>
<text x="62" y="360" text-anchor="end" fill="#1d1d1d">(0, 0)</text>
<text x="318" y="360" text-anchor="start" fill="#1d1d1d">(4, 0)</text>
