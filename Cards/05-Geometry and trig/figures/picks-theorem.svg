<circle cx="190" cy="160" r="7" fill="#ffffff" stroke="#1d1d1d" stroke-width="2.5"/>
<circle cx="190" cy="100" r="7" fill="#ffffff" stroke="#1d1d1d" stroke-width="2.5"/>
<circle cx="190" cy="40" r="7" fill="#1d1d1d"/>
<circle cx="250" cy="340" r="7" fill="#1d1d1d"/>
<circle cx="250" cy="280" r="7" fill="#ffffff" stroke="#1d1d1d" stroke-width="2.5"/>
