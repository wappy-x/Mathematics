<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>The van's grid drawn to scale: depot at the origin, drop A at (3, 4) km, drop B at (8, 1) km, the straight 5.83 km segment between them with its midpoint M at (5.5, 2.5), and dashed legs of 5 km east and 3 km south meeting square at (8, 4)</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<line x1="40" y1="190" x2="340" y2="190" stroke="currentColor" stroke-width="1.5"/>
<line x1="40" y1="190" x2="40" y2="40" stroke="currentColor" stroke-width="1.5"/>
<text x="336" y="206" font-size="13" text-anchor="end" fill="currentColor">east, km</text>
<text x="46" y="44" font-size="13" fill="currentColor">north, km</text>
<text x="44" y="206" font-size="13" fill="currentColor">depot (0, 0)</text>
<polyline points="130,70 280,70 280,160" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/>
<polyline points="270,70 270,80 280,80" fill="none" stroke="currentColor" stroke-width="1.5"/>
<line x1="130" y1="70" x2="280" y2="160" stroke="currentColor" stroke-width="2"/>
<line x1="164.4" y1="97.6" x2="170.6" y2="87.4" stroke="currentColor" stroke-width="1.5"/>
<line x1="239.4" y1="142.6" x2="245.6" y2="132.4" stroke="currentColor" stroke-width="1.5"/>
<circle cx="130" cy="70" r="3.5" fill="currentColor"/>
<circle cx="280" cy="160" r="3.5" fill="currentColor"/>
<circle cx="205" cy="115" r="3.5" fill="currentColor"/>
<text x="124" y="64" font-size="14" text-anchor="end" fill="currentColor">A (3, 4)</text>
<text x="288" y="174" font-size="14" fill="currentColor">B (8, 1)</text>
<text x="198" y="138" font-size="14" text-anchor="end" fill="currentColor">M (5.5, 2.5)</text>
<text x="205" y="62" font-size="13" text-anchor="middle" fill="currentColor">5 km</text>
<text x="288" y="119" font-size="13" fill="currentColor">3 km</text>
<text x="236" y="100" font-size="13" text-anchor="middle" fill="currentColor">5.83 km</text>
