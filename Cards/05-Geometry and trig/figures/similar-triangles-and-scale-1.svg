<path d="M 171.6 220 A 22 22 0 0 1 179.86 202.82" fill="none" stroke="currentColor" stroke-width="1.5"/>
<line x1="260" y1="220" x2="260" y2="204" stroke="currentColor" stroke-width="2"/>
