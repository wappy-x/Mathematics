<line x1="18" y1="95.0" x2="222" y2="95.0" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="120" y1="125" x2="204.9" y2="95.0" stroke="currentColor" stroke-width="2"/>
<line x1="120" y1="125" x2="35.1" y2="95.0" stroke="currentColor" stroke-width="2"/>
