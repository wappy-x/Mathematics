<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title>Left: a right triangle with legs 1 and 1 in the half-plane map, corners C at i, A at 2.718 i and B at 0.762 + 0.648 i. Right: a point P at distance 1 above a line L, with the limiting parallels meeting L only at the map's edge, 40.4 degrees from the perpendicular.</title>
<rect x="0" y="0" width="640" height="360" fill="#ffffff"/>
<g stroke="#1d1d1d" fill="none" stroke-width="1.5">
  <line x1="20" y1="320" x2="310" y2="320"/>
  <line x1="340" y1="320" x2="630" y2="320"/>
  <line x1="120" y1="48.2" x2="120" y2="220"/>
  <path d="M 120 220 A 100 100 0 0 1 196.2 255.2"/>
  <path d="M 120 48.2 A 499.8 499.8 0 0 1 196.2 255.2" stroke="#c0392b" stroke-width="2"/>
  <polyline points="120,208 132,208 132,220" stroke-width="1"/>
  <path d="M 414.8 320 A 55.2 55.2 0 0 1 525.2 320" stroke-width="2"/>
  <line x1="470" y1="170" x2="470" y2="264.8" stroke-dasharray="5 4"/>
  <path d="M 380 105.2 A 231.5 231.5 0 0 1 525.2 320" stroke="#c0392b" stroke-width="2"/>
  <path d="M 560 105.2 A 231.5 231.5 0 0 0 414.8 320" stroke="#c0392b" stroke-width="2"/>
  <path d="M 470 200 A 30 30 0 0 0 489.4 192.8" stroke-width="1"/>
</g>
<g fill="#1d1d1d">
  <circle cx="120" cy="48.2" r="3.5"/><circle cx="196.2" cy="255.2" r="3.5"/><circle cx="120" cy="220" r="3.5"/>
  <circle cx="470" cy="170" r="3.5"/><circle cx="470" cy="264.8" r="2.5"/>
  <text x="20" y="22" font-weight="bold">Legs 1 and 1 at a right angle</text>
  <text x="104" y="52">A</text><text x="204" y="262">B</text><text x="104" y="226">C</text>
  <text x="126" y="140">1</text><text x="160" y="226">1</text>
  <text x="172" y="130" fill="#c0392b">c = 1.513</text>
  <text x="26" y="340">edge of the map: points here are infinitely far</text>
  <text x="350" y="22" font-weight="bold">The limiting parallel at distance 1</text>
  <text x="452" y="166">P</text><text x="474" y="250">d = 1</text>
  <text x="532" y="306">L</text>
  <text x="482" y="226" font-size="12">40.4°</text>
  <text x="345" y="80" fill="#c0392b">limiting parallels</text>
  <text x="350" y="340">they meet L only at the edge</text>
</g>
</svg>
