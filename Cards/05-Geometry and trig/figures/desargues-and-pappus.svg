<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>Desargues: triangles ABC and A'B'C' in perspective from O, their matching sides meeting at P, Q and R on one line. Pappus: three points on each of two lines, the cross-joins meeting at M12, M13 and M23 on one line.</title>
  <rect x="0" y="0" width="560" height="440" fill="#ffffff"/>
  <g stroke="#1d1d1d" fill="none" stroke-linecap="round">
    <!-- Desargues, 40 units per 1, origin O at (60, 280) -->
    <g stroke-width="1" stroke-dasharray="2 3">
      <line x1="60" y1="280" x2="164" y2="280"/>
      <line x1="60" y1="280" x2="60" y2="136"/>
      <line x1="60" y1="280" x2="132" y2="136"/>
    </g>
    <g stroke-width="1" stroke-dasharray="6 4">
      <line x1="60" y1="240" x2="220" y2="400"/>
      <line x1="60" y1="160" x2="220" y2="400"/>
      <line x1="60" y1="240" x2="140" y2="160"/>
      <line x1="120" y1="160" x2="140" y2="160"/>
      <line x1="100" y1="280" x2="100" y2="40"/>
      <line x1="140" y1="280" x2="100" y2="40"/>
    </g>
    <polygon points="100,280 60,240 100,200" stroke-width="2"/>
    <polygon points="140,280 60,160 120,160" stroke-width="2"/>
    <line x1="94" y1="22" x2="226" y2="418" stroke-width="2.5"/>
    <!-- Pappus, 40 units per 1, origin at (330, 260) -->
    <line x1="310" y1="260" x2="550" y2="260" stroke-width="2"/>
    <line x1="310" y1="180" x2="550" y2="180" stroke-width="2"/>
    <g stroke-width="1">
      <line x1="330" y1="260" x2="410" y2="180"/>
      <line x1="370" y1="260" x2="330" y2="180"/>
      <line x1="330" y1="260" x2="530" y2="180"/>
      <line x1="450" y1="260" x2="330" y2="180"/>
      <line x1="370" y1="260" x2="530" y2="180"/>
      <line x1="450" y1="260" x2="410" y2="180"/>
    </g>
    <line x1="314" y1="236.28" x2="546" y2="220.28" stroke-width="2.5"/>
  </g>
  <g fill="#1d1d1d">
    <circle cx="60" cy="280" r="3.5"/>
    <circle cx="100" cy="280" r="3"/><circle cx="60" cy="240" r="3"/><circle cx="100" cy="200" r="3"/>
    <circle cx="140" cy="280" r="3"/><circle cx="60" cy="160" r="3"/><circle cx="120" cy="160" r="3"/>
    <circle cx="220" cy="400" r="4"/><circle cx="140" cy="160" r="4"/><circle cx="100" cy="40" r="4"/>
    <circle cx="330" cy="260" r="3"/><circle cx="370" cy="260" r="3"/><circle cx="450" cy="260" r="3"/>
    <circle cx="330" cy="180" r="3"/><circle cx="410" cy="180" r="3"/><circle cx="530" cy="180" r="3"/>
    <circle cx="356.7" cy="233.3" r="3.5"/><circle cx="405" cy="230" r="3.5"/><circle cx="434" cy="228" r="3.5"/>
    <text x="44" y="296">O</text>
    <text x="96" y="296">A</text><text x="46" y="244">B</text><text x="86" y="200">C</text>
    <text x="142" y="296">A′</text><text x="44" y="158">B′</text><text x="102" y="154">C′</text>
    <text x="228" y="404">P (4, −3)</text><text x="146" y="156">Q (2, 3)</text><text x="108" y="44">R (1, 6)</text>
    <text x="20" y="430" font-weight="bold">Desargues</text>
    <text x="322" y="278">D1</text><text x="362" y="278">D2</text><text x="442" y="278">D3</text>
    <text x="322" y="172">T1</text><text x="402" y="172">T2</text><text x="522" y="172">T3</text>
    <text x="316" y="228">M12</text><text x="398" y="249">M13</text><text x="432" y="246">M23</text>
    <text x="330" y="140" font-weight="bold">Pappus</text>
    <text x="330" y="304">y = 0, points at x = 0, 1, 3</text>
    <text x="330" y="320">y = 2, points at x = 0, 2, 5</text>
  </g>
</svg>
