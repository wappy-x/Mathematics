<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" width="580" height="460" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>Ruler construction of the harmonic conjugate in the level photo: sleepers A (4 m), C (5 m) and B (6 m) on the centre line; lines from P, Q, R and S; line RS meets the centre line at D on the horizon</title>
  <rect x="0" y="0" width="580" height="460" fill="#ffffff"/>
  <g stroke="#1d1d1d" fill="none" stroke-linecap="round">
    <line x1="131.0" y1="60.0" x2="549.0" y2="60.0" stroke-width="1" stroke-dasharray="6 4"/>
    <line x1="150.0" y1="32.0" x2="150.0" y2="438.0" stroke-width="2"/>
    <line x1="530.0" y1="200.0" x2="150.0" y2="410.0" stroke-width="1"/>
    <line x1="530.0" y1="200.0" x2="150.0" y2="293.3" stroke-width="1"/>
    <line x1="530.0" y1="200.0" x2="150.0" y2="340.0" stroke-width="1" stroke-dasharray="2 3"/>
    <line x1="150.0" y1="410.0" x2="387.5" y2="235.0" stroke-width="1"/>
    <line x1="150.0" y1="293.3" x2="421.4" y2="260.0" stroke-width="1"/>
    <line x1="421.4" y1="260.0" x2="150.0" y2="60.0" stroke-width="2.5"/>
  </g>
  <g fill="#1d1d1d" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">
    <circle cx="150.0" cy="410.0" r="3.5"/>
    <circle cx="150.0" cy="293.3" r="3.5"/>
    <circle cx="150.0" cy="340.0" r="3.5"/>
    <circle cx="150.0" cy="60.0" r="3.5"/>
    <circle cx="530.0" cy="200.0" r="3.5"/>
    <circle cx="340.0" cy="270.0" r="3.5"/>
    <circle cx="387.5" cy="235.0" r="3.5"/>
    <circle cx="421.4" cy="260.0" r="3.5"/>
    <text x="140.0" y="414.0" text-anchor="end">A: 4 m, 0.25</text>
    <text x="140.0" y="344.0" text-anchor="end">C: 5 m, 0.2</text>
    <text x="140.0" y="297.3" text-anchor="end">B: 6 m, 0.166667</text>
    <text x="140.0" y="54.0" text-anchor="end">D: infinity, 0</text>
    <text x="530.0" y="190.0" text-anchor="end">P (1, 0.1)</text>
    <text x="330.0" y="262.0" text-anchor="end">Q (0.5, 0.15)</text>
    <text x="381.5" y="227.0" text-anchor="end">R (0.625, 0.125)</text>
    <text x="427.4" y="278.0" text-anchor="start">S (0.714286, 0.142857)</text>
    <text x="549.0" y="52.0" text-anchor="end">horizon, y = 0</text>
    <text x="158.0" y="43.2">centre line, u = 0</text>
    <text x="290" y="440" text-anchor="middle">heights y drawn 3.7 times the scale of u</text>
  </g>
</svg>
