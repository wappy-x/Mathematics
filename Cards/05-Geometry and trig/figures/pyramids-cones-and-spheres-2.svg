<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>A 1 m cube cut into three congruent pyramids that share the tip P; piece 1, shaded, stands on the front face</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<polygon points="100,200 220,200 271.96,50 100,80" fill="currentColor" fill-opacity="0.12" stroke="none"/>
<polygon points="100,200 220,200 220,80 100,80" fill="none" stroke="currentColor" stroke-width="2"/>
<polyline points="100,80 151.96,50 271.96,50 271.96,170 220,200" fill="none" stroke="currentColor" stroke-width="2"/>
<line x1="220" y1="80" x2="271.96" y2="50" stroke="currentColor" stroke-width="2"/>
<polyline points="100,200 151.96,170 271.96,170" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5,4"/>
<line x1="151.96" y1="170" x2="151.96" y2="50" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5,4"/>
<line x1="271.96" y1="50" x2="100" y2="80" stroke="currentColor" stroke-width="1.5"/>
<line x1="271.96" y1="50" x2="220" y2="200" stroke="currentColor" stroke-width="1.5"/>
<line x1="271.96" y1="50" x2="151.96" y2="170" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2,3"/>
<line x1="271.96" y1="50" x2="100" y2="200" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2,3"/>
<circle cx="271.96" cy="50" r="3" fill="currentColor"/>
<circle cx="100" cy="200" r="3" fill="currentColor"/>
<text x="278" y="46" font-size="14" fill="currentColor">P</text>
<text x="84" y="214" font-size="14" fill="currentColor">Q</text>
<text x="160" y="222" font-size="13" fill="currentColor" text-anchor="middle">1 m</text>
<text x="125" y="120" font-size="14" fill="currentColor">1</text>
<text x="168" y="64" font-size="14" fill="currentColor">2</text>
<text x="252" y="145" font-size="14" fill="currentColor">3</text>
</svg>
