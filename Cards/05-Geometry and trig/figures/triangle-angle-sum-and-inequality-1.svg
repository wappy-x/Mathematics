<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" width="360" height="160" style="color:#24292f">
<title>An 8 m panel with a 3 m panel hinged at its left end and a 4 m panel at its right end, both pointed at each other, still 1 m apart</title><rect x="0" y="0" width="360" height="160" rx="8" fill="#ffffff"/>
<line x1="20" y1="120" x2="340" y2="120" stroke="currentColor" stroke-width="2"/>
<line x1="20" y1="80" x2="140" y2="80" stroke="currentColor" stroke-width="2"/>
<line x1="180" y1="80" x2="340" y2="80" stroke="currentColor" stroke-width="2"/>
<line x1="20" y1="80" x2="20" y2="120" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="340" y1="80" x2="340" y2="120" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="140" y1="72" x2="140" y2="88" stroke="currentColor" stroke-width="1.5"/>
<line x1="180" y1="72" x2="180" y2="88" stroke="currentColor" stroke-width="1.5"/>
<text x="80" y="72" font-size="13" text-anchor="middle" fill="currentColor">3 m</text>
<text x="260" y="72" font-size="13" text-anchor="middle" fill="currentColor">4 m</text>
<text x="160" y="104" font-size="13" text-anchor="middle" fill="currentColor">1 m short</text>
<text x="180" y="142" font-size="13" text-anchor="middle" fill="currentColor">8 m</text>
<text x="20" y="142" font-size="13" text-anchor="middle" fill="currentColor">A</text>
<text x="340" y="142" font-size="13" text-anchor="middle" fill="currentColor">B</text>
</svg>
