<polyline points="130,170 180,207.5 230,170" fill="none" stroke="currentColor" stroke-width="2"/>
<line x1="130" y1="170" x2="230" y2="170" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5,4"/>
<line x1="180" y1="170" x2="180" y2="207.5" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5,4"/>
<line x1="158" y1="184.75" x2="152" y2="192.75" stroke="currentColor" stroke-width="1.5"/>
<line x1="202" y1="184.75" x2="208" y2="192.75" stroke="currentColor" stroke-width="1.5"/>
<polyline points="180,178 188,178 188,170" fill="none" stroke="currentColor" stroke-width="1.5"/>
