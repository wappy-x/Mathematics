<line x1="105" y1="20" x2="115" y2="20" stroke="currentColor" stroke-width="1.5"/>
<line x1="105" y1="170" x2="115" y2="170" stroke="currentColor" stroke-width="1.5"/>
<line x1="105" y1="207.5" x2="115" y2="207.5" stroke="currentColor" stroke-width="1.5"/>
<text x="180" y="14" font-size="13" fill="currentColor" text-anchor="middle">2 m across</text>
<text x="180" y="100" font-size="14" fill="currentColor" text-anchor="middle">tank</text>
<text x="104" y="100" font-size="13" fill="currentColor" text-anchor="end">3 m</text>
<text x="104" y="194" font-size="13" fill="currentColor" text-anchor="end">h = 0.75 m</text>
<text x="205" y="164" font-size="13" fill="currentColor" text-anchor="middle">r = 1 m</text>
