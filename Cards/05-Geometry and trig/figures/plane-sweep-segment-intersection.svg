<svg viewBox="0 0 500 330" xmlns="http://www.w3.org/2000/svg" width="500" height="330" style="color:#24292f">
<title>Four copper tracks S1 to S4 on a 6 cm by 4 cm board, drawn to scale, with their four crossings marked and a dashed vertical sweep line at x = 4 cm</title><rect x="0" y="0" width="500" height="330" rx="8" fill="#ffffff"/>
<g stroke="currentColor" stroke-opacity="0.25" stroke-width="1">
<line x1="60" y1="280" x2="420" y2="280"/><line x1="60" y1="40" x2="60" y2="280"/>
<line x1="120" y1="276" x2="120" y2="284"/><line x1="180" y1="276" x2="180" y2="284"/><line x1="240" y1="276" x2="240" y2="284"/><line x1="300" y1="276" x2="300" y2="284"/><line x1="360" y1="276" x2="360" y2="284"/><line x1="420" y1="276" x2="420" y2="284"/>
<line x1="56" y1="220" x2="64" y2="220"/><line x1="56" y1="160" x2="64" y2="160"/><line x1="56" y1="100" x2="64" y2="100"/><line x1="56" y1="40" x2="64" y2="40"/>
</g>
<g font-size="12" fill="currentColor" text-anchor="middle">
<text x="60" y="298">0</text><text x="120" y="298">1</text><text x="180" y="298">2</text><text x="240" y="298">3</text><text x="300" y="298">4</text><text x="360" y="298">5</text><text x="420" y="298">6</text>
<text x="240" y="320">x, cm along the board</text>
<text x="46" y="284">0</text><text x="46" y="224">1</text><text x="46" y="164">2</text><text x="46" y="104">3</text><text x="46" y="44">4</text><text x="20" y="22" text-anchor="start">y, cm</text>
</g>
<line x1="300" y1="22" x2="300" y2="288" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="306" y="22" font-size="12" fill="currentColor">sweep line at x = 4</text>
<g stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
<line x1="60" y1="280" x2="420" y2="40"/>
<line x1="60" y1="40" x2="420" y2="280"/>
<line x1="120" y1="100" x2="360" y2="100"/>
<line x1="360" y1="280" x2="420" y2="220"/>
</g>
<g fill="#ffffff" stroke="currentColor" stroke-width="2">
<circle cx="150" cy="100" r="5"/><circle cx="240" cy="160" r="5"/><circle cx="330" cy="100" r="5"/><circle cx="384" cy="256" r="5"/>
</g>
<g font-size="14" font-weight="bold" fill="currentColor">
<text x="160" y="250">S1</text><text x="86" y="44">S2</text><text x="108" y="94">S3</text><text x="428" y="226">S4</text>
</g>
<g font-size="12" fill="currentColor" text-anchor="middle">
<text x="150" y="88">(1.5, 3)</text><text x="240" y="186">(3, 2)</text><text x="330" y="88">(4.5, 3)</text><text x="428" y="262" text-anchor="start">(5.4, 0.4)</text>
</g>
</svg>
