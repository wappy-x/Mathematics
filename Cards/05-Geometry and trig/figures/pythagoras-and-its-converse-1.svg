<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>A roof truss drawn to scale: rafters of 3 m and 4 m meet at a right angle at the ridge C over a 5 m tie beam from A to B</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<polygon points="30,200 330,200 222,56" fill="none" stroke="currentColor" stroke-width="2"/>
<polyline points="212.4,63.2 219.6,72.8 229.2,65.6" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="14" y="205" font-size="14" fill="currentColor">A</text>
<text x="338" y="205" font-size="14" fill="currentColor">B</text>
<text x="216" y="46" font-size="14" fill="currentColor">C</text>
<text x="112" y="118" font-size="13" text-anchor="end" fill="currentColor">b = 4 m</text>
<text x="292" y="118" font-size="13" fill="currentColor">a = 3 m</text>
<text x="180" y="222" font-size="13" text-anchor="middle" fill="currentColor">c = 5 m, the tie beam</text>
</svg>
