<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300" font-family="Helvetica, Arial, sans-serif" font-size="11">
  <title>Six depots split by a k-d tree, a query at (9, 2), its nearest depot (8, 1) and the skipped left half</title>
  <rect x="0" y="0" width="360" height="300" fill="#ffffff"/>
  <rect x="30" y="30" width="210" height="240" fill="#e6e6e6"/>
  <rect x="30" y="30" width="300" height="240" fill="none" stroke="#1d1d1d" stroke-width="1"/>
  <line x1="240" y1="30" x2="240" y2="270" stroke="#1d1d1d" stroke-width="2.5"/>
  <line x1="30" y1="150" x2="240" y2="150" stroke="#1d1d1d" stroke-width="1.5"/>
  <line x1="240" y1="90" x2="330" y2="90" stroke="#1d1d1d" stroke-width="1.5"/>
  <text x="244" y="44" fill="#1d1d1d">x = 7 (root)</text>
  <text x="36" y="144" fill="#1d1d1d">y = 4</text>
  <text x="296" y="84" fill="#1d1d1d">y = 6</text>
  <text x="60" y="250" fill="#1d1d1d">left half: skipped</text>
  <circle cx="300" cy="210" r="42.43" fill="none" stroke="#1d1d1d" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="240" y1="210" x2="300" y2="210" stroke="#1d1d1d" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="250" y="200" fill="#1d1d1d">gap 2</text>
  <g fill="#1d1d1d">
    <circle cx="90" cy="180" r="4"/><text x="96" y="194">(2, 3)</text>
    <circle cx="180" cy="150" r="4"/><text x="186" y="166">(5, 4)</text>
    <circle cx="300" cy="90" r="4"/><text x="290" y="108">(9, 6)</text>
    <circle cx="150" cy="60" r="4"/><text x="156" y="56">(4, 7)</text>
    <circle cx="270" cy="240" r="4"/><text x="258" y="262">(8, 1)</text>
    <circle cx="240" cy="210" r="4"/><text x="196" y="228">(7, 2)</text>
  </g>
  <path d="M294 204 L306 216 M306 204 L294 216" stroke="#1d1d1d" stroke-width="2"/>
  <text x="308" y="226" fill="#1d1d1d">query</text>
  <text x="308" y="238" fill="#1d1d1d">(9, 2)</text>
</svg>
