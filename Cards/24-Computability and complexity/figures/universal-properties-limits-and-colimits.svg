<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" width="420" height="340">
<title>Schematic of the product diagram: the 4 orders map to the 2 colours by f and to the 3 sizes by g; the dashed arrow h, the only one of its kind, sends each order to its pair in the 6-point set A x B, and the projections pi A and pi B read the colour and the size back off</title>
<defs>
<marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#1d1d1d"/>
</marker>
</defs>
<rect x="0" y="0" width="420" height="340" fill="#ffffff"/>
<line x1="190" y1="68" x2="84" y2="268" stroke="#1d1d1d" stroke-width="1.6" marker-end="url(#tip)"/>
<line x1="230" y1="68" x2="336" y2="268" stroke="#1d1d1d" stroke-width="1.6" marker-end="url(#tip)"/>
<line x1="210" y1="70" x2="210" y2="148" stroke="#1d1d1d" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#tip)"/>
<line x1="186" y1="188" x2="92" y2="270" stroke="#1d1d1d" stroke-width="1.6" marker-end="url(#tip)"/>
<line x1="234" y1="188" x2="328" y2="270" stroke="#1d1d1d" stroke-width="1.6" marker-end="url(#tip)"/>
<rect x="150" y="32" width="120" height="36" rx="6" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.4"/>
<text x="210" y="55" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1d1d1d">orders today, 4</text>
<rect x="150" y="152" width="120" height="36" rx="6" fill="#ffffff" stroke="#1d1d1d" stroke-width="2.2"/>
<text x="210" y="175" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1d1d1d">A × B, 6 pairs</text>
<rect x="20" y="272" width="100" height="36" rx="6" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.4"/>
<text x="70" y="295" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1d1d1d">colours, 2</text>
<rect x="300" y="272" width="100" height="36" rx="6" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.4"/>
<text x="350" y="295" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1d1d1d">sizes, 3</text>
<text x="104" y="140" font-family="sans-serif" font-size="13" fill="#1d1d1d">f</text>
<text x="308" y="140" font-family="sans-serif" font-size="13" fill="#1d1d1d">g</text>
<text x="218" y="104" font-family="sans-serif" font-size="13" fill="#1d1d1d">h, exactly one</text>
<text x="104" y="236" font-family="sans-serif" font-size="13" fill="#1d1d1d">π<tspan dy="4" font-size="10">A</tspan></text>
<text x="296" y="236" font-family="sans-serif" font-size="13" fill="#1d1d1d">π<tspan dy="4" font-size="10">B</tspan></text>
<text x="210" y="330" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555555">schematic: f = π<tspan dy="3" font-size="8">A</tspan><tspan dy="-3"> ∘ h and g = π</tspan><tspan dy="3" font-size="8">B</tspan><tspan dy="-3"> ∘ h</tspan></text>
</svg>
