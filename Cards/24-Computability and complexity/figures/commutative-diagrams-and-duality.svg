<text x="220" y="175" text-anchor="middle" font-family="sans-serif" fill="#1d1d1d" font-size="13">A × B: 6 meal deals</text>
<rect x="18.0" y="263.0" width="124" height="34" rx="6" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.4"/>
<text x="80" y="285" text-anchor="middle" font-family="sans-serif" fill="#1d1d1d" font-size="13">A: 2 drinks</text>
<rect x="298.0" y="263.0" width="124" height="34" rx="6" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.4"/>
<text x="360" y="285" text-anchor="middle" font-family="sans-serif" fill="#1d1d1d" font-size="13">B: 3 pastries</text>
<rect x="595.0" y="43.0" width="170" height="34" rx="6" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.4"/>
<text x="680" y="65" text-anchor="middle" font-family="sans-serif" fill="#1d1d1d" font-size="13">Y: prices in pence</text>
<rect x="595.0" y="153.0" width="170" height="34" rx="6" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.4"/>
<text x="680" y="175" text-anchor="middle" font-family="sans-serif" fill="#1d1d1d" font-size="13">A + B: 5 voucher items</text>
<rect x="478.0" y="263.0" width="124" height="34" rx="6" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.4"/>
<text x="540" y="285" text-anchor="middle" font-family="sans-serif" fill="#1d1d1d" font-size="13">A: 2 drinks</text>
<rect x="758.0" y="263.0" width="124" height="34" rx="6" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.4"/>
<text x="820" y="285" text-anchor="middle" font-family="sans-serif" fill="#1d1d1d" font-size="13">B: 3 pastries</text>
<text x="450" y="340" text-anchor="middle" font-family="sans-serif" fill="#1d1d1d" font-size="13">Schematic. The same shape twice: every arrow on the right is an arrow on the left, reversed.</text>
</svg>
