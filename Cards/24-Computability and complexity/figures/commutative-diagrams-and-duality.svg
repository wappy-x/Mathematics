<text x="740.9" y="243.2" text-anchor="middle" font-family="sans-serif" fill="#1d1d1d" font-size="15" font-style="italic">inr</text>
<rect x="135.0" y="43.0" width="170" height="34" rx="6" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.4"/>
<text x="220" y="65" text-anchor="middle" font-family="sans-serif" fill="#1d1d1d" font-size="13">X: 3 tables</text>
