<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 210" width="420" height="210" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>Schematic two-qubit circuit: the coin qubit A and qubit B at 0 meet one CNOT gate, then each is read</title>
  <rect x="0" y="0" width="420" height="210" fill="#ffffff"/>
  <g stroke="#1d1d1d" stroke-width="2" fill="none">
    <line x1="130" y1="60" x2="310" y2="60"/>
    <line x1="130" y1="150" x2="310" y2="150"/>
    <line x1="210" y1="60" x2="210" y2="166"/>
    <circle cx="210" cy="150" r="16"/>
    <line x1="194" y1="150" x2="226" y2="150"/>
    <rect x="310" y="44" width="40" height="32"/>
    <rect x="310" y="134" width="40" height="32"/>
    <path d="M316 70 A14 14 0 0 1 344 70"/>
    <path d="M316 160 A14 14 0 0 1 344 160"/>
    <line x1="330" y1="70" x2="341" y2="52"/>
    <line x1="330" y1="160" x2="341" y2="142"/>
  </g>
  <circle cx="210" cy="60" r="7" fill="#1d1d1d"/>
  <g fill="#1d1d1d">
    <text x="10" y="40">A, the coin</text>
    <text x="10" y="65">0.8|0⟩ + 0.6|1⟩</text>
    <text x="10" y="130">B</text>
    <text x="10" y="155">|0⟩</text>
    <text x="222" y="40">control</text>
    <text x="232" y="128">target</text>
    <text x="300" y="100">read A</text>
    <text x="300" y="190">read B</text>
    <text x="10" y="200">after the gate: 0.8|00⟩ + 0.6|11⟩</text>
  </g>
</svg>
