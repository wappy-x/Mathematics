<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" font-family="Helvetica, Arial, sans-serif">
<title>Depth-2 circuit for the parity of 3 staff: four AND gates, one per odd rota, feed one OR gate (schematic)</title>
<rect x="0" y="0" width="520" height="300" fill="#ffffff"/>
<circle cx="40" cy="60" r="5" fill="#1d1d1d"/><text x="14" y="65" font-size="14" fill="#1d1d1d">x1</text>
<circle cx="40" cy="140" r="5" fill="#1d1d1d"/><text x="14" y="145" font-size="14" fill="#1d1d1d">x2</text>
<circle cx="40" cy="220" r="5" fill="#1d1d1d"/><text x="14" y="225" font-size="14" fill="#1d1d1d">x3</text>
<line x1="40" y1="60" x2="200" y2="28" stroke="#1d1d1d" stroke-width="1.2"/>
<line x1="40" y1="140" x2="196" y2="40" stroke="#1d1d1d" stroke-width="1.2"/>
<circle cx="198" cy="40" r="3.5" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.2"/>
<line x1="40" y1="220" x2="196" y2="52" stroke="#1d1d1d" stroke-width="1.2"/>
<circle cx="198" cy="52" r="3.5" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.2"/>
<rect x="202" y="20" width="40" height="40" rx="6" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.6"/>
<text x="222" y="45" font-size="11" text-anchor="middle" fill="#1d1d1d">AND</text>
<text x="222" y="15" font-size="11" text-anchor="middle" fill="#444444">x1 ~x2 ~x3</text>
<line x1="242" y1="40" x2="380" y2="130" stroke="#1d1d1d" stroke-width="1.2"/>
<line x1="40" y1="60" x2="196" y2="98" stroke="#1d1d1d" stroke-width="1.2"/>
<circle cx="198" cy="98" r="3.5" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.2"/>
<line x1="40" y1="140" x2="200" y2="110" stroke="#1d1d1d" stroke-width="1.2"/>
<line x1="40" y1="220" x2="196" y2="122" stroke="#1d1d1d" stroke-width="1.2"/>
<circle cx="198" cy="122" r="3.5" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.2"/>
<rect x="202" y="90" width="40" height="40" rx="6" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.6"/>
<text x="222" y="115" font-size="11" text-anchor="middle" fill="#1d1d1d">AND</text>
<text x="222" y="85" font-size="11" text-anchor="middle" fill="#444444">~x1 x2 ~x3</text>
<line x1="242" y1="110" x2="380" y2="140" stroke="#1d1d1d" stroke-width="1.2"/>
<line x1="40" y1="60" x2="196" y2="168" stroke="#1d1d1d" stroke-width="1.2"/>
<circle cx="198" cy="168" r="3.5" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.2"/>
<line x1="40" y1="140" x2="196" y2="180" stroke="#1d1d1d" stroke-width="1.2"/>
<circle cx="198" cy="180" r="3.5" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.2"/>
<line x1="40" y1="220" x2="200" y2="192" stroke="#1d1d1d" stroke-width="1.2"/>
<rect x="202" y="160" width="40" height="40" rx="6" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.6"/>
<text x="222" y="185" font-size="11" text-anchor="middle" fill="#1d1d1d">AND</text>
<text x="222" y="155" font-size="11" text-anchor="middle" fill="#444444">~x1 ~x2 x3</text>
<line x1="242" y1="180" x2="380" y2="150" stroke="#1d1d1d" stroke-width="1.2"/>
<line x1="40" y1="60" x2="200" y2="238" stroke="#1d1d1d" stroke-width="1.2"/>
<line x1="40" y1="140" x2="200" y2="250" stroke="#1d1d1d" stroke-width="1.2"/>
<line x1="40" y1="220" x2="200" y2="262" stroke="#1d1d1d" stroke-width="1.2"/>
<rect x="202" y="230" width="40" height="40" rx="6" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.6"/>
<text x="222" y="255" font-size="11" text-anchor="middle" fill="#1d1d1d">AND</text>
<text x="222" y="225" font-size="11" text-anchor="middle" fill="#444444">x1 x2 x3</text>
<line x1="242" y1="250" x2="380" y2="160" stroke="#1d1d1d" stroke-width="1.2"/>
<rect x="380" y="120" width="44" height="50" rx="20" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.6"/>
<text x="402" y="150" font-size="12" text-anchor="middle" fill="#1d1d1d">OR</text>
<line x1="424" y1="145" x2="470" y2="145" stroke="#1d1d1d" stroke-width="1.6"/>
<text x="474" y="139" font-size="12" fill="#1d1d1d">flag:</text><text x="474" y="155" font-size="12" fill="#1d1d1d">odd</text>
<text x="14" y="290" font-size="11" fill="#444444">open circle = NOT on that wire. Layer 1: AND gates. Layer 2: one OR gate. Depth 2, 5 gates.</text>
</svg>
