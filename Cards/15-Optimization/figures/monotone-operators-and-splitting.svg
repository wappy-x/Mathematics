<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" width="360" height="290" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title>Douglas-Rachford on three assets, drawn to scale in the plane where weights sum to 1: the simplex lies above the line where the Japan weight is 0, the ball of radius 0.15 round the model weights u crosses it in a thin lens, the shadow iterates x_k slide along the line from the holdings h to the answer w at the lens corner, and the governing sequence z_k runs off the simplex towards z*</title>
<rect x="0" y="0" width="360" height="290" fill="#ffffff"/>
<rect x="0" y="0" width="360" height="80.9" fill="#1d1d1d" fill-opacity="0.08"/>
<line x1="0" y1="80.9" x2="360" y2="80.9" stroke="#1d1d1d" stroke-width="2"/>
<circle cx="213.0" cy="160.5" r="97.5" fill="none" stroke="#1d1d1d" stroke-width="1.5"/>
<polyline points="75.1,80.9 128.5,111.7 163.6,130.4 186.1,143.3 210.1,160.4 227.1,178.3 235.4,191.1 238.0,195.8 238.3,196.2" fill="none" stroke="#1d1d1d" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="128.5" cy="111.7" r="2.5" fill="#1d1d1d"/>
<circle cx="163.6" cy="130.4" r="2.5" fill="#1d1d1d"/>
<circle cx="186.1" cy="143.3" r="2.5" fill="#1d1d1d"/>
<circle cx="238.3" cy="196.2" r="3.5" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="75.1" y1="80.9" x2="156.7" y2="80.9" stroke="#1d1d1d" stroke-width="5"/>
<circle cx="213.0" cy="160.5" r="3.5" fill="#1d1d1d"/>
<circle cx="75.1" cy="80.9" r="4.5" fill="#ffffff" stroke="#1d1d1d" stroke-width="2"/>
<circle cx="156.7" cy="80.9" r="5" fill="#1d1d1d"/>
<text x="10" y="20" fill="#1d1d1d">simplex: long only, weights sum to 1</text>
<text x="290" y="74" fill="#1d1d1d">Japan = 0</text>
<text x="16" y="70" fill="#1d1d1d">h, holdings</text>
<text x="128" y="54" fill="#1d1d1d">w, answer</text>
<text x="104" y="74" fill="#1d1d1d">x_k</text>
<text x="146" y="182" fill="#1d1d1d">u, model</text>
<text x="98" y="130" fill="#1d1d1d">z_k</text>
<text x="246" y="202" fill="#1d1d1d">z*</text>
<text x="10" y="280" fill="#1d1d1d">ball: within 0.15 of u (3% tracking error)</text>
</svg>
