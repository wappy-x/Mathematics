<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" font-family="Helvetica, Arial, sans-serif">
<title>The eight valve patterns as points, demand shortfall across and pump power up; the lower edge of their hull crosses zero shortfall at 89 kW, 11 kW below the best real pattern, AB at 100 kW</title>
<rect x="0" y="0" width="360" height="260" fill="#ffffff"/>
<g stroke="#1d1d1d" stroke-width="1.5" fill="none">
<line x1="50" y1="210" x2="340" y2="210"/>
<line x1="50" y1="210" x2="50" y2="35"/>
<line x1="67.5" y1="210" x2="67.5" y2="214"/>
<line x1="155" y1="210" x2="155" y2="214"/>
<line x1="242.5" y1="210" x2="242.5" y2="214"/>
<line x1="330" y1="210" x2="330" y2="214"/>
<line x1="46" y1="160" x2="50" y2="160"/>
<line x1="46" y1="110" x2="50" y2="110"/>
<line x1="46" y1="60" x2="50" y2="60"/>
<line x1="155" y1="210" x2="155" y2="35" stroke-dasharray="2 4"/>
<polyline points="58.75,50 137.5,110 225,165 330,210" stroke-width="2"/>
<line x1="137.5" y1="110" x2="185" y2="110" stroke-dasharray="5 4"/>
<line x1="180" y1="110" x2="180" y2="121"/>
<line x1="155" y1="121" x2="185" y2="121" stroke-dasharray="5 4"/>
</g>
<g fill="#1d1d1d">
<circle cx="330" cy="210" r="3.5"/>
<circle cx="251.25" cy="150" r="3.5"/>
<circle cx="242.5" cy="155" r="3.5"/>
<circle cx="163.75" cy="95" r="3.5"/>
<circle cx="225" cy="165" r="3.5"/>
<circle cx="146.25" cy="105" r="3.5"/>
<circle cx="137.5" cy="110" r="3.5"/>
<circle cx="58.75" cy="50" r="3.5"/>
<circle cx="155" cy="121" r="3.5" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.5"/>
</g>
<g fill="#1d1d1d" font-size="13">
<text x="67.5" y="227" text-anchor="middle">−50</text>
<text x="155" y="227" text-anchor="middle">0</text>
<text x="242.5" y="227" text-anchor="middle">50</text>
<text x="330" y="227" text-anchor="middle">100</text>
<text x="195" y="245" text-anchor="middle">shortfall below demand, 100 − flow (L/s)</text>
<text x="42" y="214" text-anchor="end">0</text>
<text x="42" y="164" text-anchor="end">50</text>
<text x="42" y="114" text-anchor="end">100</text>
<text x="42" y="64" text-anchor="end">150</text>
<text x="56" y="24">pump power (kW)</text>
<text x="66" y="47">ABC</text>
<text x="131" y="124" text-anchor="end">AB</text>
<text x="146" y="96" text-anchor="middle">AC</text>
<text x="169" y="92">BC</text>
<text x="222" y="183" text-anchor="end">A</text>
<text x="238" y="150" text-anchor="end">B</text>
<text x="257" y="146">C</text>
<text x="326" y="200" text-anchor="end">none</text>
<text x="190" y="114">p* 100</text>
<text x="190" y="132">d* 89</text>
<text x="250" y="123">gap 11 kW</text>
