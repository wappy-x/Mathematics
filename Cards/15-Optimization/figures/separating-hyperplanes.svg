<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" font-family="Helvetica, Arial, sans-serif">
<title>Every blend of three beans fills a triangle of caffeine and cost; the spec at 18 g/kg and 5.50 pounds a kilo sits outside it, and a straight wall runs between them, at right angles to the gap from the spec to the closest blend</title>
<rect x="0" y="0" width="360" height="320" fill="#ffffff"/>
<g stroke="#1d1d1d" stroke-width="1.5" fill="none">
<line x1="40" y1="270" x2="320" y2="270"/>
<line x1="40" y1="270" x2="40" y2="30"/>
<line x1="80" y1="270" x2="80" y2="275"/><line x1="120" y1="270" x2="120" y2="275"/><line x1="160" y1="270" x2="160" y2="275"/><line x1="200" y1="270" x2="200" y2="275"/><line x1="240" y1="270" x2="240" y2="275"/><line x1="280" y1="270" x2="280" y2="275"/><line x1="320" y1="270" x2="320" y2="275"/>
<line x1="35" y1="250" x2="40" y2="250"/><line x1="35" y1="210" x2="40" y2="210"/><line x1="35" y1="170" x2="40" y2="170"/><line x1="35" y1="130" x2="40" y2="130"/><line x1="35" y1="90" x2="40" y2="90"/><line x1="35" y1="50" x2="40" y2="50"/>
<polygon points="280,230 100,170 60,50" fill="#1d1d1d" fill-opacity="0.12" stroke-width="2"/>
<line x1="200" y1="220" x2="205" y2="205" stroke-width="2"/>
<line x1="60" y1="165" x2="320" y2="251.67" stroke-dasharray="6 4" stroke-width="2"/>
</g>
<g fill="#1d1d1d">
<circle cx="280" cy="230" r="3.5"/><circle cx="100" cy="170" r="3.5"/><circle cx="60" cy="50" r="3.5"/>
<circle cx="205" cy="205" r="3"/>
<circle cx="200" cy="220" r="4" fill="#ffffff" stroke="#1d1d1d" stroke-width="2"/>
</g>
<g fill="#1d1d1d" font-size="13">
<text x="286" y="226">Robusta</text>
<text x="108" y="166">Brazil</text>
<text x="68" y="48">Ethiopia</text>
<text x="190" y="240" text-anchor="end">spec</text>
<text x="214" y="198">closest blend</text>
<text x="44" y="155">wall</text>
<text x="40" y="288" text-anchor="middle">10</text><text x="120" y="288" text-anchor="middle">14</text><text x="200" y="288" text-anchor="middle">18</text><text x="280" y="288" text-anchor="middle">22</text>
<text x="32" y="254" text-anchor="end">4</text><text x="32" y="174" text-anchor="end">8</text><text x="32" y="94" text-anchor="end">12</text>
<text x="180" y="310" text-anchor="middle">caffeine, g per kg</text>
<text x="14" y="150" text-anchor="middle" transform="rotate(-90 14 150)">cost, £ per kg</text>
</g>
</svg>
