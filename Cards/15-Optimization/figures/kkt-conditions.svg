<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" width="360" height="340" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title>Pump powers drawn to scale: the demand line, the two pressure caps, the allowed stretch of the demand line, and the cost curve of 12.50 pounds an hour passing through x*</title>
<rect x="0" y="0" width="360" height="340" fill="#ffffff"/>
<line x1="40" y1="300" x2="335" y2="300" stroke="#1d1d1d" stroke-width="1.2"/>
<line x1="40" y1="300" x2="40" y2="10" stroke="#1d1d1d" stroke-width="1.2"/>
<line x1="180" y1="300" x2="180" y2="305" stroke="#1d1d1d" stroke-width="1.2"/>
<line x1="320" y1="300" x2="320" y2="305" stroke="#1d1d1d" stroke-width="1.2"/>
<line x1="35" y1="160" x2="40" y2="160" stroke="#1d1d1d" stroke-width="1.2"/>
<line x1="35" y1="20" x2="40" y2="20" stroke="#1d1d1d" stroke-width="1.2"/>
<text x="40" y="317" text-anchor="middle" fill="#1d1d1d">0</text>
<text x="180" y="317" text-anchor="middle" fill="#1d1d1d">5</text>
<text x="320" y="317" text-anchor="middle" fill="#1d1d1d">10</text>
<text x="31" y="165" text-anchor="end" fill="#1d1d1d">5</text>
<text x="31" y="25" text-anchor="end" fill="#1d1d1d">10</text>
<text x="190" y="334" text-anchor="middle" fill="#1d1d1d">pump A power x1, kW</text>
<text x="14" y="160" text-anchor="middle" fill="#1d1d1d" transform="rotate(-90 14 160)">pump B power x2, kW</text>
<path d="M 220.7 300 A 180.7 221.4 0 0 0 40 78.6" fill="none" stroke="#1d1d1d" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="40" y1="20" x2="320" y2="300" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="40" y1="125" x2="320" y2="195" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="180" y1="20" x2="273.3" y2="300" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="180" y1="160" x2="250" y2="230" stroke="#1d1d1d" stroke-width="5"/>
<circle cx="180" cy="160" r="4" fill="#1d1d1d"/>
<circle cx="152" cy="132" r="3.5" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.5"/>
<text x="75" y="45" fill="#1d1d1d">demand 10 kW</text>
<text x="195" y="40" fill="#1d1d1d">cap at node 2</text>
<text x="262" y="172" fill="#1d1d1d">cap at node 1</text>
<text x="268" y="232" fill="#1d1d1d">allowed splits</text>
<text x="174" y="180" text-anchor="end" fill="#1d1d1d">x*</text>
<text x="146" y="139" text-anchor="end" fill="#1d1d1d">no cap</text>
<text x="212" y="290" text-anchor="end" fill="#1d1d1d">cost £12.50 an hour</text>
</svg>
