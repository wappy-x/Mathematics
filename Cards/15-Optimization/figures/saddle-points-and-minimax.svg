<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" font-family="Helvetica, Arial, sans-serif">
<title>The pump Lagrangian over total flow T from 70 to 130 L/s and price lambda from 1.6 to 3.2 kW per L/s: the level line L = 120 kW is two straight lines crossing at the saddle (100, 2.4), and the planner's dashed best-reply line passes through the same point, as does the dotted line lambda = 2.4</title>
<rect x="0" y="0" width="360" height="250" fill="#ffffff"/>
<polygon points="190,102.5 330,63.125 330,190 190,190" fill="#1d1d1d" fill-opacity="0.12"/>
<polygon points="190,102.5 50,141.875 50,15 190,15" fill="#1d1d1d" fill-opacity="0.12"/>
<g stroke="#1d1d1d" stroke-width="1.5" fill="none">
<line x1="50" y1="190" x2="330" y2="190"/>
<line x1="50" y1="190" x2="50" y2="15"/>
<line x1="190" y1="190" x2="190" y2="194"/>
<line x1="330" y1="190" x2="330" y2="194"/>
<line x1="46" y1="102.5" x2="50" y2="102.5"/>
<line x1="46" y1="15" x2="50" y2="15"/>
<line x1="50" y1="102.5" x2="330" y2="102.5" stroke-dasharray="2 3"/>
<line x1="190" y1="15" x2="190" y2="190" stroke-width="2"/>
<line x1="50" y1="141.875" x2="330" y2="63.125" stroke-width="2"/>
<line x1="50" y1="181.25" x2="330" y2="23.75" stroke-dasharray="6 4"/>
<line x1="40" y1="236" x2="64" y2="236" stroke-dasharray="6 4"/>
<line x1="225" y1="236" x2="249" y2="236" stroke-width="2"/>
</g>
<circle cx="190" cy="102.5" r="4" fill="#1d1d1d"/>
<g fill="#1d1d1d" font-size="13">
<text x="50" y="207" text-anchor="middle">70</text>
<text x="190" y="207" text-anchor="middle">100</text>
<text x="330" y="207" text-anchor="middle">130</text>
<text x="190" y="223" text-anchor="middle">total flow T delivered, L/s</text>
<text x="43" y="194" text-anchor="end">1.6</text>
<text x="43" y="107" text-anchor="end">2.4</text>
<text x="43" y="20" text-anchor="end">3.2</text>
<text x="16" y="102" text-anchor="middle" transform="rotate(-90 16 102)">price λ, kW per L/s</text>
<text x="70" y="42">ℒ &gt; 120</text>
<text x="255" y="165">ℒ &gt; 120</text>
<text x="200" y="35">ℒ &lt; 120</text>
<text x="128" y="182">ℒ &lt; 120</text>
<text x="198" y="124">saddle (100, 2.4)</text>
<text x="70" y="240">planner's best reply</text>
<text x="255" y="240">ℒ = 120 kW</text>
</g>
</svg>
