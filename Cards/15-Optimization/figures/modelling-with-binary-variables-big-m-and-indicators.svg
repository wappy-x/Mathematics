<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -16 360 256" width="360" height="256">
<title>To scale: acts booked n against the stage-2 switch y; the relaxed region for M = 4 has a slanted edge from (8, 0) to (12, 1), and M = 100 adds the whole hatched triangle between that edge and a dashed edge, corners (8, 0), (12, 0.04) and (12, 1)</title>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#1d1d1d" stroke-width="1"/></pattern></defs>
<rect x="0" y="-16" width="360" height="256" fill="#ffffff"/>
<polygon points="60,200 220,200 300,60 60,60" fill="#1d1d1d" fill-opacity="0.10" stroke="#1d1d1d" stroke-width="2"/>
<polygon points="220,200 300,194.4 300,60" fill="url(#hatch)" stroke="none"/>
<polyline points="220,200 300,194.4 300,60" fill="none" stroke="#1d1d1d" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="60" y1="200" x2="312" y2="200" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="60" y1="200" x2="60" y2="52" stroke="#1d1d1d" stroke-width="1.5"/>
<g fill="#1d1d1d">
<circle cx="60" cy="200" r="2.5"/><circle cx="80" cy="200" r="2.5"/><circle cx="100" cy="200" r="2.5"/><circle cx="120" cy="200" r="2.5"/><circle cx="140" cy="200" r="2.5"/><circle cx="160" cy="200" r="2.5"/><circle cx="180" cy="200" r="2.5"/><circle cx="200" cy="200" r="2.5"/><circle cx="220" cy="200" r="2.5"/>
<circle cx="60" cy="60" r="2.5"/><circle cx="80" cy="60" r="2.5"/><circle cx="100" cy="60" r="2.5"/><circle cx="120" cy="60" r="2.5"/><circle cx="140" cy="60" r="2.5"/><circle cx="160" cy="60" r="2.5"/><circle cx="180" cy="60" r="2.5"/><circle cx="200" cy="60" r="2.5"/><circle cx="220" cy="60" r="2.5"/><circle cx="240" cy="60" r="2.5"/><circle cx="260" cy="60" r="2.5"/><circle cx="280" cy="60" r="2.5"/><circle cx="300" cy="60" r="2.5"/>
</g>
<circle cx="280" cy="95" r="5" fill="#ffffff" stroke="#1d1d1d" stroke-width="2"/>
<circle cx="300" cy="194.4" r="5" fill="#ffffff" stroke="#1d1d1d" stroke-width="2"/>
<g font-family="sans-serif" font-size="13" fill="#1d1d1d">
<text x="60" y="1">solid edge: n = 8 + 4y (M = 4)</text>
<text x="60" y="16">dashed edge: n = 8 + 100y (M = 100)</text>
<text x="60" y="31">hatched: what M = 100 adds</text>
<text x="60" y="46">lower circle: M = 100 best (12, 0.04)</text>
<text x="270" y="99" text-anchor="end">M = 4 best (11, 0.75)</text>
<text x="60" y="216" text-anchor="middle">0</text>
<text x="140" y="216" text-anchor="middle">4</text>
<text x="220" y="216" text-anchor="middle">8</text>
<text x="300" y="216" text-anchor="middle">12</text>
<text x="180" y="234" text-anchor="middle">n, acts booked</text>
<text x="50" y="204" text-anchor="end">0</text>
<text x="50" y="64" text-anchor="end">1</text>
<text x="44" y="134" text-anchor="end">y</text>
</g>
</svg>
