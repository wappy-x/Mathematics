</g>
<circle cx="152" cy="176" r="3.5" fill="#1d1d1d"/>
<g fill="#1d1d1d" font-size="13">
<text x="40" y="227" text-anchor="middle">0</text>
<text x="152" y="227" text-anchor="middle">40</text>
<text x="236" y="227" text-anchor="middle">70</text>
<text x="320" y="227" text-anchor="middle">100</text>
