<line x1="40" y1="210" x2="40" y2="35"/>
<line x1="152" y1="210" x2="152" y2="214"/>
<line x1="236" y1="210" x2="236" y2="214"/>
<line x1="320" y1="210" x2="320" y2="214"/>
<line x1="36" y1="167.5" x2="40" y2="167.5"/>
<line x1="36" y1="125" x2="40" y2="125"/>
<line x1="36" y1="82.5" x2="40" y2="82.5"/>
<line x1="36" y1="40" x2="40" y2="40"/>
<polyline points="40,125 152,176 236,150.5 320,48.5" stroke-width="2"/>
<g stroke-dasharray="5 4">
<line x1="96" y1="167.5" x2="208" y2="184.5"/>
