<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" font-family="Helvetica, Arial, sans-serif">
<title>Net weekly bean cost F(q) against kilos of Kenyan bought, with a kink at 40 kg and three supporting lines through it, slopes -1, 0 and +1</title>
