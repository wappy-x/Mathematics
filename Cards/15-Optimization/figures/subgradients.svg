<text x="33" y="214" text-anchor="end">1000</text>
<text x="33" y="171" text-anchor="end">1100</text>
<text x="33" y="129" text-anchor="end">1200</text>
<text x="33" y="86" text-anchor="end">1300</text>
<text x="33" y="44" text-anchor="end">1400</text>
