<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" width="360" height="250" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title>The workshop's feasible plans, to scale: a shaded quadrilateral with corners (0, 0), (40, 0), (32, 16) and (0, 32), cut by the timber and finish lines, with the labour line touching it only at (40, 0) and the dashed £928 profit line touching it at (32, 16)</title>
<rect x="0" y="0" width="360" height="250" fill="#ffffff"/>
<polygon points="50,210 210,210 178,146 50,82" fill="#1d1d1d" fill-opacity="0.12" stroke="#1d1d1d" stroke-width="2"/>
<line x1="50" y1="210" x2="330" y2="210" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="50" y1="210" x2="50" y2="30" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="120" y1="30" x2="210" y2="210" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="150" y1="30" x2="210" y2="210" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="50" y1="82" x2="306" y2="210" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="114" y1="85.2" x2="242" y2="206.8" stroke="#1d1d1d" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="178" cy="146" r="3.5" fill="#1d1d1d"/>
<text x="114" y="44" text-anchor="end" fill="#1d1d1d">timber</text>
<text x="160" y="44" fill="#1d1d1d">labour</text>
<text x="276" y="186" fill="#1d1d1d">finish</text>
<text x="246" y="200" fill="#1d1d1d">£928</text>
<text x="196" y="148" fill="#1d1d1d">(32, 16)</text>
<text x="44" y="86" text-anchor="end" fill="#1d1d1d">(0, 32)</text>
<text x="44" y="226" text-anchor="end" fill="#1d1d1d">(0, 0)</text>
<text x="210" y="226" text-anchor="middle" fill="#1d1d1d">(40, 0)</text>
<text x="330" y="244" text-anchor="end" fill="#1d1d1d">tables a week, x1</text>
<text x="56" y="24" fill="#1d1d1d">chairs a week, x2</text>
</svg>
