<g stroke="#1d1d1d" stroke-width="1.5" fill="none">
<line x1="40" y1="270" x2="340" y2="270"/>
<line x1="40" y1="270" x2="40" y2="6"/>
<line x1="70" y1="270" x2="70" y2="274"/>
<line x1="130" y1="270" x2="130" y2="274"/>
<line x1="190" y1="270" x2="190" y2="274"/>
<line x1="250" y1="270" x2="250" y2="274"/>
<line x1="310" y1="270" x2="310" y2="274"/>
<line x1="36" y1="258" x2="40" y2="258"/>
<line x1="36" y1="198" x2="40" y2="198"/>
<line x1="36" y1="138" x2="40" y2="138"/>
<line x1="36" y1="78" x2="40" y2="78"/>
<line x1="36" y1="18" x2="40" y2="18"/>
<ellipse cx="190" cy="138" rx="147.0" ry="84.9" transform="rotate(-45 190 138)" stroke-width="1" stroke-opacity="0.55"/>
<ellipse cx="190" cy="138" rx="73.5" ry="42.4" transform="rotate(-45 190 138)" stroke-width="1" stroke-opacity="0.55"/>
<ellipse cx="190" cy="138" rx="36.7" ry="21.2" transform="rotate(-45 190 138)" stroke-width="1" stroke-opacity="0.55"/>
<polyline points="70,198 160,198 160,153 182.5,153 182.5,141.75 188.125,141.75" stroke-dasharray="5 4"/>
<polyline points="70,198 160,198 190,138" stroke-width="2.5"/>
</g>
<circle cx="70" cy="198" r="3.5" fill="#1d1d1d"/>
<circle cx="190" cy="138" r="4" fill="#1d1d1d"/>
<g fill="#1d1d1d" font-size="13">
<text x="70" y="288" text-anchor="middle">15</text>
<text x="130" y="288" text-anchor="middle">16</text>
<text x="190" y="288" text-anchor="middle">17</text>
<text x="250" y="288" text-anchor="middle">18</text>
<text x="310" y="288" text-anchor="middle">19</text>
<text x="33" y="262" text-anchor="end">14</text>
