<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 350" font-family="Helvetica, Arial, sans-serif">
<title>Contours of the two-reading smoothing cost around its lowest point (17, 16): conjugate gradient reaches it from (15, 15) in two moves, gradient descent zigzags</title>
