<text x="33" y="82" text-anchor="end">17</text>
<text x="33" y="22" text-anchor="end">18</text>
<text x="190" y="306" text-anchor="middle">first smoothed reading, u (°C)</text>
<text x="14" y="138" text-anchor="middle" transform="rotate(-90 14 138)">second, v (°C)</text>
<text x="76" y="215">start (15, 15)</text>
<text x="168" y="215">first move, shared</text>
<text x="200" y="130">answer (17, 16)</text>
<text x="40" y="326">solid: conjugate gradient, 2 moves</text>
<text x="40" y="343">dashed: gradient descent, zigzag</text>
</g>
</svg>
