<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" width="360" height="250" font-family="Helvetica, Arial, sans-serif">
<title>Brazil's cost f(x) = 8x + 0.05x squared for 0 to 40 kg, with the line of slope 11 pounds a kilo pushed up until it touches the curve at 30 kg and 285 pounds; the line crosses the vertical axis at minus 45 pounds, which is minus f*(11)</title>
<rect x="0" y="0" width="360" height="250" fill="#ffffff"/>
<g stroke="#1d1d1d" stroke-width="1.5" fill="none">
<line x1="50" y1="190" x2="325" y2="190"/>
<line x1="50" y1="215" x2="50" y2="24"/>
<line x1="115" y1="190" x2="115" y2="194"/>
<line x1="180" y1="190" x2="180" y2="194"/>
<line x1="245" y1="190" x2="245" y2="194"/>
<line x1="310" y1="190" x2="310" y2="194"/>
<line x1="46" y1="110" x2="50" y2="110"/>
<line x1="46" y1="30" x2="50" y2="30"/>
<polyline points="50,190 82.5,173.5 115,156 147.5,137.5 180,118 212.5,97.5 245,76 277.5,53.5 310,30" stroke-width="2"/>
<line x1="50" y1="208" x2="310" y2="32" stroke-dasharray="6 4"/>
</g>
<circle cx="245" cy="76" r="3.5" fill="#1d1d1d"/>
<circle cx="50" cy="208" r="3.5" fill="#1d1d1d"/>
<g fill="#1d1d1d" font-size="13">
<text x="58" y="40">solid: Brazil's cost f(x)</text>
<text x="58" y="56">dashed: a line of slope 11</text>
<text x="238" y="70" text-anchor="end">touches at 30 kg, 285</text>
<text x="62" y="217">starts at -45 = -f*(11)</text>
<text x="44" y="194" text-anchor="end">0</text>
<text x="44" y="114" text-anchor="end">200</text>
<text x="44" y="34" text-anchor="end">400</text>
<text x="115" y="230" text-anchor="middle">10</text>
<text x="180" y="230" text-anchor="middle">20</text>
<text x="245" y="230" text-anchor="middle">30</text>
<text x="310" y="230" text-anchor="middle">40</text>
<text x="185" y="246" text-anchor="middle">kilos bought from Brazil, x (kg); cost in pounds</text>
</g>
</svg>
