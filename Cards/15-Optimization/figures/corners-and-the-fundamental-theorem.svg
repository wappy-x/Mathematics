<circle cx="338" cy="215" r="4" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.5"/>
<text x="112" y="26" font-size="13" text-anchor="middle" fill="#1d1d1d" font-family="sans-serif">timber</text>
