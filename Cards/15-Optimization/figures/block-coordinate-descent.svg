<ellipse cx="150" cy="125" rx="61.24" ry="35.36" transform="rotate(45 150 125)" fill="none" stroke="currentColor" stroke-width="1.5"/>
<ellipse cx="150" cy="125" rx="30.62" ry="17.68" transform="rotate(45 150 125)" fill="none" stroke="currentColor" stroke-width="1.5"/>
