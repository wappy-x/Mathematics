<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" width="360" height="290" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title>The three-asset weight triangle, to scale: one Frank-Wolfe step from corner e1 lands on the projection of t; from the centre, plain steps zigzag while away steps reach it in two</title>
<rect x="0" y="0" width="360" height="290" fill="#ffffff"/>
<polygon points="50.0,240.0 290.0,240.0 170.0,32.2" fill="#1d1d1d" fill-opacity="0.06" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="50.0" y1="240.0" x2="134.0" y2="240.0" stroke="#e76f51" stroke-width="4"/>
<line x1="134.0" y1="260.8" x2="134.0" y2="240.0" stroke="#1d1d1d" stroke-width="1.5" stroke-dasharray="3 3"/>
<polyline points="170.0,170.7 104.0,208.8 141.7,215.1 123.0,220.2 138.6,222.0" fill="none" stroke="#264653" stroke-width="1.5"/>
<polyline points="170.0,170.7 170.0,240.0 134.0,240.0" fill="none" stroke="#2a9d8f" stroke-width="2" stroke-dasharray="7 4"/>
<circle cx="104.0" cy="208.8" r="2.5" fill="#264653"/><circle cx="141.7" cy="215.1" r="2.5" fill="#264653"/><circle cx="123.0" cy="220.2" r="2.5" fill="#264653"/><circle cx="138.6" cy="222.0" r="2.5" fill="#264653"/>
<circle cx="170.0" cy="170.7" r="3.5" fill="#1d1d1d"/>
<circle cx="134.0" cy="240.0" r="4.5" fill="#1d1d1d"/>
<circle cx="134.0" cy="260.8" r="4" fill="#ffffff" stroke="#1d1d1d" stroke-width="1.5"/>
<text x="42.0" y="258.0" fill="#1d1d1d">e1</text>
<text x="284.0" y="258.0" fill="#1d1d1d">e2</text>
<text x="180.0" y="36.2" fill="#1d1d1d">e3</text>
<text x="144" y="277" fill="#1d1d1d">t (outside)</text>
<text x="141" y="256" fill="#1d1d1d">w*</text>
<text x="178.0" y="166.7" fill="#1d1d1d">centre</text>
<text x="16" y="40" fill="#264653">plain steps: zigzag</text>
<text x="16" y="58" fill="#2a9d8f">away steps: 2 moves</text>
<text x="62" y="232" fill="#e76f51" font-size="12">step 1</text>
</svg>
