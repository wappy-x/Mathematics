<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title>The workshop's allowed plans drawn to scale, tables across and chairs up: the four-cornered region, the timber, labour and finish lines, and at the best corner (32, 16) the profit direction (19, 20) built as 3 times the timber direction (4, 2) plus 7 times the finish direction (1, 2)</title>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d1d1d"/></marker></defs>
<rect x="0" y="0" width="360" height="260" fill="#ffffff"/>
<polygon points="40,215 240,215 200,135 40,55" fill="#1d1d1d" fill-opacity="0.12" stroke="none"/>
<line x1="40" y1="215" x2="345" y2="215" stroke="#1d1d1d" stroke-width="1.2"/>
<line x1="40" y1="215" x2="40" y2="12" stroke="#1d1d1d" stroke-width="1.2"/>
<line x1="140" y1="215" x2="140" y2="220" stroke="#1d1d1d" stroke-width="1.2"/>
<line x1="240" y1="215" x2="240" y2="220" stroke="#1d1d1d" stroke-width="1.2"/>
<line x1="340" y1="215" x2="340" y2="220" stroke="#1d1d1d" stroke-width="1.2"/>
<line x1="35" y1="115" x2="40" y2="115" stroke="#1d1d1d" stroke-width="1.2"/>
<line x1="35" y1="15" x2="40" y2="15" stroke="#1d1d1d" stroke-width="1.2"/>
<text x="40" y="232" text-anchor="middle" fill="#1d1d1d">0</text>
<text x="140" y="232" text-anchor="middle" fill="#1d1d1d">20</text>
<text x="240" y="232" text-anchor="middle" fill="#1d1d1d">40</text>
<text x="340" y="232" text-anchor="middle" fill="#1d1d1d">60</text>
<text x="31" y="120" text-anchor="end" fill="#1d1d1d">20</text>
<text x="31" y="20" text-anchor="end" fill="#1d1d1d">40</text>
<text x="190" y="252" text-anchor="middle" fill="#1d1d1d">tables x1</text>
<text x="14" y="115" text-anchor="middle" fill="#1d1d1d" transform="rotate(-90 14 115)">chairs x2</text>
<line x1="240" y1="215" x2="140" y2="15" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="240" y1="215" x2="173.3" y2="15" stroke="#1d1d1d" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="40" y1="55" x2="340" y2="205" stroke="#1d1d1d" stroke-width="1.5"/>
<line x1="200" y1="135" x2="295" y2="35" stroke="#1d1d1d" stroke-width="2" marker-end="url(#h)"/>
<line x1="200" y1="135" x2="260" y2="105" stroke="#1d1d1d" stroke-width="1.5" marker-end="url(#h)"/>
<line x1="200" y1="135" x2="235" y2="65" stroke="#1d1d1d" stroke-width="1.5" marker-end="url(#h)"/>
<line x1="260" y1="105" x2="295" y2="35" stroke="#1d1d1d" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="235" y1="65" x2="295" y2="35" stroke="#1d1d1d" stroke-width="1" stroke-dasharray="2 3"/>
<circle cx="200" cy="135" r="4" fill="#1d1d1d"/>
<text x="136" y="30" text-anchor="end" fill="#1d1d1d">timber 160 m</text>
<text x="182" y="30" fill="#1d1d1d">labour 120 h</text>
<text x="300" y="160" text-anchor="middle" fill="#1d1d1d">finish 64 litres</text>
