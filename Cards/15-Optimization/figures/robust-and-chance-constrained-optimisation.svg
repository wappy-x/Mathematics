<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240">
  <title>Box and ball of possible return estimates for two assets, with the worst point for a half-and-half plan</title>
  <rect x="0" y="0" width="360" height="240" fill="#ffffff"/>
  <rect x="120" y="60" width="120" height="120" fill="none" stroke="#1d1d1d" stroke-width="1.5"/>
  <circle cx="180" cy="120" r="60" fill="#1d1d1d" fill-opacity="0.08" stroke="#1d1d1d" stroke-width="2"/>
  <line x1="82.6" y1="107.4" x2="192.6" y2="217.4" stroke="#1d1d1d" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="180" y1="120" x2="137.6" y2="162.4" stroke="#1d1d1d" stroke-width="1.5"/>
  <circle cx="180" cy="120" r="3.5" fill="#1d1d1d"/>
  <circle cx="137.6" cy="162.4" r="3.5" fill="#1d1d1d"/>
  <circle cx="120" cy="180" r="3.5" fill="none" stroke="#1d1d1d" stroke-width="1.5"/>
  <text x="180" y="96" font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="middle">estimates</text>
  <text x="180" y="111" font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="middle">7.0, 7.4</text>
  <text x="246" y="70" font-family="sans-serif" font-size="13" fill="#1d1d1d">ball: radius 1</text>
  <text x="246" y="174" font-family="sans-serif" font-size="13" fill="#1d1d1d">box: each ±1</text>
  <text x="186" y="198" font-family="sans-serif" font-size="13" fill="#1d1d1d">ball worst 6.49%</text>
  <text x="112" y="196" font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="end">box worst 6.20%</text>
  <text x="200" y="232" font-family="sans-serif" font-size="13" fill="#1d1d1d" text-anchor="middle">UK shares estimate (%) →</text>
  <text x="10" y="22" font-family="sans-serif" font-size="13" fill="#1d1d1d">↑ World shares estimate (%)</text>
</svg>
