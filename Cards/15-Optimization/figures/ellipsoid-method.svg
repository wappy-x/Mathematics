<title>The workshop's region of plans to scale, tables across and chairs up, with the first ellipses of the ellipsoid method for a profit target of 900 pounds: the starting disc of radius 100 around the origin, the ellipses after one and two central cuts, and the small ellipse after 21 cuts whose centre (29.3879, 17.2231) is a plan earning 902.8308 pounds</title>
