<line x1="68" y1="204" x2="348" y2="44" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="180" y1="140" x2="180" y2="220" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 3"/>
<line x1="320" y1="52" x2="320" y2="220" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 3"/>
