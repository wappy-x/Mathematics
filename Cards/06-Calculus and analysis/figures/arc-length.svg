<circle cx="340" cy="118" r="3" fill="currentColor"/>
<text x="180" y="108" font-size="13" fill="currentColor" text-anchor="middle">tower to tower: 400 m</text>
<text x="188" y="138" font-size="13" fill="currentColor">sag 40 m</text>
<text x="180" y="176" font-size="13" fill="currentColor" text-anchor="middle">cable 410.424 m (solid)</text>
<text x="180" y="196" font-size="13" fill="currentColor" text-anchor="middle">four chords 409.80 m (dashed)</text>
