<polyline points="20.0,118.0 36.0,124.1 52.0,129.5 68.0,134.3 84.0,138.5 100.0,142.0 116.0,144.9 132.0,147.1 148.0,148.7 164.0,149.7 180.0,150.0 196.0,149.7 212.0,148.7 228.0,147.1 244.0,144.9 260.0,142.0 276.0,138.5 292.0,134.3 308.0,129.5 324.0,124.1 340.0,118.0" fill="none" stroke="currentColor" stroke-width="2"/>
<polyline points="20.0,118.0 100.0,142.0 180.0,150.0 260.0,142.0 340.0,118.0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
