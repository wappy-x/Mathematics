<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>The curve v = e^u for u from 0 to 1 cuts the 1 by e rectangle into the area under the curve, e minus 1, and the shaded area beside it, 1</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<polygon points="60,145 110,125.1 160,99.6 210,66.8 260,24.7 60,24.7" fill="currentColor" fill-opacity="0.12" stroke="none"/>
<line x1="60" y1="215" x2="310" y2="215" stroke="currentColor" stroke-width="1.5"/>
<line x1="60" y1="215" x2="60" y2="12" stroke="currentColor" stroke-width="1.5"/>
<polyline points="60,145 110,125.1 160,99.6 210,66.8 260,24.7" fill="none" stroke="currentColor" stroke-width="2"/>
<polyline points="60,24.7 260,24.7 260,215" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="46" y="149" font-size="13" fill="currentColor">1</text>
<text x="46" y="29" font-size="13" fill="currentColor">e</text>
<text x="56" y="232" font-size="13" fill="currentColor">0</text>
<text x="256" y="232" font-size="13" fill="currentColor">1</text>
<text x="284" y="232" font-size="13" fill="currentColor">u = x</text>
<text x="68" y="17" font-size="13" fill="currentColor">v = e^x</text>
<text x="72" y="62" font-size="14" fill="currentColor">∫ u dv = 1</text>
<text x="140" y="185" font-size="14" fill="currentColor">∫ v du = e − 1</text>
<text x="266" y="120" font-size="13" fill="currentColor">uv = e</text>
</svg>
