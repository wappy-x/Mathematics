<rect x="264" y="63" width="56" height="152" fill="currentColor" fill-opacity="0.12" stroke="none"/>
<polyline points="40,215 40,159 96,159 96,127 152,127 152,95 208,95 208,63 264,63 264,31 320,31 320,215" fill="none" stroke="currentColor" stroke-width="1.5"/>
<line x1="96" y1="159" x2="96" y2="215" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3,3"/>
