<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" style="color:#24292f">
<title>The stepped taxi fare as a staircase with a jump of 2 dollars at each whole kilometre, and the metered fare as a dashed straight line from 3 dollars at the kerb</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<line x1="40" y1="210" x2="334" y2="210" stroke="currentColor" stroke-width="1.5"/>
<line x1="40" y1="210" x2="40" y2="22" stroke="currentColor" stroke-width="1.5"/>
<line x1="120" y1="210" x2="120" y2="215" stroke="currentColor" stroke-width="1.5"/>
<line x1="200" y1="210" x2="200" y2="215" stroke="currentColor" stroke-width="1.5"/>
<line x1="280" y1="210" x2="280" y2="215" stroke="currentColor" stroke-width="1.5"/>
<text x="120" y="230" font-size="13" text-anchor="middle" fill="currentColor">1 km</text>
<text x="200" y="230" font-size="13" text-anchor="middle" fill="currentColor">2 km</text>
<text x="280" y="230" font-size="13" text-anchor="middle" fill="currentColor">3 km</text>
<text x="32" y="166" font-size="13" text-anchor="end" fill="currentColor">3</text>
<text x="32" y="134" font-size="13" text-anchor="end" fill="currentColor">5</text>
<text x="32" y="102" font-size="13" text-anchor="end" fill="currentColor">7</text>
<text x="32" y="70" font-size="13" text-anchor="end" fill="currentColor">9</text>
<text x="32" y="38" font-size="13" text-anchor="end" fill="currentColor">11</text>
<line x1="40" y1="162" x2="320" y2="50" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="44" y1="130" x2="120" y2="130" stroke="currentColor" stroke-width="2"/>
<line x1="124" y1="98" x2="200" y2="98" stroke="currentColor" stroke-width="2"/>
<line x1="204" y1="66" x2="280" y2="66" stroke="currentColor" stroke-width="2"/>
<line x1="284" y1="34" x2="320" y2="34" stroke="currentColor" stroke-width="2"/>
<circle cx="40" cy="162" r="4" fill="currentColor" stroke="currentColor" stroke-width="1.5"/>
<circle cx="40" cy="130" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
<circle cx="120" cy="130" r="4" fill="currentColor" stroke="currentColor" stroke-width="1.5"/>
<circle cx="120" cy="98" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
<circle cx="200" cy="98" r="4" fill="currentColor" stroke="currentColor" stroke-width="1.5"/>
<circle cx="200" cy="66" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
<circle cx="280" cy="66" r="4" fill="currentColor" stroke="currentColor" stroke-width="1.5"/>
<circle cx="280" cy="34" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="330" y="58" font-size="13" fill="currentColor">M</text>
<text x="326" y="30" font-size="13" fill="currentColor">S</text>
</svg>
