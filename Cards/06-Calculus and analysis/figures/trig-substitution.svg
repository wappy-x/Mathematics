<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>A pond of radius 3 m drawn to scale, with the measuring line through the centre O, a point P on the bank above x = 1.5 m, its foot Q on the line, the radius OP, the angle theta between the dashed upright and OP, and a thin strip of width 0.25 m ending at P</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<circle cx="180" cy="124" r="96" fill="none" stroke="currentColor" stroke-width="1.5"/>
<line x1="84" y1="124" x2="276" y2="124" stroke="currentColor" stroke-width="2"/>
<line x1="180" y1="124" x2="180" y2="28" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="220" y="40.86" width="8" height="83.14" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<line x1="180" y1="124" x2="228" y2="40.86" stroke="currentColor" stroke-width="2"/>
<line x1="228" y1="40.86" x2="228" y2="124" stroke="currentColor" stroke-width="2"/>
<path d="M 180 100 A 24 24 0 0 1 192 103.22" fill="none" stroke="currentColor" stroke-width="1.5"/>
<circle cx="180" cy="124" r="3" fill="currentColor"/>
<circle cx="228" cy="40.86" r="3.5" fill="currentColor"/>
<text x="166" y="142" font-size="14" fill="currentColor">O</text>
<text x="234" y="36" font-size="14" fill="currentColor">P</text>
<text x="232" y="142" font-size="14" fill="currentColor">Q</text>
<text x="184" y="95" font-size="13" fill="currentColor">θ</text>
<text x="199" y="72" font-size="13" text-anchor="end" fill="currentColor">3</text>
<text x="200" y="142" font-size="13" fill="currentColor">x</text>
<text x="8" y="20" font-size="13" fill="currentColor">radius 3 m</text>
<text x="8" y="232" font-size="13" fill="currentColor">OQ = 3 sin θ, QP = 3 cos θ</text>
</svg>
