<line x1="40" y1="210" x2="320" y2="30" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="71.2" y1="207.3" x2="127.2" y2="171.3" stroke="currentColor" stroke-width="2"/>
<line x1="232.8" y1="68.7" x2="288.8" y2="32.7" stroke="currentColor" stroke-width="2"/>
