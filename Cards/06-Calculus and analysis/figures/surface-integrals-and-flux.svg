<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>Side view from the east: the taut tarp rising 2.25 m over 3 m, its normal arrow, rain slanting north, and the tarp's shadow cast along the rain onto the ground</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<line x1="10" y1="200" x2="350" y2="200" stroke="currentColor" stroke-width="1.5"/>
<rect x="40" y="200" width="247.5" height="6" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<line x1="40" y1="200" x2="220" y2="65" stroke="currentColor" stroke-width="2"/>
<line x1="220" y1="65" x2="220" y2="200" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3,3"/>
<line x1="190" y1="5" x2="287.5" y2="200" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6,4"/>
<line x1="10" y1="140" x2="40" y2="200" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6,4"/>
<line x1="130" y1="132.5" x2="100" y2="92.5" stroke="currentColor" stroke-width="2"/>
<polyline points="108.8,95.9 100,92.5 100.8,101.9" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="84" y="88" font-size="13" fill="currentColor">N</text>
<text x="40" y="30" font-size="13" fill="currentColor">rain: 0.5 m north</text>
<text x="40" y="46" font-size="13" fill="currentColor">per 1 m down</text>
<text x="100" y="182" font-size="13" fill="currentColor">tarp, 3.75 m of slope</text>
<text x="214" y="140" font-size="13" fill="currentColor" text-anchor="end">2.25 m</text>
<text x="80" y="226" font-size="13" fill="currentColor">shadow along the rain</text>
</svg>
