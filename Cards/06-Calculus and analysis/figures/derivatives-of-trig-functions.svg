<circle cx="120" cy="130" r="80" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3"/>
<line x1="30" y1="130" x2="215" y2="130" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="30" y1="90" x2="215" y2="90" stroke="currentColor" stroke-width="2"/>
<line x1="120" y1="90" x2="120" y2="34" stroke="currentColor" stroke-width="2"/>
<rect x="95" y="14" width="50" height="20" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<line x1="120" y1="130" x2="189.28" y2="90" stroke="currentColor" stroke-width="2"/>
<line x1="189.28" y1="90" x2="189.28" y2="130" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="189.28" y1="90" x2="189.28" y2="55.36" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 2"/>
<path d="M 150 130 A 30 30 0 0 0 145.98 115" fill="none" stroke="currentColor" stroke-width="1.5"/>
<line x1="189.28" y1="90" x2="171.28" y2="58.82" stroke="currentColor" stroke-width="2"/>
<polygon points="169.28,55.36 176.74,60.29 169.82,64.29" fill="currentColor"/>
<circle cx="120" cy="130" r="3" fill="currentColor"/>
<circle cx="189.28" cy="90" r="4" fill="currentColor"/>
<text x="152" y="29" font-size="13" fill="currentColor">piston</text>
<text x="32" y="84" font-size="13" fill="currentColor">slotted yoke</text>
<text x="156" y="126" font-size="13" fill="currentColor">30°</text>
<text x="124" y="148" font-size="13" fill="currentColor">centre</text>
<text x="196" y="116" font-size="13" fill="currentColor">height 2 cm</text>
<text x="196" y="62" font-size="13" fill="currentColor">rise 1.73 cm</text>
<text x="196" y="78" font-size="13" fill="currentColor">per half radian</text>
