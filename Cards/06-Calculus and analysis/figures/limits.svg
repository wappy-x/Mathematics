<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" style="color:#24292f">
<title>The line y = x + 1 with a hole at (1, 2); a horizontal band of outputs within 0.5 of 2 and a vertical window of inputs within 0.5 of 1; inside the window the line stays inside the band</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<rect x="50" y="45" width="280" height="70" fill="currentColor" fill-opacity="0.12" stroke="none"/>
<rect x="85" y="10" width="70" height="210" fill="currentColor" fill-opacity="0.12" stroke="none"/>
<line x1="50" y1="220" x2="330" y2="220" stroke="currentColor" stroke-width="1.5"/>
<line x1="50" y1="220" x2="50" y2="10" stroke="currentColor" stroke-width="1.5"/>
<line x1="50" y1="150" x2="116.5" y2="83.5" stroke="currentColor" stroke-width="2"/>
<line x1="123.5" y1="76.5" x2="190" y2="10" stroke="currentColor" stroke-width="2"/>
<circle cx="120" cy="80" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
<line x1="85" y1="220" x2="85" y2="225" stroke="currentColor" stroke-width="1.5"/>
<line x1="120" y1="220" x2="120" y2="225" stroke="currentColor" stroke-width="1.5"/>
<line x1="155" y1="220" x2="155" y2="225" stroke="currentColor" stroke-width="1.5"/>
<text x="76" y="236" font-size="13" fill="currentColor">0.5</text>
<text x="116" y="236" font-size="13" fill="currentColor">1</text>
<text x="146" y="236" font-size="13" fill="currentColor">1.5</text>
<text x="338" y="224" font-size="13" fill="currentColor">x</text>
<text x="24" y="49" font-size="13" fill="currentColor">2.5</text>
<text x="36" y="84" font-size="13" fill="currentColor">2</text>
<text x="24" y="119" font-size="13" fill="currentColor">1.5</text>
<text x="200" y="84" font-size="13" fill="currentColor">band: within 0.5 of 2</text>
<text x="200" y="24" font-size="13" fill="currentColor">window: within 0.5 of 1</text>
<text x="128" y="150" font-size="13" fill="currentColor">hole: no value at 1</text>
</svg>
