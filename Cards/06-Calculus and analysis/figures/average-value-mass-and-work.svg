<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>Side view of the cone-shaped tank, point down, 4 m deep with a 2 m rim radius, full of water, with one thin layer at height 2 m and its 2 m lift to the rim marked</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<polygon points="100,50 260,50 180,210" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="2"/>
<polygon points="140,130 220,130 225,120 135,120" fill="currentColor" fill-opacity="0.4" stroke="currentColor" stroke-width="1.5"/>
<line x1="60" y1="50" x2="100" y2="50" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="60" y1="210" x2="180" y2="210" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="60" y1="50" x2="60" y2="210" stroke="currentColor" stroke-width="1.5"/>
<line x1="260" y1="50" x2="290" y2="50" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="225" y1="120" x2="290" y2="120" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="290" y1="50" x2="290" y2="120" stroke="currentColor" stroke-width="1.5"/>
<text x="180" y="38" font-size="13" fill="currentColor" text-anchor="middle">pumped out over the rim</text>
<text x="180" y="72" font-size="13" fill="currentColor" text-anchor="middle">rim radius 2 m</text>
<text x="24" y="134" font-size="13" fill="currentColor">4 m</text>
<text x="296" y="80" font-size="13" fill="currentColor">lift</text>
<text x="296" y="96" font-size="13" fill="currentColor">4 − y</text>
<text x="296" y="112" font-size="13" fill="currentColor">= 2 m</text>
<text x="232" y="146" font-size="13" fill="currentColor">layer, y = 2 m</text>
<text x="180" y="228" font-size="13" fill="currentColor" text-anchor="middle">tip, y = 0</text>
</svg>
