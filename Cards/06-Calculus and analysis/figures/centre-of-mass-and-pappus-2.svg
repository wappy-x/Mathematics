<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>A half-disc of radius 0.1 m on its flat edge, with one horizontal strip at height 0.08 m and the centroid 0.0424 m up</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<path d="M 80 200 A 100 100 0 0 1 280 200 Z" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="2"/>
<line x1="20" y1="200" x2="340" y2="200" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6,4"/>
<line x1="120" y1="120" x2="240" y2="120" stroke="currentColor" stroke-width="2"/>
<circle cx="180" cy="157.56" r="3.5" fill="currentColor"/>
<text x="250" y="116" font-size="13" fill="currentColor">strip at 0.08 m</text>
<text x="190" y="162" font-size="13" fill="currentColor">centroid, 0.0424 m up</text>
<text x="20" y="192" font-size="13" fill="currentColor">spin axis</text>
