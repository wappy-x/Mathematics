<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>Plan view of the field: pylon A at the south-west corner, pylon B 400 m east and 300 m north, rock east of 200 m, the straight route dashed and the cheapest bent route solid</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<rect x="170" y="30" width="120" height="180" fill="currentColor" fill-opacity="0.12" stroke="none"/>
<rect x="50" y="30" width="240" height="180" fill="none" stroke="currentColor" stroke-width="1"/>
<line x1="170" y1="30" x2="170" y2="210" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="50" y1="210" x2="290" y2="30" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4" fill="none"/>
<polyline points="50,210 170,77.8 290,30" stroke="currentColor" stroke-width="2" fill="none"/>
<circle cx="50" cy="210" r="4" fill="currentColor"/>
<circle cx="290" cy="30" r="4" fill="currentColor"/>
<text x="34" y="206" font-size="14" fill="currentColor">A</text>
<text x="298" y="34" font-size="14" fill="currentColor">B</text>
<text x="58" y="46" font-size="13" fill="currentColor">grass, £80 a metre</text>
<text x="180" y="200" font-size="13" fill="currentColor">rock, £160 a metre</text>
<text x="46" y="224" font-size="13" fill="currentColor">0</text>
<text x="160" y="224" font-size="13" fill="currentColor">200</text>
<text x="278" y="224" font-size="13" fill="currentColor">400</text>
<text x="110" y="236" font-size="13" fill="currentColor">x, metres east of A</text>
<text x="18" y="38" font-size="13" fill="currentColor">300</text>
<text x="24" y="170" font-size="13" fill="currentColor" transform="rotate(-90 24 170)">y, metres north</text>
</svg>
