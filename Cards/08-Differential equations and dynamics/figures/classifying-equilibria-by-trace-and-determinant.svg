<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>The trace-determinant chart: trace across, determinant up, with the parabola det = trace^2/4 dividing spirals above from nodes below, saddles below the trace axis, and the four examples plotted: rooms at (-4, 3), shock absorber at (-2, 5), spring at (0, 1), saddle at (0, -1)</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<line x1="20" y1="180" x2="340" y2="180" stroke="currentColor" stroke-width="1"/>
<line x1="180" y1="10" x2="180" y2="232" stroke="currentColor" stroke-width="1"/>
<path d="M 30 30 Q 180 330 330 30" fill="none" stroke="currentColor" stroke-width="1.5"/>
<circle cx="60" cy="108" r="4" fill="currentColor"/>
<circle cx="120" cy="60" r="4" fill="currentColor"/>
<circle cx="180" cy="156" r="4" fill="currentColor"/>
<circle cx="180" cy="204" r="4" fill="currentColor"/>
<text x="54" y="112" font-size="13" text-anchor="end" fill="currentColor">rooms</text>
<text x="114" y="58" font-size="13" text-anchor="end" fill="currentColor">shock</text>
<text x="114" y="72" font-size="13" text-anchor="end" fill="currentColor">absorber</text>
<text x="188" y="152" font-size="13" fill="currentColor">spring</text>
<text x="188" y="214" font-size="13" fill="currentColor">saddle</text>
<text x="172" y="40" font-size="13" text-anchor="end" fill="currentColor">stable spirals</text>
<text x="188" y="40" font-size="13" fill="currentColor">unstable spirals</text>
<text x="22" y="150" font-size="13" fill="currentColor">stable</text>
<text x="22" y="164" font-size="13" fill="currentColor">nodes</text>
<text x="338" y="150" font-size="13" text-anchor="end" fill="currentColor">unstable</text>
<text x="338" y="164" font-size="13" text-anchor="end" fill="currentColor">nodes</text>
<text x="24" y="224" font-size="13" fill="currentColor">saddles</text>
<text x="340" y="198" font-size="13" text-anchor="end" fill="currentColor">trace (1/time)</text>
<text x="186" y="20" font-size="13" fill="currentColor">det (1/time^2)</text>
</svg>
