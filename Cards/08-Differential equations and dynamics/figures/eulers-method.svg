<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>One Euler step of 2 s from rest along the tangent, against the true speed curve of the skydiver</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<line x1="50" y1="200" x2="340" y2="200" stroke="currentColor" stroke-width="1"/>
<line x1="50" y1="200" x2="50" y2="30" stroke="currentColor" stroke-width="1"/>
<line x1="190" y1="200" x2="190" y2="205" stroke="currentColor" stroke-width="1"/>
<line x1="330" y1="200" x2="330" y2="205" stroke="currentColor" stroke-width="1"/>
<line x1="45" y1="120" x2="50" y2="120" stroke="currentColor" stroke-width="1"/>
<line x1="45" y1="40" x2="50" y2="40" stroke="currentColor" stroke-width="1"/>
<text x="50" y="218" font-size="13" fill="currentColor" text-anchor="middle">0</text>
<text x="190" y="218" font-size="13" fill="currentColor" text-anchor="middle">1</text>
<text x="330" y="218" font-size="13" fill="currentColor" text-anchor="middle">2</text>
<text x="42" y="124" font-size="13" fill="currentColor" text-anchor="end">10</text>
<text x="42" y="44" font-size="13" fill="currentColor" text-anchor="end">20</text>
<text x="190" y="234" font-size="13" fill="currentColor" text-anchor="middle">time since the jump (s)</text>
<text x="14" y="120" font-size="13" fill="currentColor" text-anchor="middle" transform="rotate(-90 14 120)">speed (m/s)</text>
<polyline points="50.0,200.0 85.0,180.9 120.0,162.7 155.0,145.4 190.0,128.9 225.0,113.3 260.0,98.4 295.0,84.2 330.0,70.8" fill="none" stroke="currentColor" stroke-width="2"/>
<line x1="50" y1="200" x2="330" y2="43.2" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="330" y1="43.2" x2="330" y2="70.8" stroke="currentColor" stroke-width="2"/>
<text x="60" y="30" font-size="13" fill="currentColor">dashed: one Euler step, to 19.6 m/s</text>
<text x="60" y="48" font-size="13" fill="currentColor">solid: exact, 16.15 m/s at 2 s</text>
<text x="60" y="66" font-size="13" fill="currentColor">gap at 2 s: 3.45 m/s</text>
</svg>
