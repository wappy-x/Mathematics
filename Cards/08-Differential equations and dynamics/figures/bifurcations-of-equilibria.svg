<circle cx="285" cy="120" r="4" fill="currentColor"/>
<circle cx="249" cy="88" r="4" fill="currentColor"/>
<circle cx="249" cy="152" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
