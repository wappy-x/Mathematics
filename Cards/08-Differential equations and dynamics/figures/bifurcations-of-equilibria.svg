<polygon points="289,70 299,70 294,80" fill="currentColor"/>
<polygon points="289,160 299,160 294,170" fill="currentColor"/>
<text x="54" y="204" font-size="13" fill="currentColor" text-anchor="end">0</text>
<text x="54" y="124" font-size="13" fill="currentColor" text-anchor="end">0.5</text>
<text x="54" y="44" font-size="13" fill="currentColor" text-anchor="end">1</text>
<text x="60" y="216" font-size="13" fill="currentColor" text-anchor="middle">0</text>
<text x="249" y="216" font-size="13" fill="currentColor" text-anchor="middle">0.21</text>
<text x="288" y="216" font-size="13" fill="currentColor" text-anchor="start">0.25</text>
