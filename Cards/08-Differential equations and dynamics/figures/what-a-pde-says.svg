<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>Three regions drawn to scale, each 1 m wide: the rod and the string as strips in place and time, open at the top because time runs on; the plate as a square. Thick edges carry a condition: the rod's start and ends, the string's start and ends, all four edges of the plate.</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<rect x="20" y="100" width="90" height="90" fill="currentColor" fill-opacity="0.12" stroke="none"/>
<rect x="135" y="100" width="90" height="90" fill="currentColor" fill-opacity="0.12" stroke="none"/>
<rect x="250" y="100" width="90" height="90" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="2"/>
<polyline points="20,100 20,190 110,190 110,100" fill="none" stroke="currentColor" stroke-width="2"/>
<polyline points="135,100 135,190 225,190 225,100" fill="none" stroke="currentColor" stroke-width="2"/>
<line x1="135" y1="194" x2="225" y2="194" stroke="currentColor" stroke-width="2"/>
<polygon points="15,100 25,100 20,90" fill="currentColor"/>
<polygon points="105,100 115,100 110,90" fill="currentColor"/>
<polygon points="130,100 140,100 135,90" fill="currentColor"/>
<polygon points="220,100 230,100 225,90" fill="currentColor"/>
<text x="65" y="50" font-size="14" text-anchor="middle" fill="currentColor">rod</text>
<text x="180" y="50" font-size="14" text-anchor="middle" fill="currentColor">string</text>
<text x="295" y="50" font-size="14" text-anchor="middle" fill="currentColor">plate</text>
<text x="65" y="70" font-size="13" text-anchor="middle" fill="currentColor">u_t = u_xx</text>
<text x="180" y="70" font-size="13" text-anchor="middle" fill="currentColor">u_tt = u_xx</text>
<text x="295" y="70" font-size="13" text-anchor="middle" fill="currentColor">u_xx + u_yy = 0</text>
<text x="65" y="210" font-size="13" text-anchor="middle" fill="currentColor">start</text>
<text x="180" y="210" font-size="13" text-anchor="middle" fill="currentColor">shape, speed</text>
<text x="295" y="210" font-size="13" text-anchor="middle" fill="currentColor">edges only</text>
<text x="65" y="230" font-size="13" text-anchor="middle" fill="currentColor">x, 0 to 1 m</text>
<text x="180" y="230" font-size="13" text-anchor="middle" fill="currentColor">x, 0 to 1 m</text>
<text x="295" y="230" font-size="13" text-anchor="middle" fill="currentColor">x, 0 to 1 m</text>
<text x="12" y="150" font-size="13" text-anchor="middle" fill="currentColor">t</text>
<text x="127" y="150" font-size="13" text-anchor="middle" fill="currentColor">t</text>
<text x="242" y="150" font-size="13" text-anchor="middle" fill="currentColor">y</text>
</svg>
