<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>One two-second skydiver step: the exact speed curve, Euler's step and the Heun step</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<line x1="45" y1="200" x2="255" y2="200" stroke="currentColor" stroke-width="1"/>
<line x1="45" y1="200" x2="45" y2="18" stroke="currentColor" stroke-width="1"/>
<polyline points="45,200 95,158.0 145,120.1 195,85.7 245,54.6" fill="none" stroke="currentColor" stroke-width="2"/>
<line x1="45" y1="200" x2="245" y2="23.6" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="45" y1="200" x2="245" y2="58.9" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 3"/>
<circle cx="245" cy="23.6" r="3" fill="currentColor"/>
<circle cx="245" cy="54.6" r="3" fill="currentColor"/>
<circle cx="245" cy="58.9" r="3" fill="currentColor"/>
<circle cx="145" cy="111.8" r="3" fill="currentColor"/>
<text x="253" y="28" font-size="13" fill="currentColor">Euler 19.60</text>
<text x="253" y="50" font-size="13" fill="currentColor">exact 16.15</text>
<text x="253" y="70" font-size="13" fill="currentColor">Heun 15.68</text>
<text x="136" y="104" font-size="13" fill="currentColor" text-anchor="end">half-step 9.80</text>
<text x="45" y="216" font-size="13" fill="currentColor" text-anchor="middle">0</text>
<text x="145" y="216" font-size="13" fill="currentColor" text-anchor="middle">1</text>
<text x="245" y="216" font-size="13" fill="currentColor" text-anchor="middle">2</text>
<text x="145" y="234" font-size="13" fill="currentColor" text-anchor="middle">time since the jump (s)</text>
<text x="38" y="204" font-size="13" fill="currentColor" text-anchor="end">0</text>
<text x="38" y="114" font-size="13" fill="currentColor" text-anchor="end">10</text>
<text x="38" y="24" font-size="13" fill="currentColor" text-anchor="end">20</text>
<text x="52" y="14" font-size="13" fill="currentColor">speed (m/s)</text>
</svg>
