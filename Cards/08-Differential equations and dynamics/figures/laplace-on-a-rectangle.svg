<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>The 1 m square plate drawn to scale, top edge at 100 C and the other three at 0 C, with the curves along which it reads 25, 50 and 75 C, and the centre marked on the 25 C curve</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<rect x="60" y="20" width="200" height="200" fill="none" stroke="currentColor" stroke-width="1.5"/>
<line x1="60" y1="20" x2="260" y2="20" stroke="currentColor" stroke-width="3"/>
<polyline points="80,63.7 100,92.3 120,108.7 140,117.3 160,120.0 180,117.3 200,108.7 220,92.3 240,63.7" fill="none" stroke="currentColor" stroke-width="1.5"/>
<polyline points="80,39.3 100,55.4 120,66.7 140,73.3 160,75.4 180,73.3 200,66.7 220,55.4 240,39.3" fill="none" stroke="currentColor" stroke-width="1.5"/>
<polyline points="80,28.1 100,35.3 120,40.8 140,44.3 160,45.5 180,44.3 200,40.8 220,35.3 240,28.1" fill="none" stroke="currentColor" stroke-width="1.5"/>
<circle cx="160" cy="120" r="3.5" fill="currentColor"/>
<text x="160" y="14" font-size="13" fill="currentColor" text-anchor="middle">100 C</text>
<text x="160" y="41" font-size="13" fill="currentColor" text-anchor="middle">75 C</text>
<text x="160" y="70" font-size="13" fill="currentColor" text-anchor="middle">50 C</text>
<text x="160" y="113" font-size="13" fill="currentColor" text-anchor="middle">25 C</text>
<text x="52" y="160" font-size="13" fill="currentColor" text-anchor="end">0 C</text>
<text x="268" y="160" font-size="13" fill="currentColor">0 C</text>
<text x="160" y="212" font-size="13" fill="currentColor" text-anchor="middle">0 C</text>
<text x="60" y="235" font-size="13" fill="currentColor" text-anchor="middle">0</text>
<text x="260" y="235" font-size="13" fill="currentColor" text-anchor="middle">1</text>
<text x="160" y="235" font-size="13" fill="currentColor" text-anchor="middle">x, m</text>
<text x="52" y="224" font-size="13" fill="currentColor" text-anchor="end">0</text>
<text x="52" y="28" font-size="13" fill="currentColor" text-anchor="end">1</text>
<text x="52" y="90" font-size="13" fill="currentColor" text-anchor="end">y, m</text>
</svg>
