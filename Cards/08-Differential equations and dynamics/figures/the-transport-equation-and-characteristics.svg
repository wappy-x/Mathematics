<text x="194" y="219" font-size="13" fill="currentColor" text-anchor="middle">5</text>
<text x="284" y="219" font-size="13" fill="currentColor" text-anchor="middle">10</text>
<text x="200" y="235" font-size="13" fill="currentColor" text-anchor="middle">x, km downstream</text>
<text x="40" y="204" font-size="13" fill="currentColor" text-anchor="end">0</text>
<text x="40" y="129" font-size="13" fill="currentColor" text-anchor="end">1</text>
<text x="40" y="54" font-size="13" fill="currentColor" text-anchor="end">2</text>
<text x="14" y="125" font-size="13" fill="currentColor" text-anchor="middle" transform="rotate(-90 14 125)">t, hours</text>
<text x="60" y="20" font-size="13" fill="currentColor">dashed: 2 km/h</text>
<text x="60" y="37" font-size="13" fill="currentColor">solid: 2 + x/2 km/h</text>
