<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>Characteristic lines of the river: straight dashed lines for a constant 2 km/h, fanning solid curves for a speed of 2 + x/2 km/h</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<line x1="50" y1="200" x2="340" y2="200" stroke="currentColor" stroke-width="1"/>
<line x1="50" y1="200" x2="50" y2="45" stroke="currentColor" stroke-width="1"/>
<line x1="104" y1="200" x2="104" y2="205" stroke="currentColor" stroke-width="1"/>
<line x1="194" y1="200" x2="194" y2="205" stroke="currentColor" stroke-width="1"/>
<line x1="284" y1="200" x2="284" y2="205" stroke="currentColor" stroke-width="1"/>
<line x1="45" y1="125" x2="50" y2="125" stroke="currentColor" stroke-width="1"/>
