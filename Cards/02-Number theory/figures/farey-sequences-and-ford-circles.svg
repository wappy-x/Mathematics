<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 415" width="900" height="415" font-family="Helvetica, Arial, sans-serif">
<title>Ford circles of order 5: each fraction p/q carries a circle of radius 1/(2q^2) resting on the line; the circles on 1/3 and 2/5 touch at (13/34, 1/34)</title>
<rect x="0" y="0" width="900" height="415" fill="#ffffff"/>
<line x1="30" y1="330" x2="870" y2="330" stroke="#1d1d1d" stroke-width="1.5"/>
<circle cx="50.00" cy="-70.00" r="400.00" fill="none" stroke="#1d1d1d" stroke-width="1.2"/>
<line x1="50.00" y1="330" x2="50.00" y2="336" stroke="#1d1d1d" stroke-width="1"/>
<text x="50.00" y="354" font-size="14" text-anchor="middle" fill="#1d1d1d">0/1</text>
<circle cx="210.00" cy="314.00" r="16.00" fill="none" stroke="#1d1d1d" stroke-width="1.2"/>
<line x1="210.00" y1="330" x2="210.00" y2="336" stroke="#1d1d1d" stroke-width="1"/>
<text x="210.00" y="354" font-size="14" text-anchor="middle" fill="#1d1d1d">1/5</text>
<circle cx="250.00" cy="305.00" r="25.00" fill="none" stroke="#1d1d1d" stroke-width="1.2"/>
<line x1="250.00" y1="330" x2="250.00" y2="336" stroke="#1d1d1d" stroke-width="1"/>
<text x="250.00" y="354" font-size="14" text-anchor="middle" fill="#1d1d1d">1/4</text>
<circle cx="316.67" cy="285.56" r="44.44" fill="none" stroke="#b3401f" stroke-width="2.6"/>
<line x1="316.67" y1="330" x2="316.67" y2="336" stroke="#1d1d1d" stroke-width="1"/>
<text x="316.67" y="354" font-size="14" text-anchor="middle" fill="#1d1d1d">1/3</text>
<circle cx="370.00" cy="314.00" r="16.00" fill="none" stroke="#b3401f" stroke-width="2.6"/>
<line x1="370.00" y1="330" x2="370.00" y2="336" stroke="#1d1d1d" stroke-width="1"/>
<text x="370.00" y="354" font-size="14" text-anchor="middle" fill="#1d1d1d">2/5</text>
<circle cx="450.00" cy="230.00" r="100.00" fill="none" stroke="#1d1d1d" stroke-width="1.2"/>
<line x1="450.00" y1="330" x2="450.00" y2="336" stroke="#1d1d1d" stroke-width="1"/>
<text x="450.00" y="354" font-size="14" text-anchor="middle" fill="#1d1d1d">1/2</text>
<circle cx="530.00" cy="314.00" r="16.00" fill="none" stroke="#1d1d1d" stroke-width="1.2"/>
<line x1="530.00" y1="330" x2="530.00" y2="336" stroke="#1d1d1d" stroke-width="1"/>
<text x="530.00" y="354" font-size="14" text-anchor="middle" fill="#1d1d1d">3/5</text>
<circle cx="583.33" cy="285.56" r="44.44" fill="none" stroke="#1d1d1d" stroke-width="1.2"/>
<line x1="583.33" y1="330" x2="583.33" y2="336" stroke="#1d1d1d" stroke-width="1"/>
<text x="583.33" y="354" font-size="14" text-anchor="middle" fill="#1d1d1d">2/3</text>
<circle cx="650.00" cy="305.00" r="25.00" fill="none" stroke="#1d1d1d" stroke-width="1.2"/>
<line x1="650.00" y1="330" x2="650.00" y2="336" stroke="#1d1d1d" stroke-width="1"/>
<text x="650.00" y="354" font-size="14" text-anchor="middle" fill="#1d1d1d">3/4</text>
<circle cx="690.00" cy="314.00" r="16.00" fill="none" stroke="#1d1d1d" stroke-width="1.2"/>
<line x1="690.00" y1="330" x2="690.00" y2="336" stroke="#1d1d1d" stroke-width="1"/>
<text x="690.00" y="354" font-size="14" text-anchor="middle" fill="#1d1d1d">4/5</text>
<circle cx="850.00" cy="-70.00" r="400.00" fill="none" stroke="#1d1d1d" stroke-width="1.2"/>
<line x1="850.00" y1="330" x2="850.00" y2="336" stroke="#1d1d1d" stroke-width="1"/>
<text x="850.00" y="354" font-size="14" text-anchor="middle" fill="#1d1d1d">1/1</text>
<circle cx="355.88" cy="306.47" r="3.5" fill="#1d1d1d"/>
<line x1="355.88" y1="306.47" x2="395.88" y2="370" stroke="#1d1d1d" stroke-width="0.8"/>
<text x="399.88" y="384" font-size="13" fill="#1d1d1d">touch at (13/34, 1/34)</text>
<text x="450" y="405" font-size="13" text-anchor="middle" fill="#1d1d1d">Radius 1/(2q²): 1/18 on 1/3, 1/50 on 2/5. The big circles on 0/1 and 1/1 (radius 1/2) run off the top.</text>
</svg>
