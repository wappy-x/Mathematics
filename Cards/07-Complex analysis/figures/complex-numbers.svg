<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>The drone z = 3 + 4i, its quarter turn iz = −4 + 3i, the multiplier w = 1 + 2i and the product zw = −5 + 10i, drawn to scale</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<line x1="20" y1="215" x2="340" y2="215" stroke="currentColor" stroke-width="1.5"/>
<line x1="200" y1="236" x2="200" y2="4" stroke="currentColor" stroke-width="1.5"/>
<text x="318" y="232" font-size="13" fill="currentColor">Re</text>
<text x="207" y="30" font-size="13" fill="currentColor">Im</text>
<text x="186" y="232" font-size="13" fill="currentColor">0</text>
<path d="M 260 135 A 100 100 0 0 0 120 155" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 4"/>
<polygon points="126,148 134,145 128,140" fill="currentColor"/>
<line x1="200" y1="215" x2="260" y2="135" stroke="currentColor" stroke-width="2"/>
<line x1="200" y1="215" x2="120" y2="155" stroke="currentColor" stroke-width="2"/>
<line x1="200" y1="215" x2="220" y2="175" stroke="currentColor" stroke-width="2"/>
<line x1="200" y1="215" x2="100" y2="15" stroke="currentColor" stroke-width="2"/>
<line x1="260" y1="135" x2="100" y2="15" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="200" cy="215" r="3.5" fill="currentColor"/>
<circle cx="260" cy="135" r="3.5" fill="currentColor"/>
<circle cx="120" cy="155" r="3.5" fill="currentColor"/>
<circle cx="220" cy="175" r="3.5" fill="currentColor"/>
<circle cx="100" cy="15" r="3.5" fill="currentColor"/>
<text x="268" y="139" font-size="13" fill="currentColor">z = 3 + 4i</text>
<text x="113" y="163" font-size="13" fill="currentColor" text-anchor="end">iz = −4 + 3i</text>
<text x="226" y="205" font-size="13" fill="currentColor">w = 1 + 2i</text>
<text x="93" y="19" font-size="13" fill="currentColor" text-anchor="end">zw = −5 + 10i</text>
<text x="222" y="80" font-size="13" fill="currentColor">+ 2(iz)</text>
</svg>
