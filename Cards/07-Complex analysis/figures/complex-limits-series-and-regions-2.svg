<line x1="180" y1="232" x2="180" y2="8" stroke="currentColor" stroke-width="1.5"/>
<circle cx="235.43" cy="88.00" r="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2,3"/>
<circle cx="235.43" cy="88.00" r="3.5" fill="currentColor"/>
