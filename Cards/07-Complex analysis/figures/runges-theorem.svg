<circle cx="178.8" cy="171.2" r="3" fill="#1d1d1d"/>
<line x1="200.0" y1="270.0" x2="200.0" y2="288.0" stroke="#1d1d1d" stroke-width="1.2" marker-end="url(#arr)"/>
<circle cx="200.0" cy="270.0" r="3.5" fill="#1d1d1d"/>
<circle cx="200.0" cy="180.0" r="3" fill="#1d1d1d"/>
