<circle cx="200.0" cy="120.0" r="3" fill="#1d1d1d"/>
<line x1="115.1" y1="65.1" x2="102.4" y2="52.4" stroke="#1d1d1d" stroke-width="1.2" marker-end="url(#arr)"/>
<circle cx="115.1" cy="65.1" r="3.5" fill="#1d1d1d"/>
<circle cx="178.8" cy="128.8" r="3" fill="#1d1d1d"/>
<line x1="80.0" y1="150.0" x2="62.0" y2="150.0" stroke="#1d1d1d" stroke-width="1.2" marker-end="url(#arr)"/>
