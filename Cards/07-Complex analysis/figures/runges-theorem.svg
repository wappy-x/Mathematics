<text x="186" y="166" fill="#1d1d1d">0</text>
<text x="210" y="142" fill="#1d1d1d">1/4</text>
<text x="264" y="105" fill="#1d1d1d">K: |z| = 1</text>
<text x="8" y="-14" fill="#1d1d1d">outer loop |z| = 2, run anticlockwise:</text>
<text x="8" y="0" fill="#1d1d1d">its poles pushed out to infinity</text>
<text x="8" y="306" fill="#1d1d1d">inner loop |z| = 1/2, run clockwise:</text>
