<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -30 400 360" width="400" height="360" font-family="Helvetica, Arial, sans-serif" font-size="11">
<title>Runge's theorem: the circle K, its hole, and the two loops whose Riemann-sum poles get pushed</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1d"/></marker></defs>
<rect x="0" y="-30" width="400" height="360" fill="#ffffff"/>
<circle cx="200" cy="150" r="120" fill="none" stroke="#1d1d1d" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="200" cy="150" r="60" fill="none" stroke="#1d1d1d" stroke-width="3"/>
<circle cx="200" cy="150" r="30" fill="none" stroke="#1d1d1d" stroke-width="1.5" stroke-dasharray="2 3"/>
<line x1="320.0" y1="150.0" x2="338.0" y2="150.0" stroke="#1d1d1d" stroke-width="1.2" marker-end="url(#arr)"/>
