<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>The eigenvector (1, −i) drawn entry by entry: the quarter turn sends the first entry 1 to i and the second entry −i to 1, each a quarter turn anticlockwise, to scale</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<line x1="25" y1="120" x2="170" y2="120" stroke="currentColor" stroke-width="1.5"/>
<line x1="90" y1="212" x2="90" y2="15" stroke="currentColor" stroke-width="1.5"/>
<line x1="205" y1="120" x2="350" y2="120" stroke="currentColor" stroke-width="1.5"/>
<line x1="270" y1="212" x2="270" y2="15" stroke="currentColor" stroke-width="1.5"/>
<text x="150" y="138" font-size="13" fill="currentColor">Re</text>
<text x="96" y="24" font-size="13" fill="currentColor">Im</text>
<text x="328" y="138" font-size="13" fill="currentColor">Re</text>
<text x="276" y="24" font-size="13" fill="currentColor">Im</text>
<line x1="90" y1="120" x2="150" y2="120" stroke="currentColor" stroke-width="2"/>
<line x1="90" y1="120" x2="90" y2="60" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/>
<circle cx="150" cy="120" r="3.5" fill="currentColor"/>
<circle cx="90" cy="60" r="3.5" fill="currentColor"/>
<path d="M 120 120 A 30 30 0 0 0 90 90" fill="none" stroke="currentColor" stroke-width="1.5"/>
<polygon points="89,90 97,85 97,95" fill="currentColor"/>
<text x="140" y="112" font-size="13" fill="currentColor">1</text>
<text x="97" y="58" font-size="13" fill="currentColor">i</text>
<line x1="270" y1="120" x2="270" y2="180" stroke="currentColor" stroke-width="2"/>
<line x1="270" y1="120" x2="330" y2="120" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/>
<circle cx="270" cy="180" r="3.5" fill="currentColor"/>
<circle cx="330" cy="120" r="3.5" fill="currentColor"/>
<path d="M 270 150 A 30 30 0 0 0 300 120" fill="none" stroke="currentColor" stroke-width="1.5"/>
<polygon points="300,119 295,127 305,127" fill="currentColor"/>
<text x="277" y="186" font-size="13" fill="currentColor">−i</text>
<text x="322" y="112" font-size="13" fill="currentColor">1</text>
<text x="20" y="232" font-size="13" fill="currentColor">first entry: 1 to i</text>
<text x="200" y="232" font-size="13" fill="currentColor">second entry: −i to 1</text>
</svg>
