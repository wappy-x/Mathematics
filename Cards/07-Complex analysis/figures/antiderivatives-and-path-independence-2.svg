<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>The unit circle split at 1 and minus 1: the upper half gives pi i for 1/z, the lower half gives minus pi i, with the origin marked</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<line x1="20" y1="120" x2="340" y2="120" stroke="currentColor" stroke-width="1.5"/>
<line x1="180" y1="232" x2="180" y2="8" stroke="currentColor" stroke-width="1.5"/>
<path d="M 260 120 A 80 80 0 0 0 100 120" fill="none" stroke="currentColor" stroke-width="2"/>
<path d="M 260 120 A 80 80 0 0 1 100 120" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6,4"/>
<polygon points="174,40 184,35 184,45" fill="currentColor"/>
<polygon points="174,200 184,195 184,205" fill="currentColor"/>
<circle cx="180" cy="120" r="3.5" fill="currentColor"/>
<circle cx="260" cy="120" r="3.5" fill="currentColor"/>
<circle cx="100" cy="120" r="3.5" fill="currentColor"/>
<text x="266" y="136" font-size="13" fill="currentColor">1</text>
<text x="74" y="136" font-size="13" fill="currentColor">−1</text>
<text x="186" y="136" font-size="13" fill="currentColor">0</text>
<text x="214" y="32" font-size="13" fill="currentColor">upper: πi</text>
<text x="214" y="226" font-size="13" fill="currentColor">lower: −πi</text>
<text x="322" y="136" font-size="13" fill="currentColor">Re</text>
<text x="186" y="18" font-size="13" fill="currentColor">Im</text>
</svg>
