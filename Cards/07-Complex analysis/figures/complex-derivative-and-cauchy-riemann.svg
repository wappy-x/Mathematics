<text x="206" y="124" font-size="13" fill="currentColor">1 + i, two steps</text>
<text x="66" y="94" font-size="13" fill="currentColor">2i: square</text>
<text x="188" y="44" font-size="13" fill="currentColor">east step</text>
<text x="30" y="36" font-size="13" fill="currentColor">north step</text>
