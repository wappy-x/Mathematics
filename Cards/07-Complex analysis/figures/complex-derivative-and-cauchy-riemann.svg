<line x1="180" y1="120" x2="200" y2="120" stroke="currentColor" stroke-width="2"/>
<polygon points="200,120 194,117 194,123" fill="currentColor"/>
<line x1="180" y1="120" x2="180" y2="100" stroke="currentColor" stroke-width="2"/>
<polygon points="180,100 177,106 183,106" fill="currentColor"/>
<circle cx="180" cy="120" r="3" fill="currentColor"/>
<line x1="140" y1="80" x2="180" y2="40" stroke="currentColor" stroke-width="2"/>
<polygon points="180,40 177.9,46.4 173.6,42.1" fill="currentColor"/>
