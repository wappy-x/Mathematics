<svg viewBox="0 0 360 250" xmlns="http://www.w3.org/2000/svg" width="360" height="250" style="color:#24292f">
<title>The poles of 1/(z^2 + 1) at i and minus i, with the circles |z - i| = 1, |z| = 3 and |z| = 1/2, all run anticlockwise</title><rect x="0" y="0" width="360" height="250" rx="8" fill="#ffffff"/>
<line x1="20" y1="125" x2="340" y2="125" stroke="currentColor" stroke-width="1.5"/>
<line x1="180" y1="244" x2="180" y2="6" stroke="currentColor" stroke-width="1.5"/>
<circle cx="180" cy="125" r="102" fill="none" stroke="currentColor" stroke-width="2"/>
<circle cx="180" cy="91" r="34" fill="none" stroke="currentColor" stroke-width="2"/>
<circle cx="180" cy="125" r="17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3,3"/>
<circle cx="180" cy="91" r="3.5" fill="currentColor"/>
<circle cx="180" cy="159" r="3.5" fill="currentColor"/>
<polygon points="247.88,48.63 257.07,52.17 251.42,57.82" fill="currentColor"/>
<polygon points="214,85 210,95 218,95" fill="currentColor"/>
<polygon points="187.78,108.74 196.97,112.27 191.31,117.93" fill="currentColor"/>
<text x="185" y="86" font-size="13" fill="currentColor">i</text>
<text x="186" y="172" font-size="13" fill="currentColor">−i</text>
<text x="221" y="104" font-size="13" fill="currentColor">|z − i| = 1</text>
<text x="262" y="40" font-size="13" fill="currentColor">|z| = 3</text>
<text x="84" y="118" font-size="13" fill="currentColor">|z| = 1/2</text>
<text x="322" y="141" font-size="13" fill="currentColor">Re</text>
<text x="186" y="16" font-size="13" fill="currentColor">Im</text>
</svg>
