<text x="322" y="138" font-size="13" fill="currentColor">Re</text>
<text x="158" y="16" font-size="13" fill="currentColor">Im</text>
<circle cx="180" cy="120" r="90" fill="none" stroke="currentColor" stroke-width="1.5"/>
<polygon points="270,120 135,42.1 135,197.9" fill="none" stroke="currentColor" stroke-width="2"/>
<polygon points="243.6,56.4 116.4,56.4 116.4,183.6 243.6,183.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/>
<circle cx="270" cy="120" r="4" fill="currentColor"/>
<circle cx="135" cy="42.1" r="4" fill="currentColor"/>
<circle cx="135" cy="197.9" r="4" fill="currentColor"/>
