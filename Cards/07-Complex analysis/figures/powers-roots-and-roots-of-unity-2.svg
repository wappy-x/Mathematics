<circle cx="116.4" cy="56.4" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
<circle cx="116.4" cy="183.6" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
<circle cx="243.6" cy="183.6" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="277" y="136" font-size="13" fill="currentColor">2</text>
<text x="128" y="36" font-size="13" fill="currentColor" text-anchor="end">−1 + 1.732i</text>
<text x="128" y="216" font-size="13" fill="currentColor" text-anchor="end">−1 − 1.732i</text>
<text x="251" y="50" font-size="13" fill="currentColor">1.414 + 1.414i</text>
