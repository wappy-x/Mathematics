<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" width="360" height="240" style="color:#24292f">
<title>The cube roots of 8 (a triangle) and the fourth roots of minus 16 (a square) on the same circle of radius 2, drawn to scale</title><rect x="0" y="0" width="360" height="240" rx="8" fill="#ffffff"/>
<line x1="20" y1="120" x2="340" y2="120" stroke="currentColor" stroke-width="1.5"/>
