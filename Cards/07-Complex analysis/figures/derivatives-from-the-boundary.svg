<circle cx="180" cy="120" r="80" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="2"/>
<polygon points="188,200 178,195 178,205" fill="currentColor"/>
<polygon points="100,120 260,120 180,40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4,4"/>
<polygon points="135,85 145.6,81.5 138.5,74.4" fill="currentColor"/>
<circle cx="180" cy="120" r="3.5" fill="currentColor"/>
