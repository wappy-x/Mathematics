<line x1="20" y1="190" x2="340" y2="190" stroke="currentColor" stroke-width="1.5"/>
<line x1="110" y1="232" x2="110" y2="12" stroke="currentColor" stroke-width="1.5"/>
<line x1="110" y1="190" x2="230" y2="70" stroke="currentColor" stroke-width="2"/>
<polyline points="110,190 230,190 230,70" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6,4"/>
<polygon points="174.24,125.76 170.71,136.37 163.64,129.29" fill="currentColor"/>
<polygon points="176,190 166,185 166,195" fill="currentColor"/>
<polygon points="230,124 225,134 235,134" fill="currentColor"/>
<circle cx="110" cy="190" r="3.5" fill="currentColor"/>
<circle cx="230" cy="190" r="3.5" fill="currentColor"/>
