<text x="94" y="208" font-size="13" fill="currentColor">0</text>
<text x="236" y="208" font-size="13" fill="currentColor">1</text>
<text x="238" y="66" font-size="14" fill="currentColor">1 + i</text>
<text x="118" y="112" font-size="13" fill="currentColor">straight</text>
<text x="240" y="140" font-size="13" fill="currentColor">broken</text>
<text x="322" y="206" font-size="13" fill="currentColor">Re</text>
<text x="116" y="22" font-size="13" fill="currentColor">Im</text>
