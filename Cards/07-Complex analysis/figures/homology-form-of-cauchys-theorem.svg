<svg viewBox="0 0 300 350" xmlns="http://www.w3.org/2000/svg" width="300" height="350" style="color:#24292f">
<title>The washer 1 &lt; |z| &lt; 3, shaded, with the circle of radius 2 run anticlockwise and the circle of radius 1.5 run clockwise, drawn to scale</title>
<rect x="0" y="0" width="300" height="350" rx="8" fill="#ffffff"/>
<path d="M 270 150 A 120 120 0 1 0 30 150 A 120 120 0 1 0 270 150 Z M 190 150 A 40 40 0 1 1 110 150 A 40 40 0 1 1 190 150 Z" fill="#d8dee4" fill-rule="evenodd" stroke="currentColor" stroke-width="1"/>
<line x1="10" y1="150" x2="290" y2="150" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="150" y1="290" x2="150" y2="10" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3"/>
<circle cx="150" cy="150" r="80" fill="none" stroke="currentColor" stroke-width="2.5"/>
<circle cx="150" cy="150" r="60" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/>
<polygon points="230,136 224,148 236,148" fill="currentColor"/>
<polygon points="210,164 204,152 216,152" fill="currentColor"/>
<circle cx="150" cy="150" r="3" fill="currentColor"/>
<circle cx="220" cy="150" r="3" fill="#ffffff" stroke="currentColor" stroke-width="1.5"/>
<text x="124" y="166" font-size="12" fill="currentColor">0</text>
<line x1="222" y1="153" x2="233" y2="164" stroke="currentColor" stroke-width="0.75"/>
<text x="234" y="174" font-size="11" fill="currentColor">1.75</text>
<text x="80" y="67" font-size="12" fill="currentColor">washer</text>
<text x="10" y="296" font-size="11" fill="currentColor">solid: C(2), anticlockwise, coefficient +1</text>
<text x="10" y="314" font-size="11" fill="currentColor">dashed: C(1.5), clockwise, coefficient −1</text>
<text x="10" y="332" font-size="11" fill="currentColor">white, not in U: hole |z| ≤ 1, outside |z| ≥ 3</text>
</svg>
