<svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg" width="360" height="200" style="color:#24292f">
<title>The first five solutions of e^(1/z) = 2 + 3i, on a circle through 0, crowding into the essential singularity at 0</title><rect x="0" y="0" width="360" height="200" rx="8" fill="#ffffff"/>
<line x1="15" y1="50" x2="350" y2="50" stroke="currentColor" stroke-width="1.5"/>
<line x1="90" y1="195" x2="90" y2="6" stroke="currentColor" stroke-width="1.5"/>
<path d="M 90 50 A 117 117 0 0 0 324 50" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4,4"/>
<circle cx="90" cy="50" r="30" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5"/>
<circle cx="237.4" cy="162.9" r="3.5" fill="currentColor"/>
<circle cx="97.1" cy="90.0" r="3" fill="currentColor"/>
<circle cx="92.1" cy="71.9" r="2.5" fill="currentColor"/>
<circle cx="91.0" cy="65.1" r="2.5" fill="currentColor"/>
<circle cx="90.6" cy="61.5" r="2.5" fill="currentColor"/>
<text x="245" y="180" font-size="14" fill="currentColor">z₀</text>
<text x="104" y="100" font-size="14" fill="currentColor">z₁</text>
<text x="76" y="44" font-size="13" fill="currentColor">0</text>
<text x="18" y="100" font-size="13" fill="currentColor">|z| = 0.1</text>
<text x="330" y="44" font-size="13" fill="currentColor">Re</text>
<text x="96" y="16" font-size="13" fill="currentColor">Im</text>
<text x="150" y="32" font-size="13" fill="currentColor">each dot: e^(1/z) = 2 + 3i</text>
</svg>
