<polyline points="180,120 174,116 168,124 162,116 156,124 150,116 144,124 138,116 132,124 126,116 120,124 114,116 108,124 102,116 96,124 90,116 84,124 78,116 72,124 66,116 60,124 54,116 48,124 42,116 36,124 30,116 24,124" fill="none" stroke="currentColor" stroke-width="2"/>
<path d="M 260 120 A 80 80 0 0 0 100 120" fill="none" stroke="currentColor" stroke-width="2"/>
<path d="M 260 120 A 80 80 0 0 1 100 120" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5,4"/>
<polygon points="172,40 183,35 183,45" fill="currentColor"/>
