<text x="92" y="142" font-size="13" fill="currentColor">−1</text>
<text x="196" y="30" font-size="13" fill="currentColor">up: iπ</text>
<text x="196" y="222" font-size="13" fill="currentColor">down: −iπ</text>
<text x="28" y="106" font-size="13" fill="currentColor">cut</text>
